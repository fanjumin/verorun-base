# ── 品牌展示小程序 提示词模板 ──

identifier: "mini_brand"
name: "品牌展示小程序"
description: "适用于企业官网、品牌宣传、作品展示"
icon: "🏢"
industry: "品牌"
tags:
  - "品牌"
  - "展示"
  - "小程序"
  - "企业"

# 小程序专属配置
mini_app:
  tabBar:
    default:
      - { label: "首页", icon: "home", page: "home" }
      - { label: "案例", icon: "star", page: "works" }
      - { label: "联系", icon: "chat", page: "contact" }

  supported_features:
    - chat
    - search

defaults:
  site_name: "{品牌名称}"
  industry: "品牌"
  style: "极简高端"
  primary_color: "#1F2937"
  accent_color: "#4F46E5"
  font_preference: "sans-serif"
  tone: "专业、高端、简洁"

pages:
  - id: "home"
    name: "首页"
    required: true
  - id: "works"
    name: "案例"
    required: true
  - id: "contact"
    name: "联系"
    required: true

prompts:
  parse: |
    你是一个小程序策划师。用户想创建一个{行业}展示小程序。

    用户描述：{用户输入}

    请提取以下信息并以 JSON 格式返回：
    {{
      "brand_name": "品牌名称",
      "tagline": "品牌口号（10字以内）",
      "industry_type": "所属行业",
      "target_audience": "目标客户群体",
      "style_preference": "现代/经典/极简/活泼",
      "special_requirements": "特殊需求"
    }}
    只返回 JSON，不要其他内容。

  brand: |
    你是一个品牌设计师。为【{品牌名称}】设计小程序品牌配置，行业为【{行业}】。

    要求：
    - 品牌口号：简洁有力，体现品牌定位
    - 品牌故事：150字左右，讲述品牌创立历程和理念
    - 主色调：适合{行业}的高端配色方案
    - 风格：{风格偏好}

    返回 JSON 格式：
    {{
      "app_name": "品牌名称",
      "tagline": "品牌口号",
      "brand_story": "品牌故事",
      "primary_color": "#HEX",
      "secondary_color": "#HEX",
      "accent_color": "#HEX"
    }}

  tabBar: |
    你是一个小程序设计师。为【{品牌名称}】设计底部 tabBar。

    可用的功能模块：{功能列表}

    返回 JSON 格式：
    {{
      "tabBar": [
        {{ "label": "首页", "icon": "home", "page": "home" }},
        {{ "label": "案例", "icon": "star", "page": "works" }},
        {{ "label": "联系", "icon": "chat", "page": "contact" }}
      ]
    }}

  page_home: |
    你是一个小程序设计师。为【{品牌名称}】生成首页内容。

    行业：{行业}，风格：{风格偏好}

    首页区块设计：
    1. Hero 区：品牌价值主张 + 核心业务简介
    2. 品牌介绍：简短介绍（成立时间、核心优势）
    3. 精选案例：3 个代表案例卡片
    4. 服务/产品亮点：3-4 个亮点展示

    返回 JSON 格式，包含 sections：
    {{
      "sections": [
        {{
          "block_type": "hero",
          "title": "主标题",
          "subtitle": "副标题",
          "cta_text": "了解更多",
          "cta_url": "/works"
        }},
        {{
          "block_type": "text",
          "title": "关于我们",
          "description": "品牌简介内容"
        }}
      ],
      "widgets": []
    }}

  page_works: |
    你是一个小程序设计师。为【{品牌名称}】生成案例展示页。

    要求：
    - 案例分类筛选
    - 案例卡片（标题、缩略图、简介、标签）
    - 案例详情内页
    - 【可选】搜索框：W12(搜索框，scope=works，placeholder="搜索案例...")

    返回 JSON 格式。

  page_contact: |
    你是一个小程序设计师。为【{品牌名称}】生成联系我们页面。

    要求：
    - 品牌信息（地址、电话、邮箱、工作时间）
    - 在线咨询入口（AI 对话按钮）
    - 地图/位置展示
    - 留言表单

    返回 JSON 格式。
