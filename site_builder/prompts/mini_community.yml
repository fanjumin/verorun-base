# ── 社区论坛小程序 提示词模板 ──

identifier: "mini_community"
name: "社区论坛小程序"
description: "适用于兴趣社区、知识分享、粉丝互动"
icon: "💬"
industry: "社区"
tags:
  - "社区"
  - "论坛"
  - "小程序"
  - "社交"

# 小程序专属配置
mini_app:
  tabBar:
    default:
      - { label: "首页", icon: "home", page: "home" }
      - { label: "话题", icon: "star", page: "topics" }
      - { label: "发布", icon: "chat", page: "post" }
      - { label: "我的", icon: "user", page: "profile" }

  supported_features:
    - chat
    - search
    - ads
    - reviews

defaults:
  site_name: "{品牌名称}"
  industry: "社区"
  style: "活泼现代"
  primary_color: "#7C3AED"
  accent_color: "#A78BFA"
  font_preference: "sans-serif"
  tone: "友好、活跃、包容"

pages:
  - id: "home"
    name: "首页"
    required: true
  - id: "topics"
    name: "话题"
    required: true
  - id: "post"
    name: "发布"
    required: true
  - id: "profile"
    name: "我的"
    required: true

prompts:
  parse: |
    你是一个小程序策划师。用户想创建一个{行业}社区小程序。

    用户描述：{用户输入}

    请提取以下信息并以 JSON 格式返回：
    {{
      "brand_name": "社区名称",
      "tagline": "社区口号（10字以内）",
      "community_type": "社区类型（技术/兴趣/地域/行业）",
      "target_audience": "目标用户群体",
      "style_preference": "现代/经典/极简/活泼",
      "features": ["需要的功能列表"],
      "special_requirements": "特殊需求"
    }}
    只返回 JSON，不要其他内容。

  brand: |
    你是一个品牌设计师。为【{品牌名称}】设计社区小程序品牌配置，类型为【{社区类型}】。

    要求：
    - 社区口号：简短有力，体现社区氛围
    - 社区介绍：150字左右，讲述社区定位和特色
    - 主色调：适合{社区类型}社区的活泼配色方案
    - 风格：{风格偏好}

    返回 JSON 格式：
    {{
      "app_name": "社区名称",
      "tagline": "社区口号",
      "brand_story": "社区介绍",
      "primary_color": "#HEX",
      "secondary_color": "#HEX",
      "accent_color": "#HEX"
    }}

  tabBar: |
    你是一个小程序设计师。为【{品牌名称}】设计底部 tabBar。

    可用的功能模块：{功能列表}

    返回 JSON 格式：
    {{
      "tabBar": [
        {{ "label": "首页", "icon": "home", "page": "home" }},
        {{ "label": "话题", "icon": "star", "page": "topics" }},
        {{ "label": "发布", "icon": "chat", "page": "post" }},
        {{ "label": "我的", "icon": "user", "page": "profile" }}
      ]
    }}

  page_home: |
    你是一个小程序设计师。为【{品牌名称}】生成首页内容。

    类型：{社区类型}，风格：{风格偏好}

    首页区块设计：
    1. Hero 区：社区名称 + 社区口号 + 加入按钮
    2. 热门话题：3-5 个热门话题卡片
    3. 【可选】如果用户提到"最新"或"动态"，插入 W01(最新文章，count=5)
    4. 推荐用户/达人展示
    5. 【可选】如果用户提到"广告"，插入 W08(广告位，position=home_banner, width=320)

    返回 JSON 格式，包含 sections 和 widgets：
    {{
      "sections": [
        {{
          "block_type": "hero",
          "title": "社区名称",
          "subtitle": "社区口号",
          "cta_text": "加入社区",
          "cta_url": "/topics"
        }},
        {{
          "block_type": "grid",
          "title": "热门话题",
          "items": [
            {{ "title": "话题1", "icon": "🔥", "description": "话题简介" }}
          ]
        }}
      ],
      "widgets": []
    }}

  page_topics: |
    你是一个小程序设计师。为【{品牌名称}】生成话题列表页。

    要求：
    - 话题分类标签（全部/技术/生活/问答/公告等）
    - 话题卡片（标题、摘要、作者、回复数、点赞数、时间）
    - 【可选】搜索框：W12(搜索框，scope=topics，placeholder="搜索话题...")
    - 排序切换（最新/最热）

    返回 JSON 格式。

  page_post: |
    你是一个小程序设计师。为【{品牌名称}】生成发布页面。

    要求：
    - 话题选择（下拉/标签选择已关注的话题）
    - 标题输入框
    - 正文编辑器
    - 图片上传入口
    - 发布按钮

    返回 JSON 格式。

  page_profile: |
    你是一个小程序设计师。为【{品牌名称}】生成个人中心页面。

    要求：
    - 用户头像/昵称/简介
    - 数据统计（发帖数、获赞数、关注数、粉丝数）
    - 我的帖子入口
    - 我的收藏入口
    - 草稿箱入口
    - 设置入口

    返回 JSON 格式。
