<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ app_name }} - AI Advisor</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <div class="line-app">
        <header class="line-header">
            <h1>{{ app_name }}</h1>
            <p class="line-subtitle">AI Advisor</p>
        </header>

        <main class="line-chat" id="chatContainer">
            <div class="line-messages" id="chatMessages">
                <div class="msg-assistant">
                    <div class="msg-bubble">
                        Hello! I'm your AI advisor. How can I help you today?
                    </div>
                </div>
            </div>

            <div class="line-input-area">
                <input type="text" id="chatInput" class="line-input"
                       placeholder="Type your question..." autocomplete="off">
                <button id="sendBtn" class="line-send-btn">Send</button>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        (async function() {
            const line = Object.create(LineMiniApp);
            line.baseURL = '{{ base_url }}';
            await line.init('{{ liff_id }}');
            await line.authenticate();

            const chat = new VeroChat({
                baseURL: '{{ base_url }}',
                token: line.token,
                platform: 'line'
            });

            const messagesEl = document.getElementById('chatMessages');
            const inputEl = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const history = [];
            let isStreaming = false;

            function appendMessage(role, content) {
                const div = document.createElement('div');
                div.className = role === 'user' ? 'msg-user' : 'msg-assistant';
                div.innerHTML = '<div class="msg-bubble">' + content + '</div>';
                messagesEl.appendChild(div);
                messagesEl.scrollTop = messagesEl.scrollHeight;
                return div.querySelector('.msg-bubble');
            }

            async function sendMessage() {
                const text = inputEl.value.trim();
                if (!text || isStreaming) return;
                inputEl.value = '';
                appendMessage('user', text);
                history.push({ role: 'user', content: text });
                isStreaming = true;
                sendBtn.disabled = true;
                const msgEl = appendMessage('assistant', '');
                let reply = '';
                await chat.streamChat(text, history.slice(0, -1),
                    (token) => { reply += token; msgEl.textContent = reply; messagesEl.scrollTop = messagesEl.scrollHeight; },
                    (result) => { history.push({ role: 'assistant', content: reply }); isStreaming = false; sendBtn.disabled = false; }
                );
            }

            sendBtn.addEventListener('click', sendMessage);
            inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
        })();
    </script>
</body>
</html>
