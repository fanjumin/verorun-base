<!--
  Phase 0 — 诊断：dump @xyflow/react v12 所有导出
  打开浏览器 → F12 Console 查看完整输出
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>React Flow v12 导出诊断</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, sans-serif; background:#f8fafc; color:#1e293b; padding:20px; }
h1 { font-size:18px; margin-bottom:12px; }
pre { background:#1e293b; color:#e2e8f0; padding:16px; border-radius:8px; font-size:12px; overflow:auto; max-height:80vh; }
</style>
</head>
<body>
<h1>🔍 @xyflow/react v12 导出结构诊断</h1>
<pre id="output">加载中...</pre>

<!-- CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@xyflow/react@12/dist/umd/index.min.js"></script>

<script>
var out = document.getElementById('output');
function log(msg) { out.textContent += msg + '\n'; }

out.textContent = '';

if (typeof ReactFlow === 'undefined') {
  log('❌ ReactFlow 全局变量未定义');
  log('');
  log('可能原因:');
  log('  1. CDN 被网络环境屏蔽');
  log('  2. unpkg CDN 暂时不可达');
  log('  3. UMD 文件路径不存在或 404');
  log('');
  log('尝试备选 CDN...');
  
  // 尝试备选 CDN
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@xyflow/react@12/dist/index.js';  // ESM
  s.onload = function() { log('✅ jsdelivr ESM 加载成功'); };
  s.onerror = function() { log('❌ jsdelivr ESM 加载失败'); };
  document.body.appendChild(s);
  
} else {
  log('✅ ReactFlow 已加载');
  log('类型: ' + typeof ReactFlow);
  log('');
  
  if (typeof ReactFlow === 'object' || typeof ReactFlow === 'function') {
    var keys = Object.keys(ReactFlow).sort();
    log('导出项总数: ' + keys.length);
    log('');
    
    keys.forEach(function(k) {
      var v = ReactFlow[k];
      var t = typeof v;
      var extra = '';
      if (t === 'function') {
        var name = v.name || '(anonymous)';
        var str = v.toString().substring(0, 80).replace(/\n/g, ' ');
        extra = ' → ' + str;
      } else if (t === 'object' && v !== null) {
        extra = ' → ' + Object.keys(v).length + ' sub-keys';
      } else if (t === 'string') {
        extra = ' → "' + v + '"';
      }
      log('  ' + k + ' (' + t + ')' + extra);
    });
    
    log('');
    log('=== 尝试通过 ReactFlow.default 渲染 ===');
    if (typeof ReactFlow.default === 'function') {
      log('✅ ReactFlow.default 是函数, 名称为: ' + ReactFlow.default.name);
    } else {
      log('❌ ReactFlow.default = ' + typeof ReactFlow.default);
    }
    
    // 检查是否有其他可能的主组件名
    log('');
    log('=== 检查常见主组件名称 ===');
    ['ReactFlow', 'Flow', 'Workflow', 'Graph', 'Canvas', 'Diagram'].forEach(function(name) {
      if (typeof ReactFlow[name] !== 'undefined') {
        log('  ReactFlow.' + name + ' = ' + typeof ReactFlow[name]);
      }
    });
  }
}
</script>
</body>
</html>
