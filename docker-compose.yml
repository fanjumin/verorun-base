version: "3.8"

services:
  # 主 PostgreSQL（核心库，所有服务共用）
  db:
    image: postgres:16
    container_name: verorun_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-appdb}
      POSTGRES_USER: ${PG_USER:-app}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-app} -d ${PG_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # v2.1.0 — mini_app_builder 插件独立数据库（数据库级物理隔离）
  postgres_miniapp:
    image: postgres:15-alpine
    container_name: mini_app_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: mini_app
      POSTGRES_USER: ${MINI_APP_PG_USER:-verorun}
      POSTGRES_PASSWORD: ${MINI_APP_PG_PASSWORD:-}
    ports:
      - "5433:5432"
    volumes:
      - miniapp_pg_data:/var/lib/postgresql/data

  app:
    build: {context: ., dockerfile: Dockerfile}
    container_name: verorun
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app_data:/app/data
      - app_uploads:/app/admin/static
      - app_platform_uploads:/app/main_site/static
    env_file:
      # 审计 C-2 修复：全部安全密钥（JWT_SECRET / FLASK_SECRET_KEY / ENCRYPTION_KEY /
      # PLUGIN_LICENSE_SECRET / CAPTCHA_SECRET_KEY / DEV_ACCOUNTS_ENCRYPTION_KEY /
      # LICENSE_SERVER_SECRET / PROBE_SECRET / INTERNAL_SERVICE_TOKEN / APP_DEBUG /
      # FLASK_DEBUG / PLUGIN_AUTO_INSTALL / DEPLOY_MARKET 等）统一由 .env 注入。
      # 避免逐项插值遗漏导致插件系统/验证码/VeroGuard 功能不可用。
      - .env
    environment:
      # 仅保留容器网络特有的覆盖项（PG_HOST 走 compose 服务名）。
      # 注意：不要在 environment 里写 ${VAR:-} 插值透传——变量为空时
      # environment 会覆盖 env_file 注入值（compose 优先级），造成密钥丢失。
      - DB_PATH=/app/data/x7k2m9a4.db
      - PG_HOST=db
      - PG_PORT=5432
      - APP_HEARTBEAT_URL=${APP_HEARTBEAT_URL:-https://localhost/api/subscription/heartbeat}
      - MINI_APP_DB_URL=postgres://${MINI_APP_PG_USER:-verorun}:${MINI_APP_PG_PASSWORD:-}@postgres_miniapp:5432/mini_app
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  app_data:
  app_uploads:
  app_platform_uploads:
  miniapp_pg_data:
