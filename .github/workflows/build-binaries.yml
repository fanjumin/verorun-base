name: Build binaries (Nuitka)

# ── 触发条件：verorun-code 推送 tag ──
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verorun-code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          pip install --upgrade pip
          pip install nuitka cryptography

      - name: Generate integrity manifest
        run: |
          PROBE_SECRET=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          python3 veroguard/tools/build_manifest.py \
            --project-dir . \
            --output veroguard/data/manifest.json.enc \
            --secret "$PROBE_SECRET"

      - name: Build VeroGuard (Nuitka)
        run: |
          mkdir -p veroguard/dist
          python3 -m nuitka \
            --standalone \
            --onefile \
            --follow-imports \
            --include-package=veroguard \
            --include-package=veroguard.modules \
            --include-data-file=veroguard/data/manifest.json.enc=data/manifest.json.enc \
            --output-dir=veroguard/dist \
            --output-filename=verorun-guardian.bin \
            --assume-yes-for-downloads \
            --show-progress \
            --show-scons \
            veroguard/guardian.py

      - name: Verify binary
        run: |
          if [ -f veroguard/dist/verorun-guardian.bin ]; then
            echo "Binary built successfully"
            ls -lh veroguard/dist/verorun-guardian.bin
            file veroguard/dist/verorun-guardian.bin || true
          else
            echo "ERROR: Binary not found"
            exit 1
          fi

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            veroguard/dist/verorun-guardian.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
