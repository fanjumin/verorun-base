name: Sync to verorun-base

# ── 触发条件：verorun-code 推送 tag ──
on:
  push:
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verorun-code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag variables
        id: vars
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "msg=Sync from verorun-code ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Clone verorun-base
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/fanjumin/verorun-base.git /tmp/base
          cd /tmp/base
          git config user.name  "VeroRun CI"
          git config user.email "ci@verorun.com"

      - name: Remove old tracked files from verorun-base
        run: |
          cd /tmp/base
          # 保留 verorun-base 自己的文件（README.md, .gitignore）
          # 其余全部清除，准备接收新文件
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'README.md' \
            ! -name '.gitignore' \
            -exec rm -rf {} +

      - name: Export base files from verorun-code
        run: |
          # 使用 git archive 替代 rsync
          # .gitattributes 中的 export-ignore 控制哪些文件不导出
          git archive --format=tar "${{ steps.vars.outputs.tag }}" | tar -xC /tmp/base/

      - name: Install public installer (install-base.sh)
        run: |
          cd /tmp/base
          # base 使用精简版 install.sh：公开仓库（HTTPS，免 SSH key）+ 无私有授权密钥
          rm deploy/install.sh
          mv deploy/install-base.sh deploy/install.sh

      - name: Commit and push to verorun-base
        run: |
          cd /tmp/base
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "${{ steps.vars.outputs.msg }}"
            git tag "${{ steps.vars.outputs.tag }}"
            git push origin master --tags
          fi
