# ============================================================
# VeroRun — 单容器 Nginx 路由配置
# 与生产 install.sh 拓扑一致，仅暴露 80 端口：
#   /            → 8081 主站 (auth_server)
#   /admin/      → 8084 管理后台 (admin.app)
#   /auth/       → 8083 认证/平台 (main_site)
#   /subscribe   → 8083 订阅
#   /health      → 8085 健康检查 (health_service.app)
# ============================================================

server {
    listen 80 default_server;
    server_name _;
    # 审计 P2-3：client_max_body_size 提升至 server 级，覆盖 / 与 /auth/ 上传（含头像/文件）
    client_max_body_size 100M;

    # 健康检查（供容器编排探活）
    location = /health {
        proxy_pass http://127.0.0.1:8085/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 管理后台（前缀 /admin/ → 8084）
    location /admin/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
    }

    # 认证 / 订阅（/auth/ 与 /subscribe → 8083）
    location ~ ^/(auth|subscribe) {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主站（根路由 → 8081）
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
