# ============================================================
# VeroRun — 单容器 Supervisor 配置
# 管理 nginx + 4 个 gunicorn 服务（与 install.sh systemd 定义一致）
# 服务模块路径参考 deploy/install.sh write_systemd_services()
# ============================================================

[supervisord]
nodaemon=true
# 审计 D7：supervisord 以 root 运行（PID1 管理进程），
# gunicorn 子进程显式降权到 verorun，nginx 保持 root 绑定 80 端口。
# 删除全局 user=verorun，消除“supervisord 全局降权后子进程再提权”的矛盾模型。
# 审计 P3-5：日志落盘便于排障
# 审计 M15：logfile_maxbytes=0 无限增长会写满容器可写层，改为 50MB×5 轮转
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
pidfile=/var/run/supervisord.pid

# ── nginx（先启动；审计 P3-4：单独指定 root，因绑定 80 端口需特权） ──
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 8081 主站 (auth_server) ──
[program:verorun-main]
command=/usr/local/bin/gunicorn -w 2 -b 127.0.0.1:8081 --timeout 120 --log-level warning auth_server:app
directory=/app
user=verorun
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 8083 认证/平台 (main_site) ──
[program:verorun-auth]
command=/usr/local/bin/gunicorn -w 2 -b 127.0.0.1:8083 --timeout 120 --log-level warning main_site:app
directory=/app
user=verorun
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 8084 管理后台 (admin.app，经 run_gunicorn.py 避免 platform/ 遮蔽 stdlib) ──
[program:verorun-admin]
command=/usr/local/bin/python admin/run_gunicorn.py -w 2 -b 127.0.0.1:8084 --timeout 300 --max-requests=1000 --graceful-timeout=30 --log-level warning --config admin/gunicorn_config.py admin.app:app
directory=/app
user=verorun
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 8085 健康检查 (health_service.app) ──
[program:verorun-health]
command=/usr/local/bin/gunicorn -w 2 -b 127.0.0.1:8085 --timeout 30 --graceful-timeout=30 --log-level warning health_service.app:app
directory=/app
user=verorun
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
