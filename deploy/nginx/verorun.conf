# ========================================================
# VeroRun — Unified Nginx Configuration
# ========================================================
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
    listen 443 ssl http2;
    server_name easykai.cn www.easykai.cn;
    ssl_certificate /etc/letsencrypt/live/easykai.cn-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/easykai.cn-0001/privkey.pem; # managed by Certbot
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_buffer_size 4k;

    if ($scheme = http) { return 301 https://$host$request_uri; }
    root /home/easykai/easykai-workspace/easykai.cn;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /home/easykai/easykai-workspace/easykai.cn;
        try_files $uri =404;
    }
    location /subscribe { proxy_pass http://127.0.0.1:8083; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /auth/oauth/ { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /auth/ { proxy_pass http://127.0.0.1:8083; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /user/ { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /admin/static/ {
        root /home/easykai/easykai-workspace/easykai.cn;
        expires 30d;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

#     location ^~ /admin/ {  # [commented by remove script]
#         proxy_pass http://127.0.0.1:8084;
#         proxy_http_version 1.1;
#         proxy_set_header Connection "";
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }

    # 官网首页 - Flask 应用渲染主框架
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # static cache 30d
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

}

server {
    listen 443 ssl http2;
    server_name platform.easykai.cn;
    ssl_certificate /etc/letsencrypt/live/easykai.cn-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/easykai.cn-0001/privkey.pem; # managed by Certbot
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_buffer_size 4k;

    if ($scheme = http) { return 301 https://$host$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

}

server {
    listen 443 ssl http2;
    server_name agent.easykai.cn;
    client_max_body_size 50M;
    ssl_certificate /etc/letsencrypt/live/easykai.cn-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/easykai.cn-0001/privkey.pem; # managed by Certbot
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_buffer_size 4k;

    if ($scheme = http) { return 301 https://$host$request_uri; }

    # 根路径直 302 到 /admin/login，不经过 Flask，省 1 次 worker 往返
    location = / {
        return 302 /admin/login;
    }

    location ^~ /admin/static/ {
        root /home/easykai/easykai-workspace/easykai.cn;
        expires 30d;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    # RAG 知识库 API — 代理到 Platform (8083)
    location ^~ /api/v1/knowledge/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # 自动化端点 — 长超时（异步改造后此配置作为兜底）
    location /admin/automation/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

}

# 统一 HTTP 80 → HTTPS 443 重定向（所有子域名）
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
