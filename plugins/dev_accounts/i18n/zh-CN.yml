# Developer Accounts Plugin — 中文翻译
# ======================================

Developer Accounts: 开发者账号
Manage developer accounts for social media platforms (Douyin, WeChat, Telegram, LINE): 管理社交媒体平台（抖音、微信、Telegram、LINE）的开发者账号
List all developer accounts: 列出所有开发者账号
Get a single developer account: 查看开发者账号详情
Create a new developer account: 创建新的开发者账号
Update an existing developer account: 编辑开发者账号
Delete a developer account: 删除开发者账号
Test connection for a developer account: 测试开发者账号连接
Total Accounts: 账号总数
Active Accounts: 活跃账号数
Requires admin permissions: 需要管理员权限
platform is required: platform 为必填项
account_name is required: account_name 为必填项
Unsupported platform: 不支持的平台
No data provided: 未提供数据
No valid fields to update: 没有可更新的有效字段
Account not found: 账号不存在
Douyin: 抖音
WeChat: 微信
Telegram: Telegram
LINE: LINE
Toutiao: 头条
