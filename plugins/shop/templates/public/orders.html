<!DOCTYPE html>

<html lang="{{ lang }}">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>{{ _('My Orders') }} — {{ brand.site_name_cn if brand else '' }}</title>
<link href="{{ brand.favicon_url if brand and brand.favicon_url else '/static/favicon-32x32.png' }}" rel="icon" sizes="32x32" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="/static/css/landing.css" rel="stylesheet"/>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-cn)}
.orders-hero{text-align:center;padding:120px 32px 24px}
.orders-hero h1{font-size:clamp(1.5em,3vw,2em);font-weight:800;color:var(--text-high)}
.orders-wrap{max-width:800px;margin:0 auto;padding:0 24px 80px}
.order-card{background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:all .2s}
.order-card:hover{border-color:var(--border-accent)}
.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-card .order-id{font-size:11px;font-family:monospace;color:var(--dim)}
.order-card .status{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.status-pending{background:rgba(240,192,64,.12);color:#f0c040}
.status-paid{background:rgba(0,255,159,.1);color:var(--accent3)}
.status-completed{background:rgba(0,255,159,.08);color:#00d98f}
.status-refunding{background:rgba(248,81,73,.08);color:#f85149}
.status-refunded{background:rgba(248,81,73,.1);color:#f85149}
.status-cancelled{background:rgba(255,255,255,.04);color:var(--dim)}
.order-card .items{display:flex;flex-direction:column;gap:6px}
.order-card .item{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim)}
.order-card .item .name{flex:1}
.order-card .item .qty{color:var(--dim);margin:0 12px}
.order-card .item .amt{color:var(--text);font-weight:600}
.order-card .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.order-card .bottom .total{font-size:15px;font-weight:700;color:var(--accent)}
.order-card .bottom .discount{font-size:11px;color:var(--dim)}
.order-card .bottom .time{font-size:11px;color:var(--dim)}
.order-card .bottom .cancel-btn{padding:6px 16px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer}
.order-card .bottom .cancel-btn:hover{border-color:#f85149;color:#f85149}
.empty-state{text-align:center;padding:120px 32px;color:var(--dim)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state a{color:var(--accent);text-decoration:none}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:10px;font-size:13px;animation:slideIn .3s}
.toast.success{background:rgba(0,255,159,.15);border:1px solid var(--accent3);color:var(--accent3)}
.toast.error{background:rgba(248,81,73,.15);border:1px solid #f85149;color:#f85149}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}}
</style>
</head>
<body>
<div id="particles-bg"></div>
{% include '_header.html' ignore missing %}
<div class="orders-hero"><h1>{{ _('📋 My Orders') }}</h1></div>
<div class="orders-wrap" id="ordersContent">
<div style="text-align:center;padding:120px;color:var(--dim)"><div class="s"></div></div>
</div>
{{ _('Payment Popup') }}
<div id="payModal" onclick="if(event.target===this)this.style.display='none'" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9998">
<div style="background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:420px;margin:15vh auto">
<div id="payModalContent">
<div style="font-size:16px;font-weight:700;margin-bottom:8px">{{ _('💳 Payment') }}</div>
<div id="payOrderInfo" style="font-size:13px;color:var(--dim);margin-bottom:16px"></div>
<div id="payAction" style="text-align:center">
<div class="s" style="display:inline-block"></div>
</div>
</div>
</div>
</div>
{{ _('Logistics Tracking Popup') }}
<div id="trackModal" onclick="if(event.target===this)this.style.display='none'" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9998">
<div style="background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:450px;margin:10vh auto;max-height:70vh;overflow-y:auto">
<div style="font-size:16px;font-weight:700;margin-bottom:12px">{{ _('🚚 Logistics Tracking') }}</div>
<div id="trackContent" style="font-size:13px"></div>
<div style="margin-top:12px"><button class="cancel-btn" onclick="document.getElementById('trackModal').style.display='none'" style="width:100%;padding:8px;border-radius:8px">{{ _('Close') }}</button></div>
</div>
</div>

<script>
var T = '{{ token or "" }}';
// localStorage 兜底：登录时已存了 sso_token、tm_token、token
if(!T){T=localStorage.getItem('sso_token')||localStorage.getItem('tm_token')||localStorage.getItem('token')||''}

function loadOrders(){
  if(!T){document.getElementById("ordersContent").innerHTML='<div class="empty-state"><div class="icon">🔒</div><div>{{ _('Please') }} <a href="/login?redirect=/shop/orders">登录</a></div></div>';return}
  fetch("/shop/api/orders",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var os=d.data||[], h="";
    if(!os.length){h='<div class="empty-state"><div class="icon">📭</div><div>{{ _('No orders yet') }}</div><a href="/shop" style="color:var(--accent);margin-top:12px;display:inline-block">→ 去逛逛</a></div>'}
    else{
      // Group by order_id
      var groups={};
      os.forEach(function(o){
        if(!groups[o.order_id]) groups[o.order_id]={items:[],total:0,discount:0,status:o.status,time:o.created_at};
        groups[o.order_id].items.push(o);
        groups[o.order_id].total+=o.subtotal;
        groups[o.order_id].discount+=o.discount||0;
      });
      var stLabels={pending:'待支付',paid:'已支付',completed:'已完成',refunding:'退款中',refunded:'已退款',cancelled:'已取消'};
      Object.keys(groups).forEach(function(oid){
        var g=groups[oid];
        // 取第一个 item 的物流信息（同组共享）
        var firstItem=g.items[0];
        var shipHtml='';
        var actionsHtml='';
        if(firstItem.shipping_status==='shipped'){
          shipHtml='<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">';
          shipHtml+='<span style="font-size:12px;color:var(--accent3)">📦 已发货</span>';
          shipHtml+='<button class="cancel-btn" style="font-size:11px;padding:2px 10px" onclick="trackOrder('+g.items[0].id+')">{{ _('Track Shipping') }}</button></div>';
        }
        if(g.status==='pending'){actionsHtml+='<button class="cancel-btn" onclick="cancelOrder(\''+oid+'\')">{{ _('Cancel') }}</button><button class="btn bp bs" style="font-size:11px;padding:4px 14px;margin-left:6px" onclick="payOrder(\''+oid+'\',\'¥'+(g.total-g.discount).toFixed(2)+'\')">{{ _('Pay Now') }}</button>'}
        if(g.status==='paid' && firstItem.shipping_status==='shipped'){actionsHtml+='<button class="btn bp bs" style="font-size:11px;padding:4px 14px" onclick="confirmReceipt(\''+oid+'\')">{{ _('Confirm Receipt') }}</button>'}
         if(g.status==='paid'){actionsHtml+='<button class="cancel-btn" style="margin-left:6px" onclick="requestRefund(\''+oid+'\')">{{ _('Request Refund') }}</button>'}
        if(g.status==='refunding'){actionsHtml+='<span style="font-size:11px;color:var(--dim)">⏳ 退款处理中</span>'}
        if(g.status==='completed'){actionsHtml+='<span style="font-size:11px;color:var(--accent3)">✅ 已完成</span>'}
        h+='<div class="order-card">';
        h+='<div class="top"><span class="order-id">'+oid+'</span><span class="status status-'+g.status+'">'+(stLabels[g.status]||g.status)+'</span></div>';
        h+='<div class="items">';
        g.items.forEach(function(it){
          h+='<div class="item"><span class="name">'+esc(it.product_title)+'</span><span class="qty">×'+it.quantity+'</span><span class="amt">¥'+(it.subtotal||'0.00')+'</span></div>';
        });
        h+='</div><div class="bottom">';
        h+='<div><span class="total">¥'+(g.total-g.discount).toFixed(2)+'</span>';
        if(g.discount>0) h+='<span class="discount"> (已优惠 ¥'+g.discount.toFixed(2)+')</span>';
        h+='</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">';
        h+='<span class="time">'+(g.time||'').slice(0,16)+'</span>';
        h+=actionsHtml;
        h+='</div></div>'+shipHtml+'</div>';
      });
    }
    document.getElementById("ordersContent").innerHTML=h;
  });
}

function payOrder(oid, amount){
  var modal=document.getElementById("payModal"),content=document.getElementById("payAction"),info=document.getElementById("payOrderInfo");
  info.textContent='订单 '+oid+'  应付: '+amount;
  // 显示支付方式选择
  content.innerHTML='<div style="padding:12px"><div style="font-size:13px;font-weight:600;margin-bottom:10px">{{ _('Select Payment Method') }}</div>'
    +'<div style="display:flex;gap:8px;justify-content:center">'
    +'<button class="btn bp bs" onclick="doPay(\''+oid+'\',\'alipay\',\''+amount+'\')" style="padding:10px 24px;font-size:13px">💳 支付宝</button>'
    +'<button class="btn bp bs" onclick="doPay(\''+oid+'\',\'wechat\',\''+amount+'\')" style="padding:10px 24px;font-size:13px;background:var(--green);border-color:var(--green)">💚 微信支付</button>'
    +'</div></div>';
  modal.style.display="block";
}
function doPay(oid, method, amount){
  var content=document.getElementById("payAction");
  content.innerHTML='<div style="padding:24px"><div class="s"></div></div><div style="font-size:12px;color:var(--dim)">{{ _('Creating payment...') }}</div>';
  fetch("/shop/api/pay/"+oid,{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({method:method})})
    .then(function(r){return r.json()}).then(function(d){
      if(!d.success||!d.data){content.innerHTML='<div style="color:#f85149;padding:24px">{{ _('Payment creation failed') }}</div>';return}
      var data=d.data;
      if(data.stub){
        // 开发模式: 直接确认
        content.innerHTML='<div style="padding:12px"><p style="font-size:13px;margin-bottom:12px;color:var(--dim)">'+esc(data.note||'')+'</p>';
        content.innerHTML+='<button class="btn bp bs" onclick="stubPay(\''+oid+'\')">{{ _('Confirm Payment (Dev Mode)') }}</button></div>';
      }else if(method==='wechat' && data.code_url){
        // 微信: 显示二维码
        content.innerHTML='<div style="text-align:center;padding:12px">'
          +'<div style="font-size:12px;color:var(--dim);margin-bottom:8px">{{ _('Please scan with WeChat to pay') }}</div>'
          +'<div id="wechatQrcode" style="display:inline-block;background:#fff;padding:8px;border-radius:8px"></div>'
          +'<div style="font-size:11px;color:var(--dim);margin-top:8px">'+esc(data.amount||'')+'</div>'
          +'<div style="margin-top:12px;font-size:12px;color:var(--dim)">⏳ 支付成功后自动确认...</div>'
          +'</div>';
        var qrDiv=document.getElementById("wechatQrcode");
        if(typeof QRCode !== 'undefined'){
          new QRCode(qrDiv,{text:data.code_url,width:180,height:180});
        }else{
          qrDiv.innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(data.code_url)+'" alt="QR" style="width:180px;height:180px">';
        }
        pollPayStatus(oid);
      }else if(data.pay_url){
        // 支付宝: GET 方式跳转
        content.innerHTML='<div style="padding:12px;font-size:13px;color:var(--dim)">{{ _('Redirecting to Alipay...') }}</div>';
        window.location.href=data.pay_url;
      }else{
        content.innerHTML='<div style="color:#f85149;padding:24px">'+esc(data.error||'支付失败')+'</div>';
      }
    });
}

// 自动支付：如果 URL 带 pay_oid 参数，自动弹出支付选择
document.addEventListener('DOMContentLoaded', function(){
  var po=new URLSearchParams(location.search).get('pay_oid');
  if(po) setTimeout(function(){payOrder(po, '');}, 1200);
});
function pollPayStatus(oid){
  var pollTimer=setInterval(function(){
    fetch("/shop/api/pay/status/"+oid,{headers:{"Authorization":"Bearer "+T}})
      .then(function(r){return r.json()}).then(function(d){
        if(d.success && d.data && d.data.status==='paid'){
          clearInterval(pollTimer);
          showToast("✅ 支付成功","success");
          document.getElementById("payModal").style.display="none";
          loadOrders();
        }
      });
  }, 3000);
  // 超时停止轮询（3分钟后）
  setTimeout(function(){clearInterval(pollTimer)}, 180000);
}
function stubPay(oid){
  var content=document.getElementById("payAction");
  content.innerHTML='<div style="padding:24px"><div class="s"></div></div>';
  fetch("/shop/api/pay/"+oid+"/stub-confirm",{method:"POST",headers:{"Authorization":"Bearer "+T}})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){
        showToast("✅ 支付成功（开发模式）","success");
        document.getElementById("payModal").style.display="none";
        loadOrders();
      }else{
        showToast(d.error||"支付失败","error");
        content.innerHTML='<div style="color:#f85149;padding:12px">'+esc(d.error||'支付失败')+'</div>';
      }
    });
}
function cancelOrder(oid){
  if(!confirm("确定取消此订单？"))return;
  fetch("/shop/api/orders/"+oid+"/cancel",{method:"POST",headers:{"Authorization":"Bearer "+T}})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){showToast("✅ 已取消","success");loadOrders()}
      else showToast(d.error||"取消失败","error");
    });
}

function showToast(msg,type){
  var el=document.createElement("div");el.className="toast "+type;el.textContent=msg;
  document.body.appendChild(el);setTimeout(function(){el.style.opacity="0";setTimeout(function(){el.remove()},300)},3000);
}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function confirmReceipt(oid){
  if(!confirm("确认收到商品了吗？"))return;
  fetch("/shop/api/orders/"+oid+"/confirm-receipt",{method:"POST",headers:{"Authorization":"Bearer "+T}})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){showToast("✅ 已确认收货","success");loadOrders()}
      else showToast(d.error||"操作失败","error");
    });
}
function requestRefund(oid){
  var reason=prompt("请输入退款原因：");
  if(!reason||!reason.trim())return;
  fetch("/shop/api/orders/"+oid+"/request-refund",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({reason:reason.trim()})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){showToast("✅ 退款申请已提交","success");loadOrders()}
      else showToast(d.error||"操作失败","error");
    });
}

function trackOrder(oid){
  var modal=document.getElementById("trackModal"),content=document.getElementById("trackContent");
  content.innerHTML='<div style="text-align:center;padding:24px"><div class="s"></div></div>';
  modal.style.display="block";
  fetch("/shop/orders/"+oid+"/track-user",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data){content.innerHTML='<div style="color:#f85149;text-align:center;padding:24px">{{ _('Query failed') }}</div>';return}
    var data=d.data;
    var h='<div style="margin-bottom:10px;padding:10px 14px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid var(--border)">';
    if(data.tracking_company) h+='<div style="font-size:12px;color:var(--dim);margin-bottom:2px">快递: '+esc(data.tracking_company)+'</div>';
    if(data.tracking_number) h+='<div style="font-size:12px;color:var(--dim);margin-bottom:2px">单号: <span style="font-family:monospace">'+esc(data.tracking_number)+'</span></div>';
    if(data.state_text) h+='<div style="font-size:12px;color:var(--accent3);font-weight:600;margin-top:4px">'+esc(data.state_text)+'</div>';
    h+='</div>';
    var traces=data.traces||[];
    if(traces.length===0){
      h+='<div style="text-align:center;padding:20px;color:var(--dim)">{{ _('No tracking info available') }}</div>';
    }else{
      h+='<div style="position:relative;padding-left:20px">';
      traces.forEach(function(t,i){
        var last=i===traces.length-1;
        h+='<div style="position:relative;padding:0 0 14px 14px;border-left:2px solid '+(last?'var(--accent3)':'var(--border)')+'">';
        h+='<div style="position:absolute;left:-7px;top:0;width:12px;height:12px;border-radius:50%;background:'+(last?'var(--accent3)':'var(--border)')+'"></div>';
        h+='<div style="font-size:13px;font-weight:600;color:'+(last?'var(--accent3)':'var(--text)')+'">'+esc(t.station||'')+'</div>';
        h+='<div style="font-size:11px;color:var(--dim);margin-top:2px">'+(t.time||'')+'</div>';
        h+='</div>';
      });
      h+='</div>';
    }
    content.innerHTML=h;
  });
}

if(typeof tsParticles!=='undefined'){
  tsParticles.load('particles-bg',{
    fullScreen:{enable:false,zIndex:0},fpsLimit:40,
    particles:{number:{value:40,density:{enable:true,area:800}},
    color:{value:['#00f5ff','#a020f0','#6366f1','#00ff9f']},
    shape:{type:'circle'},opacity:{value:.2,random:true},
    size:{value:{min:1,max:3},random:true},
    links:{enable:true,distance:150,color:'#6366f1',opacity:.08,width:1},
    move:{enable:true,speed:.5},background:{color:'transparent'}
  });
}
loadOrders();
</script>
</body>
</html>
