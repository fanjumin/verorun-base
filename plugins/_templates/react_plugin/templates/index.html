<!DOCTYPE html>
{# ============================================================
   React Demo — iframe 独立页面（§12.11 iframe 例外条款、§15 框架指南）
   允许 <script>；框架库仅用系统本地静态文件；禁外网 CDN。
   ============================================================ #}
<html lang="{{ g.lang_code or 'zh-CN' }}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{ _('React Plugin Demo') }} — VeroRun</title>
<link rel="icon" href="data:,">
{# 设计系统 CSS 变量（仅变量，插件内使用标准变量名） #}
<link rel="stylesheet" href="{{ url_for('static_files', filename='css/design-system.css') }}"/>
{# React 18 UMD（本地静态，禁 CDN — §15.2） #}
<script src="{{ url_for('static_files', filename='lib/workflow/react.production.min.js') }}"></script>
<script src="{{ url_for('static_files', filename='lib/workflow/react-dom.production.min.js') }}"></script>
{# SSO token — 必须在 app.js 之前设置（§15.4） #}
<script>window.__SSO_TOKEN = {{ sso_token|tojson }};</script>
{# i18n 字典注入（框架组件无法直接调用 _()，§15.5） #}
<script>window.__t = {{ translations|tojson }};</script>
<script>window.__locale = '{{ g.lang_code or "zh-CN" }}';</script>
{# 自身脚本 #}
<script src="{{ url_for('react_demo.static', filename='js/app.js') }}"></script>
<style>
  body { background: var(--bg, #0f1115); color: var(--text, #e6e6e6); font-family: var(--font-sans, system-ui); margin: 0; }
  .rd-card { max-width: 560px; margin: 48px auto; padding: 24px; border: 1px solid var(--border, #262a33); border-radius: 12px; background: var(--bg-card, #171a21); }
  .rd-card h2 { margin-top: 0; }
  .rd-muted { color: var(--text-muted, #8b93a3); font-size: 13px; }
  .rd-card button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border, #262a33); background: var(--bg, #0f1115); color: var(--text, #e6e6e6); cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>
</body>
</html>
