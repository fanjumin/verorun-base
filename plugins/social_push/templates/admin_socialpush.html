// Social Push Plugin — 社媒推广前端（迁移自 partials/social.html 1-358）
// 依赖全局工具：T(token)、esc()、showToast()、go()（由 admin core 提供）
// 注意：AI 排版/配图按钮走 content_factory 插件；AI 生成/生成图片走本插件 social_bp
// 本文件为裸 JS，由 admin.html 外层统一 <script> 包裹，切勿在此再加 <script> 标签

window.l_social=function(){
  var h='';
  h+='<div style="margin-bottom:12px;display:flex;gap:4px;flex-wrap:wrap">';
  h+='<button class="btn bp" onclick="socialTab(0)" id="soc-t0">{{ _('Article Edit') }}</button>';
  h+='<button class="btn bo" onclick="socialTab(1)" id="soc-t1">🎨 {{ _('Add Image') }}</button>';
  h+='<button class="btn bo" onclick="socialTab(2)" id="soc-t2">📤 {{ _('Publish') }}</button>';
  h+='<span style="flex:1"></span>';
  h+='<span id="socConfigStatus" style="font-size:10px;color:var(--dim);align-self:center"></span>';
  h+='</div><div id="socContent"></div>';
  document.getElementById("mc").innerHTML=h;
  // Show config status（Phase 3：社媒号 与 AI 工具 分区展示）
  fetch("/admin/social/check-config",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var plat=(d.data.platforms||[]).map(function(p){return p.icon+" "+p.name+(p.configured?"✅":"❌")});
    var ai=(d.data.ai_capabilities||[]).map(function(p){return p.icon+" "+p.name+(p.configured?"✅":"❌")});
    var parts=[];
    if(plat.length)parts.push('{{ _('Publish Channels') }}: '+plat.join(" | "));
    if(ai.length)parts.push('{{ _('AI Tools') }}: '+ai.join(" | "));
    document.getElementById("socConfigStatus").textContent=parts.join("　　");
  }).catch(function(){});
  socialTab(0);
};

var socArticle={title:"",summary:"",body_html:""};
var socCoverUrl="";

function socialTab(n){
  document.querySelectorAll('[id^="soc-t"]').forEach(function(e){e.className="btn bo"});
  var el=document.getElementById("soc-t"+n);
  if(el)el.className="btn bp";
  if(n===0)socialEditor();
  else if(n===1)socialImageGen();
  else if(n===2)socialPublish();
}

// ── Tab 0: {{ _('Article Edit') }} ──
function socialEditor(){
  var h='<div class="cd"><div class="st">{{ _('Edit Content') }}</div>';
  h+='<div class="fl"><div style="font-size:11px;color:var(--dim);width:60px">{{ _('Platform') }}</div>';
  h+='<select class="sl" id="socPlatform" style="flex:1" onchange="socialUpdateContentTypes()"><option value="wechat">{{ _('WeChat OA Articles') }}</option><option value="weibo">{{ _('Weibo') }}</option></select></div>';
  h+='<div class="fl"><div style="font-size:11px;color:var(--dim);width:60px">{{ _('Type') }}</div>';
  h+='<select class="sl" id="socType" style="flex:1"><option value="article">{{ _('Article') }}</option><option value="announcement">{{ _('Notification') }}</option><option value="promotion">{{ _('Promote') }}</option></select></div>';
  h+='<div class="fl"><div style="font-size:11px;color:var(--dim);width:60px">{{ _('Theme') }}</div><input class="in" id="socTopic" placeholder="{{ _('Enter Topic') }}，如：AI {{ _('Transform Finance') }}" style="flex:1"></div>';
  h+='<div style="margin-top:8px;display:flex;gap:8px">';
  h+='<button class="btn bp" onclick="socialGen()">🤖 AI {{ _('Generate') }}</button>';
  h+='<button class="btn bo" onclick="socialClearEditor()">{{ _('Clear') }}</button></div></div>';
  h+='<button class="btn bo" onclick="socialImportFromCMS()">📥 从CMS{{ _('Import') }}</button>';

  h+='<div class="cd" style="margin-top:12px"><div class="st">{{ _('Content') }}</div>';
  h+='<div class="fl"><div style="font-size:11px;color:var(--dim);width:60px">{{ _('Title') }}</div><input class="in" id="socTitle" placeholder="{{ _('Title') }}" style="flex:1" value="'+esc(socArticle.title)+'"></div>';
  h+='<div class="fl" id="socSummaryRow"><div style="font-size:11px;color:var(--dim);width:60px">{{ _('Summary') }}</div><input class="in" id="socSummary" placeholder="{{ _('Summary') }}（{{ _('Optional') }}）" style="flex:1" value="'+esc(socArticle.summary)+'"></div>';
  h+='<div style="font-size:11px;color:var(--dim);margin:8px 0 4px">{{ _('Body') }}</div>';
  h+='<textarea class="ta" id="socBody" style="min-height:200px;width:100%" placeholder="{{ _('Body Content') }}...">'+esc(socArticle.body_html)+'</textarea>';
  h+='<div style="margin-top:6px;display:flex;gap:6px"><button class="btn bo bs" onclick="socAiformat()">🤖 AI{{ _('Layout') }}</button><button class="btn bo bs" onclick="socAicover()">🎨 AI{{ _('Add Image') }}</button></div>';
  h+='<div id="socCmsImportList" style="margin-top:8px;display:none"></div>';
  h+='</div>';

  document.getElementById("socContent").innerHTML=h;
}



function socialImportFromCMS(){
  var el=document.getElementById("socCmsImportList");
  if(!el){showToast("{{ _('Use this feature in the editor first') }}","error");return}
  if(el.style.display!="none"&&el.innerHTML){el.style.display="none";return}
  el.style.display="block";
  el.innerHTML='<div class="lo"><div class="s"></div>{{ _('Loading') }}CMS{{ _('Article') }}...</div>';
  fetch("/admin/social/import-from-cms",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data){el.innerHTML='<div class="em">{{ _('Load failed') }}</div>';return}
    var posts=d.data;
    if(!posts.length){el.innerHTML='<div class="em">{{ _('No Published') }}CMS{{ _('Article') }}</div>';return}
    var h='<div class="st" style="font-size:12px">{{ _('Select') }}CMS{{ _('Article Import') }}</div><table><tr><th>{{ _('Title') }}</th><th>{{ _('Categories') }}</th><th>{{ _('Time') }}</th><th>{{ _('Actions') }}</th></tr>';
    posts.forEach(function(p){
      h+='<tr><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;font-weight:600">'+esc(p.title)+'</td>';
      h+='<td>'+esc(p.category)+'</td>';
      h+='<td style="font-size:10px;color:var(--dim)">'+(p.published_at||p.created_at||'').slice(0,10)+'</td>';
      h+='<td><button class="btn bo bs" onclick="socialImportCMSArticle('+p.id+')">{{ _('Import') }}</button></td></tr>';
    });
    h+='</table><div style="margin-top:8px"><button class="btn bo bs" onclick="document.getElementById(&#39;socCmsImportList&#39;).style.display=&#39;none&#39;">{{ _('Close') }}</button></div>';
    el.innerHTML=h;
  }).catch(function(){el.innerHTML='<div class="em">{{ _('Request Failed') }}</div>'});
}

function socialImportCMSArticle(id){
  fetch("/admin/social/import-from-cms",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data){showToast("{{ _('Load failed') }}","error");return}
    var post=null;
    for(var i=0;i<d.data.length;i++){if(d.data[i].id===id){post=d.data[i];break}}
    if(!post){showToast("{{ _('Article not found') }}","error");return}
    socArticle.title=post.title||"";
    socArticle.summary=post.excerpt||"";
    socArticle.body_html=post.content||"";
    socCoverUrl=post.cover_image||"";
    socialEditor();
    showToast("{{ _('Imported') }}: "+post.title,"success");
    var el=document.getElementById("socCmsImportList");
    if(el)el.style.display="none";
  }).catch(function(){showToast("{{ _('Request Failed') }}","error")});
}

function socAiformat(){
  var body=document.getElementById("socBody").value;
  var title=document.getElementById("socTitle").value.trim();
  if(!body){showToast("{{ _('Body cannot be empty') }}","error");return}
  showToast("{{ _('AI Formatting (~10s)...') }}","");
  fetch("/admin/content-factory/ai-format",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({content:body,title:title})}).then(function(r){return r.json()}).then(function(d){
    if(d.success){document.getElementById("socBody").value=d.formatted;showToast("{{ _('Layout complete') }}","success")}
    else{showToast(d.error||"{{ _('Layout Failed') }}","error")}
  }).catch(function(){showToast("{{ _('Request Failed') }}","error")});
}

function socAicover(){
  var title=document.getElementById("socTitle").value.trim()||"{{ _('Article Image') }}";
  var p=prompt("{{ _('Image Description') }}（{{ _('Auto Generate if Empty') }}）:",title+" {{ _('Fintech') }} {{ _('Dark Sci-Fi') }}");
  if(p===null)return;
  showToast("{{ _('AI Generating Image (~30s)...') }}","");
  fetch("/admin/content-factory/ai-cover",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({title:title,prompt:p||""})}).then(function(r){return r.json()}).then(function(d){
    if(d.success){
      var img=d.image_url?'<img src="'+esc(d.image_url)+'" style="max-width:100%;border-radius:8px">':'';
      document.getElementById("socBody").value+="\n\n[{{ _('Add Image') }}] "+d.image_url;
      showToast("{{ _('Image generated, URL inserted at bottom') }}","success")
    }else{showToast(d.error||"{{ _('Image Attach Failed') }}","error")}
  }).catch(function(){showToast("{{ _('Request Failed') }}","error")});
}

function socialUpdateContentTypes(){
  var platform=document.getElementById("socPlatform").value;
  var typeSel=document.getElementById("socType");
  var summaryRow=document.getElementById("socSummaryRow");
  if(platform==="weibo"){
    typeSel.innerHTML='<option value="weibo">{{ _('Weibo') }}</option>';
    if(summaryRow)summaryRow.style.display="none";
  }else{
    typeSel.innerHTML='<option value="article">{{ _('Article') }}</option><option value="announcement">{{ _('Notification') }}</option><option value="promotion">{{ _('Promote') }}</option>';
    if(summaryRow)summaryRow.style.display="flex";
  }
}

function socialClearEditor(){
  document.getElementById("socTitle").value="";
  document.getElementById("socSummary").value="";
  document.getElementById("socBody").value="";
}

function socialGen(){
  var topic=document.getElementById("socTopic").value.trim();
  var type=document.getElementById("socType").value;
  if(!topic){showToast("{{ _('Enter a topic') }}","error");return}
  document.getElementById("socContent").innerHTML='<div class="lo"><div class="s"></div>AI {{ _('Generating') }}...</div>';
  fetch("/admin/social/generate",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({topic:topic,content_type:type})})
    .then(function(r){return r.json()}).then(function(d){
      if(!d.success){document.getElementById("socContent").innerHTML='<div class="em">'+esc(d.error||"{{ _('Generation Failed') }}")+'</div>';return}
      var a=d.data;
      socArticle={title:a.title||"",summary:a.summary||"",body_html:a.body_html||""};
      socialEditor();
      showToast("{{ _('Generation complete') }}","success");
    }).catch(function(){document.getElementById("socContent").innerHTML='<div class="em">{{ _('Request Failed') }}</div>'});
}

// ── Tab 1: {{ _('Add Image') }} ──
function socialImageGen(){
  var h='<div class="cd"><div class="st">AI {{ _('Image Generation') }}（{{ _('Tongyi Wanxiang') }}）</div>';
  h+='<div class="fl"><div style="font-size:11px;color:var(--dim);width:60px">{{ _('Description') }}</div><input class="in" id="socImgPrompt" placeholder="{{ _('Describe Image Effect') }}，如：{{ _('Ink Landscape') }}" style="flex:1"></div>';
  h+='<div style="margin:8px 0;display:flex;gap:12px">';
  h+='<label style="font-size:11px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="socIsCover" checked> {{ _('As Cover Image') }}</label></div>';
  h+='<button class="btn bp" onclick="socialGenImage()">🎨 {{ _('Generate Picture') }}</button>';
  h+='</div>';
  h+='<div id="socImgResult" style="margin-top:12px"></div>';
  if(socCoverUrl){
    h+='<div class="cd"><div class="st">{{ _('Current Cover') }}</div><img src="'+esc(socCoverUrl)+'" style="max-width:100%;max-height:300px;border-radius:8px">';
    h+='<div style="margin-top:8px"><button class="btn bo" onclick="socCoverUrl=\'\';showToast(\'{{ _('Cleared') }}\',\'success\')">{{ _('Clear Cover') }}</button></div></div>';
  }
  document.getElementById("socContent").innerHTML=h;
}

function socialGenImage(){
  var prompt=document.getElementById("socImgPrompt").value.trim();
  var isCover=document.getElementById("socIsCover").checked;
  var title=socArticle.title;
  if(!prompt&&!title){showToast("{{ _('Enter image description') }}","error");return}
  document.getElementById("socImgResult").innerHTML='<div class="lo"><div class="s"></div>{{ _('Tongyi Wanxiang Generating') }}...</div>';
  fetch("/admin/social/generate-image",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt,title:title,cover:isCover})})
    .then(function(r){return r.json()}).then(function(d){
      if(!d.success){document.getElementById("socImgResult").innerHTML='<div class="em">'+esc(d.error||"{{ _('Generation Failed') }}")+'</div>';return}
      var url=d.data.image_url;
      socCoverUrl=url;
      var h='<div class="cd"><div class="st">{{ _('Generation Result') }}</div>';
      if(url)h+='<img src="'+esc(url)+'" style="max-width:100%;max-height:350px;border-radius:8px">';
      h+='<div style="margin-top:8px;display:flex;gap:8px">';
      h+='<button class="btn bp" onclick="socCoverUrl=\''+esc(url)+'\';showToast(\'{{ _('Set as Cover') }}\',\'success\')">{{ _('Set as Cover') }}</button>';
      h+='<button class="btn bo" onclick="window.open(\''+esc(url)+'\',\'_blank\')">{{ _('View Original') }}</button></div></div>';
      document.getElementById("socImgResult").innerHTML=h;
      showToast("{{ _('Image generated') }}","success");
    }).catch(function(){document.getElementById("socImgResult").innerHTML='<div class="em">{{ _('Request Failed') }}</div>'});
}

// ── Tab 2: {{ _('Publish') }} ──
function socialPublish(){
  fetch("/admin/social/check-config",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(cfg){
    var platforms=cfg.success?cfg.data.platforms:[];
    var aiCaps=cfg.success?(cfg.data.ai_capabilities||[]):[];
    var h='';

    // 发布渠道（社媒号）—— 只列真实平台，不含 AI
    h+='<div class="cd"><div class="st">📤 {{ _('Push To') }}（{{ _('Publish Channels') }}）</div>';
    h+='<div style="display:flex;gap:12px;flex-wrap:wrap">';
    platforms.forEach(function(p){
      var checked=p.configured?"checked":"";
      var disabled=p.configured?"":"disabled";
      h+='<label style="font-size:12px;display:flex;align-items:center;gap:4px;opacity:'+(p.configured?1:0.4)+'">';
      h+='<input type="checkbox" class="socPlatformCheck" value="'+p.id+'" '+checked+' '+disabled+'>';
      h+=p.icon+' '+p.name;
      if(!p.configured)h+=' <span style="font-size:9px;color:var(--dim)">({{ _('Not Configured') }})</span>';
      h+='</label>';
    });
    h+='</div></div>';

    // AI 创作工具 —— 独立信息区，仅显示可用状态，不是发布目标
    if(aiCaps.length){
      h+='<div class="cd" style="margin-top:8px;border-left:3px solid var(--accent2)"><div class="st">🛠️ {{ _('AI Creation Tools') }}</div>';
      h+='<div style="font-size:11px;color:var(--dim);margin-bottom:6px">{{ _('AI tools are for content creation, not publish targets') }}</div>';
      h+='<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px">';
      aiCaps.forEach(function(a){
        h+='<span style="opacity:'+(a.configured?1:0.4)+'">'+a.icon+' '+a.name+(a.configured?" ✅":" ❌")+'</span>';
      });
      h+='</div></div>';
    }

    // Any platform configured?
    var hasAny=platforms.some(function(p){return p.configured});
    if(!hasAny){
      h+='<div class="cd"><div class="st">⚠️ {{ _('No Configured Platform') }}</div>';
      h+='<p style="font-size:12px;color:var(--dim)">{{ _('First') }}「{{ _('System Settings') }}」{{ _('Configure WeChat OA') }}、{{ _('Weibo or Tongyi Wanxiang') }} API Key</p>';
      h+='<button class="btn bp" onclick="go(\'config\')">{{ _('Go to Config') }}</button></div>';
      document.getElementById("socContent").innerHTML=h;
      return;
    }

    // Preview
    h+='<div class="cd"><div class="st">{{ _('Preview') }}</div>';
    h+='<div style="font-size:13px;font-weight:600;margin-bottom:8px">'+esc(socArticle.title||"（{{ _('No Title') }}）")+'</div>';
    h+='<div style="font-size:11px;color:var(--dim);margin-bottom:8px">'+esc(socArticle.summary||"")+'</div>';
    if(socCoverUrl){
      h+='<img src="'+esc(socCoverUrl)+'" style="max-width:100%;max-height:200px;border-radius:8px;margin-bottom:8px">';
    }
    h+='<div style="font-size:12px;max-height:250px;overflow-y:auto;border:1px solid var(--border);padding:12px;border-radius:8px;background:var(--bg2)">'+(socArticle.body_html||"（{{ _('No Body') }}）")+'</div>';
    h+='</div>';

    // Publish
    h+='<div class="cd" style="margin-top:12px"><div class="st">{{ _('Publish') }}</div>';
    h+='<label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:8px"><input type="checkbox" id="socAutoPub"> {{ _('Direct WeChat Publish') }}（{{ _('Unchecked') }}={{ _('Draft Only') }}；{{ _('Always Direct Publish to Weibo') }}）</label>';
    h+='<button class="btn bp" onclick="socialDoPublish()">📤 {{ _('Send to Selected Platform') }}</button>';
    h+='</div>';

    // History
    h+='<div class="cd" style="margin-top:12px"><div class="st">{{ _('Push History') }}</div><div id="socHistory"><div class="lo"><div class="s"></div></div></div></div>';

    document.getElementById("socContent").innerHTML=h;
    loadSocialHistory();
  }).catch(function(){document.getElementById("socContent").innerHTML='<div class="em">{{ _('Check Configuration Failed') }}</div>'});
}

function socialDoPublish(){
  var te=document.getElementById("socTitle");
  var se=document.getElementById("socSummary");
  var be=document.getElementById("socBody");
  if(te&&te.value) socArticle.title=te.value;
  if(se&&se.value) socArticle.summary=se.value;
  if(be&&be.value) socArticle.body_html=be.value;

  if(!socArticle.title||!socArticle.body_html){showToast("{{ _('Title and body are required') }}","error");return}

  // Get selected platforms
  var platforms=[];
  document.querySelectorAll(".socPlatformCheck:checked").forEach(function(cb){platforms.push(cb.value)});
  if(!platforms.length){showToast("{{ _('Select at least one platform') }}","error");return}

  var autoPub=document.getElementById("socAutoPub")&&document.getElementById("socAutoPub").checked;

  fetch("/admin/social/publish",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({
    title:socArticle.title,
    body:socArticle.body_html,
    body_html:socArticle.body_html,
    summary:socArticle.summary,
    author:"admin",
    cover_image_url:socCoverUrl||"",
    platforms:platforms,
    auto_publish:autoPub,
  })}).then(function(r){return r.json()}).then(function(d){
    if(d.success){
      var msgs=d.data.results.map(function(r){return r.platform+": "+(r.message||r.error||r.status)});
      showToast(msgs.join(" | "),d.data.results.some(function(r){return r.status=="failed"})?"error":"success");
      loadSocialHistory();
    }else{
      showToast(d.error||"{{ _('Failed to send') }}","error");
    }
  }).catch(function(){showToast("{{ _('Request Failed') }}","error")});
}

function loadSocialHistory(){
  var el=document.getElementById("socHistory");
  if(!el)return;
  fetch("/admin/social/history?limit=20",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data){el.innerHTML='<div class="em">{{ _('Load failed') }}</div>';return}
    var items=d.data.items;
    if(!items||!items.length){el.innerHTML='<div class="em">{{ _('No Push Records') }}</div>';return}
    var h='{{ _('<table><tr><th>Platform</th><th>Title</th><th>Status</th><th>ID</th><th>Time</th><th>Action</th></tr>') }}';
    var statusMap={draft:"{{ _('Draft') }}",publishing:"{{ _('Publishing') }}",published:"{{ _('Published') }}",failed:"{{ _('Failed') }}"};
    var platformIcon={wechat:"💬",weibo:"📢",toutiao:"📰"};
    items.forEach(function(r){
      var st=statusMap[r.status]||r.status;
      var stCls=r.status==="published"?"on":(r.status==="failed"?"off":"pd");
      var icon=platformIcon[r.platform]||"📤";
      h+='<tr><td>'+icon+'</td>';
      h+='<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">'+esc(r.title)+'</td>';
      h+='<td><span class="bdg '+stCls+'">'+st+'</span></td>';
      h+='<td style="font-size:10px;font-family:monospace">'+(r.publish_id||r.media_id?"#"+esc(r.publish_id||r.media_id):"-")+'</td>';
      h+='<td style="font-size:11px;color:var(--dim)">'+(r.created_at||"")+'</td>';
      h+='<td><button class="btn bo bs" onclick="socialDeleteHistory('+r.id+')">{{ _('Delete') }}</button></td></tr>';
    });
    h+='</table><div style="font-size:10px;color:var(--dim);margin-top:8px">{{ _('Total: ') }}'+d.data.total+'{{ _(' entries') }}</div>';
    el.innerHTML=h;
  }).catch(function(){el.innerHTML='<div class="em">{{ _('Load failed') }}</div>'});
}

function socialDeleteHistory(id){
  if(!confirm("{{ _('Delete?') }}"))return;
  fetch("/admin/social/history/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(d.success){loadSocialHistory();showToast("{{ _('Deleted') }}","success")}
    else{showToast(d.error||"{{ _('Delete failed') }}","error")}
  }).catch(function(){showToast("{{ _('Request Failed') }}","error")});
}

// ── {{ _('Publish History') }} (standalone page) ──
window.l_publish_history=function(){
  document.getElementById("pt").textContent="{{ _('Publish History') }}";
  var h='<div class="cd"><div style="display:flex;align-items:center;margin-bottom:12px">';
  h+='<div class="st">📤 {{ _('Publish History') }}</div><span style="flex:1"></span>';
  h+='<button class="btn bo bs" onclick="loadPublishHistory()">{{ _('Refresh') }}</button></div>';
  h+='<div id="pubHistory"><div class="em">{{ _('Loading') }}...</div></div></div>';
  document.getElementById("mc").innerHTML=h;
  loadPublishHistory();
};

function loadPublishHistory(){
  var el=document.getElementById("pubHistory");
  if(!el)return;
  fetch("/admin/social/history?limit=100",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data){el.innerHTML='<div class="em">{{ _('Load failed') }}</div>';return}
    var items=d.data.items;
    if(!items||!items.length){el.innerHTML='<div class="em">{{ _('No Push Records') }}</div>';return}
    var h='{{ _('<table><tr><th>Platform</th><th>Title</th><th>Status</th><th>ID</th><th>Time</th><th>Action</th></tr>') }}';
    var statusMap={draft:"{{ _('Draft') }}",publishing:"{{ _('Publishing') }}",published:"{{ _('Published') }}",failed:"{{ _('Failed') }}"};
    var platformIcon={wechat:"💬",weibo:"📢",toutiao:"📰"};
    items.forEach(function(r){
      var st=statusMap[r.status]||r.status;
      var stCls=r.status==="published"?"on":(r.status==="failed"?"off":"pd");
      var icon=platformIcon[r.platform]||"📤";
      h+='<tr><td>'+icon+'</td>';
      h+='<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">'+esc(r.title)+'</td>';
      h+='<td><span class="bdg '+stCls+'">'+st+'</span></td>';
      h+='<td style="font-size:10px;font-family:monospace">'+(r.publish_id||r.media_id?"#"+esc(r.publish_id||r.media_id):"-")+'</td>';
      h+='<td style="font-size:11px;color:var(--dim)">'+(r.created_at||"")+'</td>';
      h+='<td><button class="btn bo bs" onclick="socialDeleteHistory('+r.id+')">{{ _('Delete') }}</button></td></tr>';
    });
    h+='</table><div style="font-size:10px;color:var(--dim);margin-top:8px">{{ _('Total: ') }}'+d.data.total+'{{ _(' entries') }}</div>';
    el.innerHTML=h;
  }).catch(function(){el.innerHTML='<div class="em">{{ _('Load failed') }}</div>'});
}
