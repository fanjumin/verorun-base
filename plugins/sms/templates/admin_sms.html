// SMS Management — 短信插件管理面板
// 无 <script> 标签，遵循插件模板铁律 §12.11

window.l_sms = function(){
  document.getElementById("pt").textContent = "{{ _('sms_management') }}";
  var h='<div class="cd"><div id="sms-content"></div></div>';
  document.getElementById("mc").innerHTML = h;
  loadSmsMain();
};

function loadSmsMain(){
  var ct = document.getElementById("sms-content");
  ct.innerHTML = '<div class="cd" style="margin-bottom:12px">'+
    '<div class="st">{{ _('sms_config') }}</div>'+
    '<div id="sms-config-form"></div>'+
    '</div>'+
    '<div class="cd"><div class="st">{{ _('sms_templates') }}</div>'+
    '<div id="sms-templates-content"></div></div>';

  loadSmsConfigForm();
  loadSmsTemplates();
}

function loadSmsConfigForm(){
  fetch("/user/config", {headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success) return;
    var smsItems = d.data.filter(function(k){return k.category=="sms"});
    var h='';
    smsItems.forEach(function(k){
      var isSensitive = k.sensitive;
      var displayVal = isSensitive ? k.masked_value : k.value;
      var safeVal = (k.value||"").replace(/"/g,"&quot;");
      var safeMasked = (k.masked_value||"").replace(/"/g,"&quot;");
      var ph = k.placeholder||"";
      h+='<div class="fl"><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">'+(k.label||k.key)+'</div></div>';
      if(isSensitive){
        h+='<input class="in" id="cf-'+k.key+'" type="password" value="'+safeMasked+'" placeholder="'+ph+'" style="width:180px" onfocus="this.value=\'\'" onblur="if(!this.value)this.value=\''+safeMasked+'\'">';
      }else{
        h+='<input class="in" id="cf-'+k.key+'" value="'+safeVal+'" placeholder="'+ph+'" style="width:200px">';
      }
      h+='<button class="btn bp bs" onclick="scfg(\''+k.key+'\')">{{ _('save') }}</button></div>';
    });
    document.getElementById("sms-config-form").innerHTML = h||'<div class="em">{{ _('No Config') }}</div>';
  }).catch(function(){});
}

function loadSmsTemplates(){
  var ct = document.getElementById("sms-templates-content");
  ct.innerHTML = '<div style="text-align:center;padding:12px;color:var(--dim)"><div class="s" style="display:inline-block"></div>{{ _('loading') }}...</div>';
  fetch("/admin/sms/templates", {headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success){ct.innerHTML='<div class="em">{{ _('load_failed') }}</div>';return}
    var h='<div style="margin-bottom:12px"><button class="btn bp" onclick="showSmsForm()">+ {{ _('add_template') }}</button></div>';
    h+='<div id="smsForm" style="display:none;margin-bottom:16px" class="cd"><div class="st" id="smsFormTitle">{{ _('add_template') }}</div>';
    h+='<div class="g2">';
    h+='<div><div style="font-size:11px;color:var(--dim)">{{ _('categories') }}</div><select class="sl" id="smsCat" style="width:100%"><option value="captcha">{{ _('verification_code') }}</option><option value="notice">{{ _('sms_notification') }}</option><option value="promo">{{ _('sms_promotion') }}</option></select></div>';
    h+='<div><div style="font-size:11px;color:var(--dim)">{{ _('name') }}</div><input class="in" id="smsName" style="width:100%"></div>';
    h+='<div><div style="font-size:11px;color:var(--dim)">{{ _('template_code') }}</div><input class="in" id="smsCode" placeholder="SMS_xxxxxxxxx" style="width:100%"></div>';
    h+='<div><div style="font-size:11px;color:var(--dim)">{{ _('notes') }}</div><input class="in" id="smsNote" style="width:100%"></div>';
    h+='</div>';
    h+='<div style="margin-top:10px"><button class="btn bp" onclick="saveSmsTemplate()">{{ _('save') }}</button> <button class="btn bo" onclick="document.getElementById(\'smsForm\').style.display=\'none\'">{{ _('cancel') }}</button><input type="hidden" id="smsEditId" value=""></div></div>';

    var cats = d.data.categories;
    var order = ["captcha","notice","promo"];
    h+='<div id="smsTemplatesList">';
    order.forEach(function(k){
      var c = cats[k];
      if(!c||!c.items||!c.items.length) return;
      h+='<div class="cd" style="margin-bottom:12px"><div class="st">'+c.title+' ('+c.items.length+')</div><table><tr><th>{{ _('name') }}</th><th>{{ _('template_code') }}</th><th>{{ _('notes') }}</th><th>{{ _('actions') }}</th></tr>';
      c.items.forEach(function(t){
        h+='<tr><td>'+esc(t.name)+'</td><td style="font-family:monospace;color:var(--accent)">'+esc(t.template_code)+'</td><td style="color:var(--dim)">'+esc(t.note)+'</td>';
        h+='<td><button class="btn bo bs" onclick="editSmsTemplate('+t.id+',\''+t.category+'\',\''+esc(t.name)+'\',\''+esc(t.template_code)+'\',\''+esc(t.note)+'\')">{{ _('edit') }}</button> ';
        h+='<button class="btn bo bs" onclick="deleteSmsTemplate('+t.id+')">{{ _('delete') }}</button></td></tr>';
      });
      h+='</table></div>';
    });
    h+='</div>';
    ct.innerHTML = h;
  }).catch(function(){ct.innerHTML='<div class="em">{{ _('load_failed') }}</div>'});
}

function showSmsForm(){
  document.getElementById("smsFormTitle").textContent = "{{ _('add_template') }}";
  document.getElementById("smsEditId").value = "";
  document.getElementById("smsCat").value = "captcha";
  document.getElementById("smsName").value = "";
  document.getElementById("smsCode").value = "";
  document.getElementById("smsNote").value = "";
  document.getElementById("smsForm").style.display = "";
}

function saveSmsTemplate(){
  var editId = document.getElementById("smsEditId").value;
  var data = {
    category: document.getElementById("smsCat").value,
    name: document.getElementById("smsName").value.trim(),
    template_code: document.getElementById("smsCode").value.trim(),
    note: document.getElementById("smsNote").value.trim()
  };
  if(!data.name||!data.template_code){showToast("{{ _('Name and Template Code required') }}","error");return}
  var url = editId ? "/admin/sms/templates/"+editId : "/admin/sms/templates";
  var method = editId ? "PUT" : "POST";
  fetch(url, {method:method, headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"}, body:JSON.stringify(data)})
  .then(function(r){return r.json()}).then(function(d){
    if(d.success){showToast("{{ _('save_success') }}");document.getElementById("smsForm").style.display="none";loadSmsTemplates()}
    else{showToast(d.error||"{{ _('save_failed') }}","error")}
  }).catch(function(){showToast("{{ _('Request Failed') }}","error")});
}

function editSmsTemplate(id,cat,name,code,note){
  document.getElementById("smsFormTitle").textContent = "{{ _('edit_template') }}";
  document.getElementById("smsEditId").value = id;
  document.getElementById("smsCat").value = cat;
  document.getElementById("smsName").value = name;
  document.getElementById("smsCode").value = code;
  document.getElementById("smsNote").value = note;
  document.getElementById("smsForm").style.display = "";
}

function deleteSmsTemplate(id){
  if(!confirm("{{ _('confirm_delete') }}?")) return;
  fetch("/admin/sms/templates/"+id, {method:"DELETE", headers:{"Authorization":"Bearer "+T}})
  .then(function(r){return r.json()}).then(function(d){
    if(d.success){showToast("{{ _('delete_success') }}");loadSmsTemplates()}
    else{showToast(d.error||"{{ _('delete_failed') }}","error")}
  }).catch(function(){showToast("{{ _('Request Failed') }}","error")});
}
