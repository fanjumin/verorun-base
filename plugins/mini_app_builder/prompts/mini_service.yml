# ── 服务预约小程序 提示词模板 ──

identifier: "mini_service"
name: "服务预约小程序"
description: "适用于美容、医疗、教育、家政等服务行业"
icon: "📅"
industry: "服务"
tags:
  - "预约"
  - "服务"
  - "小程序"
  - "生活服务"

# 小程序专属配置
mini_app:
  tabBar:
    default:
      - { label: "首页", icon: "home", page: "home" }
      - { label: "服务", icon: "shop", page: "services" }
      - { label: "预约", icon: "star", page: "booking" }
      - { label: "我的", icon: "user", page: "profile" }

  supported_features:
    - chat
    - search
    - reviews
    - coupons

defaults:
  site_name: "{品牌名称}"
  industry: "服务"
  style: "专业简洁"
  primary_color: "#2563EB"
  accent_color: "#3B82F6"
  font_preference: "sans-serif"
  tone: "专业、信赖、温暖"

pages:
  - id: "home"
    name: "首页"
    required: true
  - id: "services"
    name: "服务"
    required: true
  - id: "booking"
    name: "预约"
    required: true
  - id: "profile"
    name: "我的"
    required: true

prompts:
  parse: |
    你是一个小程序策划师。用户想创建一个{行业}预约小程序。

    用户描述：{用户输入}

    请提取以下信息并以 JSON 格式返回：
    {{
      "brand_name": "品牌名称",
      "tagline": "品牌口号（10字以内）",
      "core_services": ["核心服务1", "核心服务2"],
      "target_audience": "目标客户群体",
      "style_preference": "现代/经典/极简/活泼",
      "features": ["需要的功能列表"],
      "special_requirements": "特殊需求"
    }}
    只返回 JSON，不要其他内容。

  brand: |
    你是一个品牌设计师。为【{品牌名称}】设计小程序品牌配置，行业为【{行业}】。

    要求：
    - 品牌口号：专业可信，突出服务品质
    - 品牌故事：150字左右，讲述品牌理念和服务承诺
    - 主色调：适合{行业}的专业配色方案
    - 风格：{风格偏好}

    返回 JSON 格式：
    {{
      "app_name": "品牌名称",
      "tagline": "品牌口号",
      "brand_story": "品牌故事",
      "primary_color": "#HEX",
      "secondary_color": "#HEX",
      "accent_color": "#HEX"
    }}

  tabBar: |
    你是一个小程序设计师。为【{品牌名称}】设计底部 tabBar。

    可用的功能模块：{功能列表}

    返回 JSON 格式：
    {{
      "tabBar": [
        {{ "label": "首页", "icon": "home", "page": "home" }},
        {{ "label": "服务", "icon": "shop", "page": "services" }},
        {{ "label": "预约", "icon": "star", "page": "booking" }},
        {{ "label": "我的", "icon": "user", "page": "profile" }}
      ]
    }}

  page_home: |
    你是一个小程序设计师。为【{品牌名称}】生成首页内容。

    行业：{行业}，风格：{风格偏好}

    首页区块设计：
    1. Hero 区：品牌价值主张 + 核心服务亮点
    2. 服务分类入口：图标导航
    3. 【可选】如果用户提到"好评"或"口碑"，插入 W07(用户评价，count=5)
    4. 关于品牌：简短介绍
    5. 【可选】如果用户提到"最新"或"动态"，插入 W01(最新文章，count=3)

    返回 JSON 格式，包含 sections 和 widgets：
    {{
      "sections": [
        {{
          "block_type": "hero",
          "title": "主标题",
          "subtitle": "副标题",
          "cta_text": "立即预约",
          "cta_url": "/booking"
        }},
        {{
          "block_type": "grid",
          "title": "我们的服务",
          "items": [
            {{ "title": "服务1", "icon": "💇", "description": "描述" }}
          ]
        }}
      ],
      "widgets": []
    }}

  page_services: |
    你是一个小程序设计师。为【{品牌名称}】生成服务列表页。

    要求：
    - 服务分类筛选
    - 服务卡片（名称、时长、价格、简介）
    - 【可选】搜索框：W12(搜索框，scope=services，placeholder="搜索服务...")

    返回 JSON 格式。

  page_booking: |
    你是一个小程序设计师。为【{品牌名称}】生成预约页面。

    要求：
    - 服务选择区
    - 时间选择（日期 + 时段）
    - 用户信息填写（姓名、手机号、备注）
    - 【可选】优惠券选择：W10(优惠券入口，scene=booking)
    - 提交按钮

    返回 JSON 格式。

  page_profile: |
    你是一个小程序设计师。为【{品牌名称}】生成个人中心页面。

    要求：
    - 用户头像/昵称
    - 预约记录入口（待确认/已确认/已完成/已取消）
    - 收藏服务入口
    - 优惠券入口
    - 设置入口

    返回 JSON 格式。
