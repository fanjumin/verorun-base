{# Subscription Admin — inline partial (Phase 3.2) #}
{# V20260809: convert from iframe (subscribe_admin.html) to l_subscription_admin() #}
{# menu key: subscription_admin #}
<script>
window.l_subscription_admin = function () {
  document.getElementById('pt').textContent = {{ _('Subscription Management') | tojson }};
  var mc = document.getElementById('mc');
  mc.innerHTML = '<div class="lo"><div class="s"></div>{{ _('Loading...') }}...</div>';
  subRenderPanel();
  subLoadItems();
  subLoadUsers();
  subLoadOrders();
};

var subActiveTab = 'items';

function subRenderPanel() {
  var mc = document.getElementById('mc');
  mc.innerHTML =
    '<div class="pg">' +
      '<!-- Tabs -->' +
      '<div class="f mb" style="border-bottom:1px solid var(--border)">' +
        '<div class="subtab active" id="tab-items" onclick="subSwitchTab(\'items\')">{{ _('Plans') }}</div>' +
        '<div class="subtab" id="tab-users" onclick="subSwitchTab(\'users\')">{{ _('Subscribers') }}</div>' +
        '<div class="subtab" id="tab-orders" onclick="subSwitchTab(\'orders\')">{{ _('Orders') }}</div>' +
      '</div>' +

      '<!-- Plans Panel -->' +
      '<div id="panel-items" style="margin-bottom:16px">' +
        '<div class="f mb" style="justify-content:space-between;align-items:center">' +
          '<strong>{{ _('Subscription Plans') }}</strong>' +
          '<button class="btn btn-p" onclick="subShowAddItem()">{{ _('Add Plan') }}</button>' +
        '</div>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>{{ _('Key') }}</th><th>{{ _('Name') }}</th><th>{{ _('Price') }}</th><th>{{ _('Category') }}</th><th>{{ _('Status') }}</th><th>{{ _('Actions') }}</th></tr></thead>' +
          '<tbody id="items-tbody"><tr><td colspan="6" class="tdim">{{ _('Loading...') }}</td></tr></tbody>' +
        '</table></div>' +
      '</div>' +

      '<!-- Subscribers Panel -->' +
      '<div id="panel-users" style="display:none;margin-bottom:16px">' +
        '<div class="f mb" style="gap:12px;align-items:flex-end">' +
          '<div style="flex:0 0 200px"><label style="font-size:12px;color:var(--dim)">{{ _('Filter by User ID') }}</label>' +
          '<input class="inp" id="user-filter" placeholder="{{ _('Enter user ID') }}" style="height:34px;width:100%" onchange="subLoadUsers()"></div>' +
        '</div>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>{{ _('User ID') }}</th><th>{{ _('Plan') }}</th><th>{{ _('Status') }}</th><th>{{ _('Start') }}</th><th>{{ _('End') }}</th></tr></thead>' +
          '<tbody id="users-tbody"><tr><td colspan="5" class="tdim">{{ _('Loading...') }}</td></tr></tbody>' +
        '</table></div>' +
      '</div>' +

      '<!-- Orders Panel -->' +
      '<div id="panel-orders" style="display:none">' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>{{ _('Order No.') }}</th><th>{{ _('User ID') }}</th><th>{{ _('Item') }}</th><th>{{ _('Amount') }}</th><th>{{ _('Status') }}</th><th>{{ _('Created') }}</th></tr></thead>' +
          '<tbody id="orders-tbody"><tr><td colspan="6" class="tdim">{{ _('Loading...') }}</td></tr></tbody>' +
        '</table></div>' +
      '</div>' +
    '</div>';
}

function subSwitchTab(name) {
  subActiveTab = name;
  document.querySelectorAll('.subtab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('panel-items').style.display = name==='items'?'block':'none';
  document.getElementById('panel-users').style.display = name==='users'?'block':'none';
  document.getElementById('panel-orders').style.display = name==='orders'?'block':'none';
}

function subLoadItems() {
  fetch('/plugin/subscription/admin/items', { headers: { 'Authorization': 'Bearer ' + T } })
    .then(function(r){return r.json()})
    .then(function(data){
      var tb = document.getElementById('items-tbody');
      if(!tb) return;
      tb.innerHTML = '';
      if(!data.items||!data.items.length){tb.innerHTML='<tr><td colspan="6" class="tdim">{{ _('No plans configured') }}</td></tr>';return}
      data.items.forEach(function(item){
        var tr=document.createElement('tr');
        tr.innerHTML=
          '<td><code>'+esc(item.item_key)+'</code></td>'+
          '<td><strong>'+esc(item.name||item.item_key)+'</strong></td>'+
          '<td>&yen;'+(item.price_month_yuan||'-')+' / '+(item.price_year_yuan||'-')+'</td>'+
          '<td>'+esc(item.category||'-')+'</td>'+
          '<td><span class="bdg '+(item.is_active?'on':'off')+'">'+(item.is_active?'{{ _('Active') }}':'{{ _('Inactive') }}')+'</span></td>'+
          '<td><button class="btn bo bs" style="font-size:11px;color:#f85149" onclick="subDeleteItem(\''+escAttr(item.item_key)+'\')">{{ _('Delete') }}</button></td>';
        tb.appendChild(tr);
      });
    }).catch(function(e){console.error('Load items failed:',e)});
}

function subLoadUsers() {
  var uid=document.getElementById('user-filter');
  var url='/plugin/subscription/admin/users';
  if(uid&&uid.value) url+='?user_id='+encodeURIComponent(uid.value);
  fetch(url,{headers:{'Authorization':'Bearer '+T}})
    .then(function(r){return r.json()})
    .then(function(data){
      var tb=document.getElementById('users-tbody');
      if(!tb) return;
      tb.innerHTML='';
      if(!data.subscriptions||!data.subscriptions.length){tb.innerHTML='<tr><td colspan="5" class="tdim">{{ _('No subscriptions found') }}</td></tr>';return}
      data.subscriptions.forEach(function(s){
        var tr=document.createElement('tr');
        tr.innerHTML=
          '<td>'+s.user_id+'</td>'+
          '<td>'+esc(s.item_key||'-')+'</td>'+
          '<td><span class="bdg '+(s.status==='active'?'on':'off')+'">'+(s.status==='active'?'{{ _('Active') }}':esc(s.status))+'</span></td>'+
          '<td style="font-size:12px">'+esc(s.period_start||'-')+'</td>'+
          '<td style="font-size:12px">'+esc(s.period_end||'-')+'</td>';
        tb.appendChild(tr);
      });
    }).catch(function(e){console.error('Load users failed:',e)});
}

function subLoadOrders() {
  fetch('/plugin/subscription/admin/orders',{headers:{'Authorization':'Bearer '+T}})
    .then(function(r){return r.json()})
    .then(function(data){
      var tb=document.getElementById('orders-tbody');
      if(!tb) return;
      tb.innerHTML='';
      if(!data.orders||!data.orders.length){tb.innerHTML='<tr><td colspan="6" class="tdim">{{ _('No orders found') }}</td></tr>';return}
      data.orders.forEach(function(o){
        var tr=document.createElement('tr');
        tr.innerHTML=
          '<td><code>'+esc(o.order_no||'-')+'</code></td>'+
          '<td>'+(o.user_id||'-')+'</td>'+
          '<td>'+esc(o.item_key||'-')+'</td>'+
          '<td>&yen;'+(o.amount_yuan||'-')+'</td>'+
          '<td><span class="bdg '+(o.status==='paid'?'on':o.status==='refunded'?'off':'')+'">'+esc(o.status||'-')+'</span></td>'+
          '<td style="font-size:12px">'+esc(o.created_at||'-')+'</td>';
        tb.appendChild(tr);
      });
    }).catch(function(e){console.error('Load orders failed:',e)});
}

function subShowAddItem() {
  var itemKey=prompt('{{ _('Enter plan key:') }}');
  if(!itemKey) return;
  var nameZh=prompt('{{ _('Enter plan name (Chinese):') }}');
  if(!nameZh) return;
  var nameEn=prompt('{{ _('Enter plan name (English):') }}')||nameZh;
  var category=prompt('{{ _('Enter category:') }}')||'feature';
  var priceMonth=parseFloat(prompt('{{ _('Enter monthly price (yuan):') }}')||'0');
  var priceYear=parseFloat(prompt('{{ _('Enter yearly price (yuan):') }}')||'0');
  var descZh=prompt('{{ _('Enter description (Chinese):') }}')||'';
  var descEn=prompt('{{ _('Enter description (English):') }}')||'';
  fetch('/plugin/subscription/admin/items',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+T},
    body:JSON.stringify({
      item_key:itemKey,category:category,
      name_zh:nameZh,name_en:nameEn,
      description_zh:descZh,description_en:descEn,
      price_month:Math.round(priceMonth*100),price_year:Math.round(priceYear*100),
      is_active:1
    })
  })
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.message){subLoadItems();showToast('{{ _('Plan created') }}','success')}
    else{showToast(d.error||'{{ _('Failed') }}','error')}
  })
  .catch(function(e){showToast(e.message,'error')});
}

function subDeleteItem(key){
  if(!confirm('{{ _('Delete this plan?') }}')) return;
  fetch('/plugin/subscription/admin/items/'+encodeURIComponent(key),{
    method:'DELETE',
    headers:{'Authorization':'Bearer '+T}
  })
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.message){subLoadItems();showToast('{{ _('Plan deleted') }}','success')}
    else{showToast(d.error||'{{ _('Failed') }}','error')}
  })
  .catch(function(e){showToast(e.message,'error')});
}
</script>

<style>
/* Subscription admin tab styles — scoped to #mc content */
.subtab {
  padding: 10px 18px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.subtab:hover { color: var(--ink); }
.subtab.active { color: var(--accent); border-bottom-color: var(--accent); }
</style>
