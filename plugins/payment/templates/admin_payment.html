// Payment Management — 支付管理插件面板
// 无 <script> 标签，遵循插件模板铁律 §12.11
// 支持 Alipay/WeChat/Stripe/PayPal，CN/INTL 市场自动检测

var _payProviders = {};
var _payConfigs = {};
var _payMarket = 'cn';

// 注入支付面板专用 CSS（由 JS 动态创建 style 标签，不污染插件模板格式）
(function(){
  var style = document.createElement('style');
  style.id = 'pay-plugin-styles';
  style.textContent = [
    '.pay-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}',
    '.pay-header h2{margin:0;font-size:20px;font-weight:600}',
    '.pay-market-tag{font-size:12px;padding:2px 10px;border-radius:10px;font-weight:500}',
    '.pay-market-tag.cn{background:#ddf4ff;color:#0969da}',
    '.pay-market-tag.intl{background:#f3e8ff;color:#8250df}',
    '.pay-provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px}',
    '.pay-card{background:#fff;border:1px solid #d0d7de;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}',
    '.pay-card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#f6f8fa;border-bottom:1px solid #d0d7de;cursor:pointer;user-select:none}',
    '.pay-card-header:hover{background:#f0f2f5}',
    '.pay-card-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}',
    '.pay-card-badge{font-size:11px;padding:1px 8px;border-radius:8px;background:#e6e6e6;color:#656d76}',
    '.pay-card-badge.ok{background:#dafbe1;color:#1a7f37}',
    '.pay-card-body{display:none}',
    '.pay-card.open .pay-card-body{display:block}',
    '.pay-field{margin-bottom:14px;padding:0 18px}',
    '.pay-field label{display:block;font-size:13px;font-weight:500;color:#24292f;margin-bottom:4px}',
    '.pay-field input,.pay-field textarea,.pay-field select{width:100%;padding:8px 10px;border:1px solid #d0d7de;border-radius:6px;font-size:13px;box-sizing:border-box;outline:none;transition:border-color .15s}',
    '.pay-field input:focus,.pay-field textarea:focus,.pay-field select:focus{border-color:#0969da;box-shadow:0 0 0 2px rgba(9,105,218,.2)}',
    '.pay-field textarea{min-height:60px;font-family:monospace;font-size:12px}',
    '.pay-field .pay-hint{font-size:11px;color:#656d76;margin-top:3px}',
    '.pay-save-row{padding:12px 18px}',
    '.pay-save-btn{padding:8px 20px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:#0969da;color:#fff;transition:background .15s}',
    '.pay-save-btn:hover{background:#0550ae}',
    '.pay-save-btn:disabled{opacity:.5;cursor:not-allowed}',
    '.pay-save-btn.saving{background:#6e7681}',
    '.pay-header-actions{display:flex;align-items:center;gap:8px}',
    '.pay-delete-btn{padding:4px 10px;border:1px solid #d0d7de;border-radius:6px;font-size:12px;cursor:pointer;background:transparent;color:#656d76;transition:all .15s}',
    '.pay-delete-btn:hover{border-color:#f85149;color:#f85149;background:#fff0ee}',
    '.pay-status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}',
    '.pay-status-dot.green{background:#1a7f37}',
    '.pay-status-dot.gray{background:#8b949e}',
    '.pay-no-config{text-align:center;padding:40px;color:#656d76;font-size:14px}'
  ].join('\n');
  if(!document.getElementById('pay-plugin-styles')) document.head.appendChild(style);
})();

window.l_payment = function(){
  document.getElementById("pt").textContent = "{{ _('payment_management') }}";
  var mc = document.getElementById("mc");
  mc.innerHTML =
    '<div class="pay-header">'+
      '<h2>{{ _('payment_config') }}</h2>'+
      '<span class="pay-market-tag cn" id="payMarketTag">CN</span>'+
    '</div>'+
    '<div id="payProviderGrid" class="pay-provider-grid">'+
      '<div class="pay-no-config"><div class="s" style="display:inline-block"></div> {{ _('Loading...') }}</div>'+
    '</div>';
  loadPayProviders();
};

function loadPayProviders(){
  fetch('/admin/payment/providers?market=' + _payMarket, {headers:{"Authorization":"Bearer "+T}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.success){showToast(d.error||'{{ _("Load failed") }}','error');return}
      _payProviders = d.data || {};
      loadPayConfigs();
    })
    .catch(function(){showToast('{{ _("Request Failed") }}','error')});
}

function loadPayConfigs(){
  fetch('/admin/payment/configs', {headers:{"Authorization":"Bearer "+T}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.success){showToast(d.error||'{{ _("Load failed") }}','error');return}
      var map = {};
      (d.data||[]).forEach(function(item){map[item.provider] = item.configs || {};});
      _payConfigs = map;
      // 自动检测市场
      _payMarket = 'cn';
      Object.keys(map).forEach(function(p){
        if(_payProviders[p] && _payProviders[p].market === 'intl' && Object.keys(map[p]||{}).length > 0)
          _payMarket = 'intl';
      });
      // 如果检测到市场变化，重新加载 providers
      if(_payMarket === 'intl'){
        loadPayProvidersIntl();
      } else {
        renderPayCards();
      }
    })
    .catch(function(){showToast('{{ _("Request Failed") }}','error')});
}

function loadPayProvidersIntl(){
  fetch('/admin/payment/providers?market=' + _payMarket, {headers:{"Authorization":"Bearer "+T}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.success) _payProviders = d.data || {};
      renderPayCards();
    })
    .catch(function(){renderPayCards();});
}

function renderPayCards(){
  var grid = document.getElementById('payProviderGrid');
  if(!grid) return;
  var keys = Object.keys(_payProviders);
  if(!keys.length){
    grid.innerHTML = '<div class="pay-no-config">{{ _("No payment providers available") }}</div>';
    return;
  }

  var h = '';
  keys.forEach(function(provider){
    var info = _payProviders[provider];
    var cfg = _payConfigs[provider] || {};
    var label = _payMarket === 'cn' ? (info.label_zh || info.label) : info.label;
    var fields = info.fields || [];
    var configured = fields.filter(function(f){return f.type==='password'||f.type==='text'}).every(function(f){return cfg[f.key] && cfg[f.key].length > 0});
    var fieldCount = fields.filter(function(f){return cfg[f.key] && cfg[f.key].length > 0}).length;

    h += '<div class="pay-card" data-provider="' + esc(provider) + '">';
    h += '<div class="pay-card-header" onclick="payToggleCard(this)">';
    h += '<div class="pay-card-title"><span class="pay-status-dot ' + (configured ? 'green' : 'gray') + '"></span>' + esc(label) + '<span class="pay-card-badge ' + (configured ? 'ok' : '') + '">' + fieldCount + '/' + fields.length + '</span></div>';
    h += '<div class="pay-header-actions">';
    h += '<button class="pay-delete-btn" onclick="event.stopPropagation();payClearConfig(\'' + esc(provider) + '\')">{{ _("Clear") }}</button>';
    h += '<span style="color:#8b949e;font-size:16px">&#9662;</span>';
    h += '</div></div>';
    h += '<div class="pay-card-body">';

    fields.forEach(function(f){
      var val = cfg[f.key] || '';
      var fLabel = _payMarket === 'cn' ? (f.label_zh || f.label) : f.label;
      h += '<div class="pay-field">';
      h += '<label for="pf-' + esc(provider) + '-' + esc(f.key) + '">' + esc(fLabel) + '</label>';
      if(f.type === 'password'){
        h += '<input id="pf-' + esc(provider) + '-' + esc(f.key) + '" type="password" value="' + esc(val) + '" placeholder="' + (val ? '{{ _("Configured, leave empty to keep") }}' : '{{ _("Required") }}') + '" />';
      } else if(f.type === 'textarea'){
        h += '<textarea id="pf-' + esc(provider) + '-' + esc(f.key) + '" placeholder="' + esc(fLabel) + '">' + esc(val) + '</textarea>';
      } else if(f.type === 'checkbox'){
        h += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input id="pf-' + esc(provider) + '-' + esc(f.key) + '" type="checkbox" ' + (val === 'true' || val === '1' ? 'checked' : '') + ' style="width:auto" /> ' + fLabel + '</label>';
      } else if(f.type === 'select' && f.options){
        h += '<select id="pf-' + esc(provider) + '-' + esc(f.key) + '">';
        f.options.forEach(function(opt){
          var optLabel = _payMarket === 'cn' ? (opt.label_zh || opt.label) : opt.label;
          h += '<option value="' + esc(opt.value) + '" ' + ((val||f.default) === opt.value ? 'selected' : '') + '>' + esc(optLabel) + '</option>';
        });
        h += '</select>';
      } else {
        h += '<input id="pf-' + esc(provider) + '-' + esc(f.key) + '" type="text" value="' + esc(val) + '" placeholder="' + esc(fLabel) + '" />';
      }
      if(f.hint){
        var hintTxt = _payMarket === 'cn' ? (f.hint_zh || f.hint) : f.hint;
        if(hintTxt) h += '<div class="pay-hint">' + esc(hintTxt) + '</div>';
      }
      h += '</div>';
    });

    h += '<div class="pay-save-row"><button class="pay-save-btn" onclick="paySaveConfig(\'' + esc(provider) + '\')" id="paySaveBtn-' + esc(provider) + '">{{ _("save") }}</button></div>';
    h += '</div></div>';
  });

  grid.innerHTML = h;
  document.getElementById('payMarketTag').textContent = _payMarket.toUpperCase();
  document.getElementById('payMarketTag').className = 'pay-market-tag ' + _payMarket;
}

window.payToggleCard = function(header){
  header.parentNode.classList.toggle('open');
};

window.paySaveConfig = function(provider){
  var btn = document.getElementById('paySaveBtn-' + provider);
  if(!btn) return;
  btn.disabled = true; btn.textContent = '{{ _("Saving...") }}'; btn.className = 'pay-save-btn saving';

  var info = _payProviders[provider];
  if(!info) return;
  var configs = {};
  (info.fields||[]).forEach(function(f){
    var el = document.getElementById('pf-' + provider + '-' + f.key);
    if(!el) return;
    var val;
    if(f.type === 'checkbox'){
      val = el.checked ? 'true' : '';
    } else {
      val = el.value.trim();
    }
    if(val) configs[f.key] = val;
  });

  fetch('/admin/payment/configs/' + provider, {
    method: 'PUT',
    headers: {'Authorization':'Bearer '+T, 'Content-Type':'application/json'},
    body: JSON.stringify({configs: configs})
  }).then(function(r){return r.json()}).then(function(d){
    if(d.success){showToast('{{ _("save_success") }}'); loadPayConfigs(); return; }
    showToast(d.error||'{{ _("save_failed") }}','error');
    btn.disabled = false; btn.textContent = '{{ _("save") }}'; btn.className = 'pay-save-btn';
  }).catch(function(){
    showToast('{{ _("save_failed") }}','error');
    btn.disabled = false; btn.textContent = '{{ _("save") }}'; btn.className = 'pay-save-btn';
  });
};

window.payClearConfig = function(provider){
  if(!confirm('{{ _("Clear all") }} ' + provider + ' {{ _("configuration?") }}')) return;
  fetch('/admin/payment/configs/' + provider, {
    method: 'DELETE',
    headers: {'Authorization':'Bearer '+T}
  }).then(function(r){return r.json()}).then(function(d){
    if(d.success){showToast('{{ _("Cleared") }}'); loadPayConfigs(); return; }
    showToast(d.error||'{{ _("Failed") }}','error');
  });
};
