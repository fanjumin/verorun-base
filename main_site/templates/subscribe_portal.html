<!DOCTYPE html>

<html lang="{{ )LANG }}">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>{{ _('Subscription') }} — {{ brand.site_name_cn if brand else '' }}</title>
<link href="{{ brand.favicon_url if brand and brand.favicon_url else '/static/favicon-32x32.png' }}" rel="icon" sizes="32x32" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="/static/css/design-system.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-cn);min-height:100vh}
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg-glass);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
.nav-bar .logo{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.nav-bar nav{display:flex;gap:12px;align-items:center}
.nav-bar nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:.15s}
.nav-bar nav a:hover{color:var(--text);background:rgba(99,102,241,.08)}
.nav-bar nav a.active{color:var(--accent2);background:rgba(34,211,238,.08)}
.body-wrap{max-width:800px;margin:0 auto;padding:32px 24px 80px}

/* 订阅卡片 */
.sub-card{background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:20px}
.sub-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.sub-head .name{font-size:20px;font-weight:700;color:var(--text-high)}
.sub-head .badge{display:inline-block;padding:4px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-left:10px}
.badge-active{background:rgba(0,255,159,.12);color:var(--accent3)}
.badge-trialing{background:rgba(99,102,241,.12);color:var(--accent)}
.badge-canceled{background:rgba(240,192,64,.12);color:#f0c040}
.badge-past_due{background:rgba(248,81,73,.12);color:#f85149}
.badge-expired{background:rgba(255,255,255,.04);color:var(--dim)}

.sub-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.sub-grid .cell{text-align:center;padding:16px;background:var(--bg-elevated);border-radius:10px}
.sub-grid .cell .val{font-size:22px;font-weight:700;color:var(--text-high)}
.sub-grid .cell .lbl{font-size:12px;color:var(--dim);margin-top:2px}

.sub-actions{display:flex;gap:8px;flex-wrap:wrap}
.sub-actions .btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-cn);transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff;border:none}
.btn-primary:hover{background:#5558e6}
.btn-outline{border:1px solid var(--border);background:transparent;color:var(--text-dim)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{border:1px solid #f85149;color:#f85149;background:transparent}
.btn-danger:hover{background:rgba(248,81,73,.08)}
.btn-success{border:1px solid var(--accent3);color:var(--accent3);background:transparent}
.btn-success:hover{background:rgba(0,255,159,.08)}
.btn-link{color:var(--accent);text-decoration:none;font-size:13px;padding:10px 20px;display:inline-flex;align-items:center;gap:6px}
.btn-link:hover{text-decoration:underline}

.section-title{font-size:16px;font-weight:700;margin:24px 0 12px;color:var(--text-high)}
.plan-card{background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;transition:all .2s;cursor:pointer}
.plan-card:hover{border-color:var(--border-accent)}
.plan-card.selected{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
.plan-card .info{flex:1}
.plan-card .info .pn{font-size:14px;font-weight:600;color:var(--text-high)}
.plan-card .info .pd{font-size:12px;color:var(--dim);margin-top:2px}
.plan-card .price{font-size:16px;font-weight:700;color:var(--accent)}
.plan-card .current-mark{font-size:10px;color:var(--accent3);background:rgba(0,255,159,.1);padding:2px 8px;border-radius:4px;margin-left:6px}

.empty-state{text-align:center;padding:60px 32px;color:var(--dim)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state a{color:var(--accent);text-decoration:none}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:999;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:420px;width:90%}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text-high)}
.modal-box p{font-size:13px;color:var(--text-dim);margin-bottom:16px;line-height:1.6}
.modal-box .btn-row{display:flex;gap:8px;justify-content:flex-end}
.modal-box .btn-row .btn{padding:8px 20px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-cn)}
.modal-box .btn-row .btn-confirm{background:var(--accent);color:#fff;border:none}
.modal-box .btn-row .btn-cancel{border:1px solid var(--border);background:transparent;color:var(--text-dim)}
.modal-box textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elevated);color:var(--text);font-size:12px;font-family:var(--font-cn);margin-bottom:12px;resize:vertical}
.modal-box .radio-group label{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;font-size:13px;color:var(--text-dim)}
.modal-box .radio-group input{margin:0}

.order-card{background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:6px}
.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.order-card .oid{font-size:11px;font-family:monospace;color:var(--dim)}
.order-card .st{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.st-pending{background:rgba(240,192,64,.12);color:#f0c040}
.st-paid{background:rgba(0,255,159,.1);color:var(--accent3)}
.st-failed{background:rgba(248,81,73,.06);color:#f87171}
.st-cancelled{background:rgba(255,255,255,.04);color:var(--dim)}
.order-card .bt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)}
.order-card .bt .amt{font-weight:700;color:var(--accent);font-size:14px}
.order-card .bt .tm{font-size:11px}

.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:10px;font-size:13px;animation:slideIn .3s}
.toast.success{background:rgba(0,255,159,.15);border:1px solid var(--accent3);color:var(--accent3)}
.toast.error{background:rgba(248,81,73,.15);border:1px solid #f85149;color:#f85149}
.toast.info{background:rgba(99,102,241,.15);border:1px solid var(--accent);color:var(--accent)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}}
</style>
</head>
<body>
<div id="particles-bg"></div>
<div class="nav-bar">
<a class="logo" href="/">{{ brand.site_name_cn if brand else '' }}</a>
<nav>
<a href="/subscribe">{{ _('Pricing') }}</a>
<a class="active" href="/subscription/portal">{{ _('Subscription') }}</a>
<a href="/">{{ _('Dashboard') }}</a>
<a href="/">{{ _('Home') }}</a>
</nav>
</div>
<div class="body-wrap" id="app">
<div style="text-align:center;padding:80px 0">
<div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px"></div>
<div style="color:var(--dim);font-size:13px">{{ _('Loading...') }}</div>
</div>
</div>
<div class="modal-overlay" id="confirmModal">
<div class="modal-box">
<h3 id="modalTitle">{{ _('Confirm') }}</h3>
<p id="modalBody">{{ _('Are you sure you want to proceed?') }}</p>
<div id="modalExtra"></div>
<div class="btn-row">
<button class="btn btn-cancel" onclick="closeModal()">{{ _('Cancel') }}</button>
<button class="btn btn-confirm" id="modalConfirmBtn" onclick="modalConfirm()">{{ _('Go') }}</button>
</div>
</div>
</div>

<script>
var T = '{{ token or "" }}';
if(!T){T=localStorage.getItem('sso_token')||localStorage.getItem('tm_token')||localStorage.getItem('token')||''}
if(!T){location.href='/login?redirect=/subscription/portal'}

var appEl=document.getElementById('app');
var modalData={};

Promise.all([
  fetch('/subscription/my',{headers:{'Authorization':'Bearer '+T}}).then(function(r){return r.json()}),
  fetch('/subscription/plans',{headers:{'Authorization':'Bearer '+T}}).then(function(r){return r.json()}),
  fetch('/shop/api/user/info',{headers:{'Authorization':'Bearer '+T}}).then(function(r){return r.json()}),
  fetch('/subscription/my/invoices',{headers:{'Authorization':'Bearer '+T}}).then(function(r){return r.json()})
]).then(function(results){
  var subData=results[0], plansData=results[1], userData=results[2], invData=results[3];
  var sub=subData.success?subData.data:null;
  var plans=plansData.success?plansData.data.plans||[]:[];
  var user=userData.success?userData.data:null;
  var invoices=invData.success?invData.data.invoices||[]:[];
  render(sub, plans, user, invoices);
}).catch(function(err){
  appEl.innerHTML='<div class="empty-state"><div class="icon">⚠️</div><div>加载失败，请刷新重试</div></div>';
});

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtY(fen){return fen? (fen/100).toFixed(2) : '0.00'}

function deleteSubOrder(orderNo){
  if(!confirm('确定删除此订单？删除后不可恢复'))return;
  fetch('/subscription/orders/'+encodeURIComponent(orderNo)+'/delete',{method:'POST',headers:{'Authorization':'Bearer '+T}})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){showToast('✅ 已删除','success');location.reload()}
      else showToast(d.error||'操作失败','error');
    });
}

function downloadInvoice(invoiceNo){
  var url='/subscription/my/invoices/'+encodeURIComponent(invoiceNo)+'/download';
  fetch(url,{headers:{'Authorization':'Bearer '+T}}).then(function(r){
    if(!r.ok){showToast('下载失败','error');return null}
    var ct=r.headers.get('content-type')||'';
    if(ct.indexOf('application/pdf')>=0){
      return r.blob().then(function(blob){
        var a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=invoiceNo+'.pdf';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
      });
    }else{
      return r.json().then(function(d){
        if(d.success){showToast('📄 发票信息已返回','info')}
        else showToast(d.error||'下载失败','error');
      });
    }
  }).catch(function(){showToast('网络错误','error')});
}

function render(sub, plans, user, invoices){
  var h='';

  if(!user){
    h+='<div class="empty-state"><div class="icon">🔒</div><div>请先登录</div><a href="/login?redirect=/subscription/portal">→ 去登录</a></div>';
    appEl.innerHTML=h; return;
  }

  var displayName=esc(user.display_name||user.username||user.phone||'用户');
  h+='<div style="font-size:13px;color:var(--dim);margin-bottom:20px">你好，'+displayName+'</div>';

  if(sub && sub.active && sub.subscription){
    var s=sub.subscription, p=sub.plan||{};
    var status=s.status||'active';
    var stLabels={active:'已激活',trialing:'试用中',canceled:'已取消',past_due:'逾期',expired:'已过期'};
    var endDate=(s.current_period_end||'').slice(0,10);
    var nextBill = (sub.auto_renew && sub.next_billing_amount>0) ? '¥'+fmtY(sub.next_billing_amount)+' ('+endDate+')' : '';

    h+='<div class="sub-card">';
    h+='<div class="sub-head"><div><span class="name">'+esc(p.name||s.plan_key||'当前套餐')+'</span><span class="badge badge-'+status+'">'+(stLabels[status]||status)+'</span></div></div>';
    h+='<div class="sub-grid">';
    h+='<div class="cell"><div class="val">'+sub.days_remaining+'</div><div class="lbl">剩余天数</div></div>';
    h+='<div class="cell"><div class="val">'+(endDate||'-')+'</div><div class="lbl">到期日期</div></div>';
    h+='<div class="cell"><div class="val">'+(sub.auto_renew?'✅ 开启':'❌ 关闭')+'</div><div class="lbl">自动续费</div></div>';
    h+='</div>';
    if(nextBill) h+='<div style="font-size:13px;color:var(--dim);margin-bottom:16px">下次扣款: '+nextBill+'</div>';

    // 逾期提示
    if(status==='past_due'){
      h+='<div style="background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.3);border-radius:10px;padding:12px 16px;margin-bottom:16px">';
      h+='<div style="font-size:13px;font-weight:600;color:#f85149;margin-bottom:4px">⚠️ 订阅已逾期</div>';
      h+='<div style="font-size:12px;color:var(--dim)">自动续费扣款失败，当前处于 '+sub.days_remaining+' 天宽限期内。请尽快补缴以免服务降级。超期后自动转为免费版。</div>';
      h+='</div>';
    }

    h+='<div class="sub-actions">';
    h+='<a href="/subscribe" class="btn btn-primary">⬆ 升级套餐</a>';
    if(status==='active'||status==='trialing'){
      h+='<button class="btn btn-outline" onclick="showChangePay()">💳 更换支付</button>';
      if(sub.auto_renew){
        h+='<button class="btn btn-danger" onclick="confirmCancel()">✖ 取消续费</button>';
      }else{
        h+='<button class="btn btn-success" onclick="reactivate()">↻ 重新激活</button>';
      }
    }else if(status==='canceled'){
      h+='<button class="btn btn-success" onclick="reactivate()">↻ 重新激活</button>';
    }else if(status==='expired'){
      h+='<a href="/subscribe" class="btn btn-primary">🔄 重新订阅</a>';
    }else if(status==='past_due'){
      h+='<button class="btn btn-primary" onclick="retryPayment()">💰 缴费重试</button>';
      h+='<a href="/subscribe" class="btn btn-outline">🔄 换套餐购买</a>';
    }
    h+='</div></div>';
  }else{
    h+='<div class="sub-card" style="text-align:center;padding:48px"><div style="font-size:15px;color:var(--dim);margin-bottom:16px">暂无活跃订阅</div><a href="/subscribe" class="btn btn-primary" style="padding:12px 32px;display:inline-block">🚀 选择一个套餐</a></div>';
  }

  // 订阅订单历史
  if(sub && sub.recent_orders && sub.recent_orders.length>0){
    h+='<div class="section-title">📄 订阅账单</div>';
    var itemTypes={new:'新订阅',renew:'续费',upgrade:'升级',downgrade:'降级'};
    var stBills={pending:'待支付',paid:'已支付',failed:'失败',cancelled:'已取消'};
    sub.recent_orders.forEach(function(o){
      var canDelete = o.status==='cancelled' || o.status==='failed' || o.status==='pending';
      h+='<div class="order-card">';
      h+='<div class="top"><span class="oid">'+esc(o.order_no)+'</span><div><span style="font-size:11px;color:var(--dim);margin-right:8px">'+(itemTypes[o.item_type]||o.item_type)+'</span><span class="st st-'+o.status+'">'+(stBills[o.status]||o.status)+'</span></div></div>';
      h+='<div class="bt"><span class="amt">¥'+fmtY(o.amount_fen)+'</span><span class="tm">'+(o.created_at||'').slice(0,16)+'</span>';
      if(canDelete) h+='<span style="margin-left:auto"><a href="javascript:void(0)" onclick="deleteSubOrder(\''+esc(o.order_no)+'\')" style="font-size:11px;color:#f85149;text-decoration:none">删除</a></span>';
      h+='</div></div>';
    });
  }

  // 电子发票
  if(invoices && invoices.length>0){
    h+='<div class="section-title">🧾 电子发票</div>';
    invoices.forEach(function(inv){
      h+='<div class="order-card">';
      h+='<div class="top"><span class="oid">'+esc(inv.invoice_no)+'</span>';
      h+='<span style="font-size:11px;color:var(--dim)">'+esc(inv.plan_name)+'</span>';
      h+='<a href="javascript:void(0)" onclick="downloadInvoice(\''+esc(inv.invoice_no)+'\')" class="btn-link" style="font-size:12px;padding:4px 8px">⬇ 下载</a>';
      h+='</div>';
      h+='<div class="bt"><span class="amt">¥'+(inv.amount_yuan||'0.00')+'</span><span class="tm">'+(inv.created_at||'').slice(0,10)+'</span></div>';
      h+='</div>';
    });
  }

  // 套餐对比（快捷升级入口）
  h+='<div class="section-title">📊 所有套餐</div>';
  if(plans.length>0){
    plans.forEach(function(p){
      var isCurrent = sub && sub.subscription && sub.subscription.plan_key===p.plan_key && sub.active;
      var price = p.price_month>0 ? '¥'+p.price_month+'/月' : '免费';
      h+='<div class="plan-card'+(isCurrent?' selected':'')+'" onclick="'+(!isCurrent ? "location.href='/subscribe'" : '')+'">';
      h+='<div class="info"><span class="pn">'+esc(p.name)+(isCurrent?'<span class="current-mark">当前</span>':'')+'</span><div class="pd">'+esc(p.description||'')+'</div></div>';
      h+='<div class="price">'+price+'</div>';
      h+='</div>';
    });
  }

  appEl.innerHTML=h;
}

// ── Modal ──
function openModal(title, body, onConfirm, extraHtml){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').textContent=body;
  document.getElementById('modalExtra').innerHTML=extraHtml||'';
  modalData.onConfirm=onConfirm;
  document.getElementById('confirmModal').classList.add('show');
}
function closeModal(){document.getElementById('confirmModal').classList.remove('show')}
function modalConfirm(){closeModal();if(typeof modalData.onConfirm==='function')modalData.onConfirm();}

// ── Actions ──
function confirmCancel(){
  openModal('取消续费','取消后当前权益仍可用至周期结束，到期不再续费。确定取消？',
    function(){
      fetch('/subscription/cancel',{method:'POST',headers:{'Authorization':'Bearer '+T,'Content-Type':'application/json'},body:JSON.stringify({reason:'用户自助取消'})})
        .then(function(r){return r.json()}).then(function(d){
          if(d.success){showToast('✅ 已取消','success');location.reload()}
          else showToast(d.error||'操作失败','error');
        });
    });
}

function reactivate(){
  fetch('/subscription/reactivate',{method:'POST',headers:{'Authorization':'Bearer '+T}})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){showToast('✅ 已重新激活','success');location.reload()}
      else showToast(d.error||'操作失败','error');
    });
}

function showChangePay(){
  var opts='<div class="radio-group"><label><input type="radio" name="payMethod" value="wechat" checked> 💚 微信支付</label><label><input type="radio" name="payMethod" value="alipay"> 💙 支付宝</label></div>';
  openModal('更换支付方式','选择新的自动续费支付方式：',
    function(){
      var el=document.querySelector('input[name="payMethod"]:checked');
      if(!el){showToast('请选择支付方式','error');return}
      fetch('/subscription/my/payment-method',{method:'PUT',headers:{'Authorization':'Bearer '+T,'Content-Type':'application/json'},body:JSON.stringify({payment_method:el.value})})
        .then(function(r){return r.json()}).then(function(d){
          if(d.success){showToast('✅ 已更新','success');location.reload()}
          else showToast(d.error||'操作失败','error');
        });
    }, opts);
}

function showToast(msg,type){
  var el=document.createElement('div');el.className='toast '+type;el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.remove()},300)},3000);
}

// ── 缴费重试 ──
function retryPayment(){
  openModal('缴费重试','正在生成支付订单...', null, '<div style="text-align:center;padding:20px"><div style="width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto"></div></div>');
  fetch('/subscription/retry-payment',{method:'POST',headers:{'Authorization':'Bearer '+T}})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){
        var pay=d.data;
        closeModal();
        showPaymentModal(pay);
      }else{
        closeModal();
        showToast(d.error||'操作失败','error');
      }
    }).catch(function(){
      closeModal();
      showToast('网络错误，请重试','error');
    });
}

// ── 支付弹窗 ──
function showPaymentModal(pay){
  var h='<div class="modal-box" style="max-width:400px;text-align:center">';
  h+='<h3 style="margin-bottom:8px">💳 支付订单</h3>';
  h+='<div style="font-size:13px;color:var(--dim);margin-bottom:4px">'+esc(pay.plan_name||'续费')+'</div>';
  h+='<div style="font-size:28px;font-weight:800;color:var(--accent);margin:12px 0">'+esc(pay.amount)+'</div>';
  h+='<div style="font-size:11px;color:var(--dim);margin-bottom:16px;font-family:monospace">订单号: '+esc(pay.order_no)+'</div>';

  var pp=pay.pay_params||{};
  if(pp.stub){
    h+='<div style="background:rgba(240,192,64,.08);border:1px solid rgba(240,192,64,.3);border-radius:10px;padding:16px;margin-bottom:16px">';
    h+='<div style="font-size:13px;font-weight:600;color:#f0c040;margin-bottom:6px">🧪 开发模式（Stub）</div>';
    h+='<div style="font-size:12px;color:var(--dim);margin-bottom:12px">模拟支付参数已生成</div>';
    h+='<button class="btn btn-primary" onclick="stubConfirm(\''+esc(pay.order_no)+'\');closeModal()" style="width:100%;justify-content:center">✅ 模拟确认支付</button>';
    h+='</div>';
  }else if(pp.qrcode){
    h+='<div style="margin:12px auto 16px;width:200px;height:200px;border:2px solid var(--border);border-radius:12px;overflow:hidden">';
    h+='<img src="'+esc(pp.qrcode)+'" style="width:100%;height:100%;display:block" alt="支付二维码">';
    h+='</div>';
    h+='<div style="font-size:12px;color:var(--dim)">请使用'+((pay.pay_params&&pay.pay_params.channel)==='alipay'?'支付宝':'微信')+'扫码支付</div>';
  }else if(pp.redirect_url){
    h+='<div style="margin:16px 0">';
    h+='<a href="'+esc(pp.redirect_url)+'" target="_blank" class="btn btn-primary" style="display:inline-flex;padding:12px 32px;justify-content:center">🔗 前往支付</a>';
    h+='</div>';
  }else{
    h+='<div style="background:rgba(248,81,73,.06);border:1px solid #f85149;border-radius:10px;padding:16px;margin-bottom:16px;font-size:13px;color:#f87171">支付参数异常，请联系客服</div>';
  }

  h+='<div class="btn-row" style="justify-content:center;margin-top:16px">';
  h+='<button class="btn btn-cancel" onclick="closeModal()">关闭</button>';
  h+='</div></div>';

  var overlay=document.getElementById('confirmModal');
  document.getElementById('modalTitle').textContent='';
  document.getElementById('modalBody').textContent='';
  document.getElementById('modalExtra').innerHTML=h;
  document.getElementById('modalConfirmBtn').style.display='none';
  overlay.classList.add('show');
}

function stubConfirm(orderNo){
  fetch('/subscription/stub-confirm/'+orderNo,{method:'POST',headers:{'Authorization':'Bearer '+T}})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){showToast('✅ '+d.data.message,'success');setTimeout(function(){location.reload()},1500)}
      else showToast(d.error||'确认失败','error');
    });
}

// 恢复 modal 默认状态
var origOpen=openModal;
openModal=function(title,body,onConfirm,extraHtml){
  document.getElementById('modalConfirmBtn').style.display='';
  origOpen(title,body,onConfirm,extraHtml);
};

var style=document.createElement('style');
style.textContent='@keyframes spin{to{transform:rotate(360deg)}}';
document.head.appendChild(style);
</script>
</body>
</html>
