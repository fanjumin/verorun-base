<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ _('管理后台') }} — {{ brand.site_name_en if brand else '' }}</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ brand.favicon_url if brand and brand.favicon_url else '/static/favicon-32x32.png' }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ brand.favicon_url if brand and brand.favicon_url else '/static/favicon-16x16.png' }}">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<style>
:root{--w:200px;--bg:#0a0a0f;--card:#111118;--border:#1a1a2e;--text:#e0e0e0;--muted:#8b8b8b;--dim:#555;--accent:#00d4aa;--radius:8px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:var(--w);background:#0d0d18;border-right:1px solid var(--border);height:100vh;position:sticky;top:0;overflow-y:auto}
.sidebar .logo{padding:16px;font-size:14px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border)}
.sidebar nav{padding:4px 0}
.ns{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:10px 16px 3px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 16px;color:var(--muted);font-size:12px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.ni:hover{color:var(--text);background:rgba(255,255,255,.02)}
.ni.sel{color:var(--accent);background:rgba(0,212,170,.06);border-right:2px solid var(--accent)}
.main{flex:1;overflow-y:auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--border);font-size:13px}
.top .pt{font-weight:600}
.con{padding:20px 24px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.cd .l{font-size:10px;color:var(--dim);text-transform:uppercase}
.cd .v{font-size:18px;font-weight:700;margin-top:2px}
.cd .v.g{color:var(--accent)}.cd .v.b{color:#58a6ff}.cd .v.r{color:#f85149}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{background:var(--bg);color:var(--dim);padding:6px 8px;text-align:left;border-bottom:2px solid var(--border);font-weight:500}
td{padding:6px 8px;border-bottom:1px solid var(--border);color:var(--muted)}
.st{font-size:13px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:10px}
.em{padding:30px;text-align:center;color:var(--dim);font-size:12px}
.sbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.sbar input{padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;flex:1;max-width:260px;outline:none}
.sbar input:focus{border-color:var(--accent)}
.btn{padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none}
.bp{background:var(--accent);color:#fff}
.bo{background:transparent;color:var(--text);border:1px solid var(--border)}
.bs{padding:3px 8px;font-size:10px}
.bdg{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.bdg.on{background:rgba(0,212,170,.12);color:var(--accent)}
.bdg.off{background:rgba(248,81,73,.1);color:#f85149}
.bdg.pd{background:rgba(240,192,64,.12);color:#f0c040}
.lo{text-align:center;padding:40px;color:var(--dim)}
.s{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.in{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:12px;outline:none}
.in:focus{border-color:var(--accent)}
.sl{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px;border-radius:4px;font-size:12px}
.ta{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px;border-radius:4px;font-size:12px;resize:vertical;width:100%}
.fl{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:12px;width:640px;max-width:90vw;max-height:80vh;overflow-y:auto;padding:24px}
.modal-box h3{font-size:16px;color:var(--text);margin-bottom:8px;padding-right:30px}
.modal-meta{font-size:12px;color:var(--dim);margin-bottom:16px;line-height:1.8}
.modal-meta span{color:var(--muted);margin-right:12px}
.modal-body{font-size:13px;color:var(--text);line-height:1.7;padding:16px;background:var(--bg);border-radius:8px;border:1px solid var(--border);white-space:pre-wrap;word-break:break-word}
.modal-body img{max-width:100%;border-radius:4px}
.modal-attach{margin-top:12px}
.modal-attach a{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;margin:2px;background:var(--bg);border-radius:4px;font-size:12px;color:var(--accent);text-decoration:none}
.modal-attach a:hover{background:var(--border)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid var(--border)}
.toast.show{opacity:1}
.toast.error{color:#f85149;border-color:#f85149}
.toast.success{color:var(--accent);border-color:var(--accent)}
@media(max-width:768px){.sidebar{width:50px}.sidebar .logo span,.ni span,.ns{display:none}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo"><span>{{ _('管理后台') }}</span></div>
  <nav id="nav"></nav>
</div>
<div class="main">
  <div class="top"><div class="pt" id="pt">{{ _('管理后台') }}</div><div><span id="an">-</span> | <a href="/" style="color:var(--dim);font-size:11px">{{ _('返回') }}</a></div></div>
  <div class="con" id="mc"><div class="lo"><div class="s"></div>{{ _('验证身份中...') }}</div></div>
</div>
<div class="toast" id="adminToast"></div>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
var T=localStorage.getItem("sso_token")||localStorage.getItem("tm_token")||localStorage.getItem("token");
if(T)document.cookie="sso_token="+T+"; path=/; max-age=604800";
var P=new URLSearchParams(location.search);
if(P.get("token")){T=P.get("token");localStorage.setItem("sso_token",T);localStorage.setItem("tm_token",T);localStorage.setItem("token",T);document.cookie="sso_token="+T+"; path=/; max-age=604800";window.history.replaceState({},"",window.location.pathname)}
var NAV=[["dashboard", "■", "{{ _('总览') }}", ""], ["", "", "{{ _('管理') }}", "ns"], ["users", "👥", "{{ _('用户管理') }}", ""], ["agents", "🤖", "{{ _('Agent 管理') }}", ""], ["keys", "🔑", "API Key", ""], ["posts", "💬", "{{ _('社区内容') }}", ""], ["contacts", "✉️", "{{ _('工单') }}", ""], ["matrix", "🤖", "{{ _('Agent 矩阵') }}", ""], ["cms", "📄", "{{ _('CMS 管理') }}", ""], ["downloads", "⬇", "{{ _('下载管理') }}", ""], ["", "", "{{ _('财务') }}", "ns"], ["revenue", "📊", "{{ _('收入看板') }}", ""], ["orders", "💳", "{{ _('订单') }}", ""], ["", "", "{{ _('系统') }}", "ns"], ["config", "⚙️", "{{ _('系统设置') }}", ""], ["logs", "📄", "{{ _('操作日志') }}", ""]];
var navEl=document.getElementById("nav");
NAV.forEach(function(n){
  if(n[3]=="ns"){navEl.innerHTML+='<div class="ns">'+n[2]+'</div>';return}
  navEl.innerHTML+='<div class="ni" onclick="go(\''+n[0]+'\')" id="n-'+n[0]+'">'+n[1]+' <span>'+n[2]+'</span></div>';
});

if(!T){document.getElementById("mc").innerHTML='<div class="em">{{ _('请先') }} <a href="/login?redirect=/admin">{{ _('登录') }}</a></div>'}else{init()}

function init(){
  fetch("/admin/dashboard",{headers:{"Authorization":"Bearer "+T}}).then(function(r){
    if(r.status===403){document.getElementById("mc").innerHTML='<div class="em">{{ _('仅管理员可访问') }}</div>';return Promise.reject()}
    if(r.status===401){document.getElementById("mc").innerHTML='<div class="em">{{ _('请先') }} <a href="/login?redirect=/admin">{{ _('登录') }}</a></div>';return Promise.reject()}
    return r.json()
  }).then(function(d){if(d.success){document.getElementById("an").textContent="{{ _('管理员') }}";go("dashboard")}else{document.getElementById("mc").innerHTML='<div class="em">{{ _('身份验证失败') }} - <a href="/login?redirect=/admin">{{ _('请重新登录') }}</a></div>'}}).catch(function(){})
}

function go(s){
  document.querySelectorAll(".ni").forEach(function(n){n.classList.remove("sel")});
  var el=document.getElementById("n-"+s);if(el)el.classList.add("sel");
  document.getElementById("mc").innerHTML='<div class="lo"><div class="s"></div>{{ _('加载中...') }}</div>';
  if(typeof window["l_"+s]=="function")window["l_"+s]();
}

window.l_dashboard=function(){
  document.getElementById("pt").textContent="{{ _('总览') }}";
  fetch("/admin/dashboard",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var ds=d.data;
    var h="<div class=\"gr\">";
    h+=hk("{{ _('总用户') }}",ds.total_users,"b");
    h+=hk("{{ _('活跃用户') }}",ds.active_users,"g");
    h+=hk("API Key",ds.active_api_keys+"/"+ds.total_api_keys,"");
    h+=hk("{{ _('总调用') }}",ds.total_calls,"b");
    h+=hk("{{ _('今日调用') }}",ds.today_calls,"g");
    h+=hk("{{ _('待审核帖') }}",ds.pending_posts,"r");
    h+=hk("{{ _('待处理工单') }}",ds.pending_contacts,"r");
    h+=hk("{{ _('本月收入') }}","\u00a5"+ds.monthly_revenue,"g");
    h+="</div><div class=\"cd\"><div class=\"st\">{{ _('最近注册') }}</div><table>";
    if(ds.recent_users&&ds.recent_users.length){
      h+="<tr><th>ID</th><th>{{ _('昵称') }}</th><th>{{ _('手机') }}</th><th>{{ _('时间') }}</th></tr>";
      ds.recent_users.forEach(function(u){h+="<tr><td>"+u.id+"</td><td>"+(u.nickname||"-")+"</td><td>"+(u.phone||"-")+"</td><td>"+u.created_at+"</td></tr>"});
    }
    h+="</table></div>";
    document.getElementById("mc").innerHTML=h;
  }).catch(function(){})
};
function hk(l,v,c){return '<div class="cd"><div class="l">'+l+'</div><div class="v '+(c||"")+'">'+v+'</div></div>'}

/**
 * {{ _('收入看板') }}
 */
window.l_revenue=function(){
  document.getElementById("pt").textContent="{{ _('收入看板') }}";
  fetch("/admin/revenue/dashboard",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var ds=d.data;
    var h="";

    h+='<div class="gr">';
    h+=hk('{{ _('今日收入') }}','¥'+ds.summary.today_revenue,'g');
    h+=hk('{{ _('本月收入') }}','¥'+ds.summary.this_month,'b');
    h+=hk('{{ _('上月收入') }}','¥'+ds.summary.last_month,'');
    h+=hk('{{ _('环比') }}',(ds.summary.month_change>=0?'+':'')+ds.summary.month_change_pct+'%',ds.summary.month_change>=0?'g':'r');
    h+=hk('MRR','¥'+(ds.subscriptions.mrr||0),'g');
    h+=hk('{{ _('活跃订阅') }}',ds.subscriptions.active||0,'b');
    h+=hk('{{ _('付费用户') }}',ds.subscriptions.total_paid_users||0,'');
    var churnCls=(ds.subscriptions.churn_rate||0)>5?'r':'g';
    h+=hk('{{ _('本月流失率') }}',(ds.subscriptions.churn_rate||0)+'%',churnCls);
    h+=hk('{{ _('上月流失率') }}',(ds.subscriptions.last_churn_rate||0)+'%','');
    h+=hk('{{ _('本月新增') }}',ds.subscriptions.new_this_month||0,'g');
    h+=hk('{{ _('本月取消') }}',ds.subscriptions.canceled_this_month||0,'r');
    h+=hk('{{ _('本月过期') }}',ds.subscriptions.expired_this_month||0,'');
    h+=hk('{{ _('本年度') }}','¥'+ds.summary.this_year,'b');
    h+='</div>';

    // {{ _('近30天活跃订阅数') }}
    var subTrend=ds.subscriptions.active_trend_30d||[];
    if(subTrend.length){
      var maxAct=0;
      subTrend.forEach(function(t){if(t.active_count>maxAct)maxAct=t.active_count});
      maxAct=maxAct||1;
      var subH='<div class="cd"><div class="st">{{ _('近30天活跃订阅数') }}</div><div style="display:flex;align-items:flex-end;gap:2px;height:100px;padding-top:10px">';
      subTrend.forEach(function(t){
        var pct=Math.max(3,t.active_count/maxAct*100);
        var dayLabel=t.day.slice(5);
        subH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100px;justify-content:flex-end">';
        subH+='<div style="width:100%;background:var(--accent);height:'+pct+'%;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s" title="'+t.day+': '+t.active_count+'"></div>';
        subH+='<div style="font-size:7px;color:var(--dim);margin-top:2px;transform:rotate(-45deg);white-space:nowrap">'+dayLabel+'</div>';
        subH+='</div>';
      });
      subH+='</div></div>';
      h+=subH;
    }

    // {{ _('月度流失率趋势') }}
    var churnTrend=ds.subscriptions.churn_trend_12m||[];
    if(churnTrend.length){
      var maxChurn=0;
      churnTrend.forEach(function(t){if(t.churn_rate>maxChurn)maxChurn=t.churn_rate});
      maxChurn=maxChurn||1;
      var churnH='<div class="cd"><div class="st">{{ _('月度流失率趋势（近12月）') }}</div><div style="display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:10px">';
      churnTrend.forEach(function(t){
        var pct=Math.max(3,t.churn_rate/maxChurn*100);
        churnH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:120px;justify-content:flex-end">';
        churnH+='<div style="font-size:8px;color:var(--dim);margin-bottom:2px">'+(t.churn_rate||'0')+'%</div>';
        churnH+='<div style="width:100%;background:'+(t.churn_rate>10?'#f85149':t.churn_rate>5?'#f0c040':'var(--accent3)')+';height:'+pct+'%;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s" title="'+t.ym+': '+t.churn_rate+'%"></div>';
        churnH+='<div style="font-size:8px;color:var(--dim);margin-top:2px">'+(t.ym||'').slice(5)+'</div>';
        churnH+='</div>';
      });
      churnH+='</div></div>';
      h+=churnH;
    }

    // {{ _('近30天收入趋势') }}
    var trend=ds.trend_30d||[];
    if(trend.length){
      var maxRev=0;
      trend.forEach(function(t){if(t.revenue>maxRev)maxRev=t.revenue});
      maxRev=maxRev||1;
      var barH='<div class="cd"><div class="st">{{ _('近30天收入趋势') }}</div><div style="display:flex;align-items:flex-end;gap:2px;height:140px;padding-top:10px">';
      trend.forEach(function(t){
        var pct=Math.max(3,t.revenue/maxRev*100);
        var dayLabel=t.day.slice(5);
        barH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:140px;justify-content:flex-end">';
        barH+='<div style="width:100%;background:'+(t.revenue>0?'var(--accent)':'var(--border)')+';height:'+pct+'%;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s" title="'+t.day+': ¥'+t.revenue+'"></div>';
        barH+='<div style="font-size:7px;color:var(--dim);margin-top:2px;transform:rotate(-45deg);white-space:nowrap">'+dayLabel+'</div>';
        barH+='</div>';
      });
      barH+='</div></div>';
      h+=barH;
    }

    // {{ _('收入类型分布') }}
    var byType=ds.by_type||[];
    if(byType.length){
      h+='<div class="cd"><div class="st">{{ _('收入类型分布') }}</div><table><tr><th>{{ _('类型') }}</th><th>{{ _('金额') }}</th><th>{{ _('占比') }}</th></tr>';
      var totalType=0;
      byType.forEach(function(t){totalType+=t.revenue});
      totalType=totalType||1;
      byType.forEach(function(t){
        var pct=(t.revenue/totalType*100).toFixed(1);
        h+='<tr><td>'+t.type+'</td><td>¥'+t.revenue+'</td><td><div style="display:flex;align-items:center;gap:6px"><div style="background:var(--accent);width:'+pct+'px;max-width:100px;height:8px;border-radius:4px"></div>'+pct+'%</div></td></tr>';
      });
      h+='</table></div>';
    }

    // {{ _('支付方式分布') }}
    var pm=ds.pay_methods||[];
    if(pm.length){
      h+='<div class="cd"><div class="st">{{ _('支付方式分布') }}</div><table><tr><th>{{ _('方式') }}</th><th>{{ _('金额') }}</th></tr>';
      pm.forEach(function(p){
        var methodName={'wechat':'{{ _('微信支付') }}','alipay':'{{ _('支付宝') }}','wxpay':'{{ _('微信支付') }}','':'{{ _('其他') }}'}[p.method]||p.method;
        h+='<tr><td>'+methodName+'</td><td>¥'+p.revenue+'</td></tr>';
      });
      h+='</table></div>';
    }

    // {{ _('近12月月度收入') }}
    var monthly=ds.monthly_12m||[];
    if(monthly.length){
      h+='<div class="cd"><div class="st">{{ _('近12月月度收入') }}</div><table><tr><th>{{ _('月份') }}</th><th>{{ _('收入') }}</th></tr>';
      monthly.forEach(function(m){
        h+='<tr><td>'+m.ym+'</td><td>¥'+m.revenue+'</td></tr>';
      });
      h+='</table></div>';
    }

    document.getElementById("mc").innerHTML=h;
  }).catch(function(){document.getElementById("mc").innerHTML='<div class="em">{{ _('加载失败') }}</div>'})
}

window.l_users=function(){
  document.getElementById("pt").textContent="{{ _('用户管理') }}";
  fetch("/admin/users?limit=100",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data)return;
    var ds=d.data;
    var h="<div class=\"cd\"><div class=\"st\">{{ _('用户列表') }} ("+ds.total+")</div><table><tr><th>ID</th><th>{{ _('昵称') }}</th><th>{{ _('手机') }}</th><th>Agent</th><th>{{ _('等级') }}</th><th>{{ _('状态') }}</th><th>{{ _('注册时间') }}</th></tr>";
    ds.users.forEach(function(u){
      var st=u.active?'<span class="bdg on">{{ _('正常') }}</span>':'<span class="bdg off">{{ _('已禁用') }}</span>';
      h+="<tr><td>"+u.id+"</td><td>"+u.nickname+"</td><td>"+(u.phone||"-")+"</td><td>"+(u.agent_nickname||"-")+"</td><td>"+(u.tier||"free")+"</td><td>"+st+"</td><td>"+(u.created_at||"")+"</td></tr>";
    });
    h+="</table></div>";
    document.getElementById("mc").innerHTML=h;
  }).catch(function(){})
}

window.l_agents=function(){
  document.getElementById("pt").textContent="{{ _('Agent 管理') }}";
  fetch("/admin/agents?limit=100",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data)return;
    var ds=d.data;
    var h="<div class=\"cd\"><div class=\"st\">{{ _('Agent 列表') }} ("+ds.total+")</div><table><tr><th>ID</th><th>{{ _('昵称') }}</th><th>{{ _('所属') }}</th><th>{{ _('手机') }}</th><th>{{ _('时间') }}</th></tr>";
    ds.agents.forEach(function(a){h+="<tr><td>"+(a.agent_id||"-")+"</td><td>"+(a.agent_nickname||"-")+"</td><td>"+(a.nickname||"-")+"</td><td>"+(a.phone||"-")+"</td><td>"+(a.created_at||"")+"</td></tr>"});
    h+="</table></div>";
    document.getElementById("mc").innerHTML=h;
  }).catch(function(){})
}

window.l_keys=function(){
  document.getElementById("pt").textContent="{{ _('API Key 管理') }}";
  fetch("/admin/api-keys?limit=100",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success||!d.data)return;
    var ds=d.data;

function loadConfigs(){
  fetch("/user/config",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success){document.getElementById("cl").innerHTML='<div class="em">{{ _('无法加载') }}</div>';return}
    var cats=d.categories||[{id:"other",title:"{{ _('系统配置') }}"}];
    var data=d.data||[];
    var schema=d.schema||{};
    var c="";
    cats.forEach(function(cat){
      var items=data.filter(function(k){return k.category==cat.id});
      if(!items.length)return;
      c+='<div class="cd" style="margin-bottom:12px">';
      c+='<div class="st">'+cat.title+'</div>';
      items.forEach(function(k){
        var isSensitive=k.sensitive;
        var displayVal=k.sensitive?k.masked_value:k.value;
        var safeVal=(k.value||"").replace(/"/g,"&quot;");
        var safeMasked=(k.masked_value||"").replace(/"/g,"&quot;");
        var label=k.label||k.key;
        var ph=k.placeholder||"";
        c+='<div class="fl">';
        c+='<div style="flex:1;min-width:0">';
        c+='<div style="font-size:12px;font-weight:600">'+label+'</div>';
        c+='<div style="font-size:10px;color:var(--dim)">'+(k.description||"")+'</div></div>';
        if(isSensitive){
          c+='<input class="in" id="cf-'+k.key+'" type="password" value="'+safeMasked+'" placeholder="'+ph+'" style="width:180px" onfocus="this.value=\'\'" onblur="if(!this.value)this.value=\''+safeMasked+'\'">';
        }else{
          c+='<input class="in" id="cf-'+k.key+'" value="'+safeVal+'" placeholder="'+ph+'" style="width:200px">';
        }
        c+='<button class="btn bp bs" onclick="scfg(\''+k.key+'\')">{{ _('保存') }}</button></div>';
      });
      c+='</div>';
    });
    document.getElementById("cl").innerHTML=c||'<div class="em">{{ _('暂无配置项，点击「初始化配置项」创建') }}</div>';
  }).catch(function(){document.getElementById("cl").innerHTML='<div class="em">{{ _('加载失败') }}</div>'})
}
function scfg(k){
  var v=document.getElementById("cf-"+k).value.trim();
  if(!v)return;
  fetch("/user/config",{method:"PUT",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({key:k,value:v})}).then(function(r){return r.json()}).then(function(d){
    if(d.success){alert("{{ _('保存成功') }}");loadConfigs()}else{alert(d.error||"{{ _('保存失败') }}")}
  }).catch(function(){alert("{{ _('保存失败') }}")})
}

  var cbs=document.querySelectorAll("#contactsList .contact-cb");
  cbs.forEach(function(cb){cb.checked=checked;toggleContact(cb)});
}
function toggleContact(cb){
  var email=cb.getAttribute("data-email");
  if(cb.checked){if(emSelectedContacts.indexOf(email)<0)emSelectedContacts.push(email)}
  else{emSelectedContacts=emSelectedContacts.filter(function(e){return e!==email})}
}
function selectAllContacts(){
  var cbs=document.querySelectorAll("#contactsList .contact-cb");
  cbs.forEach(function(cb){cb.checked=true;if(emSelectedContacts.indexOf(cb.getAttribute("data-email"))<0)emSelectedContacts.push(cb.getAttribute("data-email"))});
}
function deselectAllContacts(){
  var cbs=document.querySelectorAll("#contactsList .contact-cb");
  cbs.forEach(function(cb){cb.checked=false});
  emSelectedContacts=[];
}
function toggleContacts(){

function sendBulk(){
  if(!emSelectedContacts.length){alert("{{ _('请先选择要发送的联系人') }}");return}
  var count=emSelectedContacts.length;
  var el=document.getElementById("em-to");
  el.value=emSelectedContacts.join(", ");
  parseRecipients();
  se();
  emSelectedContacts=[];
  document.querySelectorAll("#contactsList .contact-cb").forEach(function(cb){cb.checked=false});
  showToast("{{ _('已填入') }} "+count+" {{ _('个收件人，编辑内容后发送') }}","success");
}
function parseRecipients(){
  var el=document.getElementById("em-to");
  var raw=el.value;
  var addrs=raw.split(",").map(function(a){return a.trim()}).filter(function(a){return a.length>0&&a.includes("@")});
  var container=document.getElementById("em-recipients");
  if(!addrs.length){container.innerHTML="";return}
  var h='';
  addrs.forEach(function(a){
    var name='';
    for(var i=0;i<emContacts.length;i++){if(emContacts[i].email.toLowerCase()===a.toLowerCase()){name=emContacts[i].name;break}}
    var label=name||a.split("@")[0];
    h+='<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:rgba(0,212,170,.1);border:1px solid rgba(0,212,170,.3);border-radius:4px;font-size:12px">'+label+' <span style="color:var(--dim);font-size:10px">'+a+'</span></span>';
  });
  container.innerHTML=h;
}
var emAttachments=[];
function addAttach(){
  var files=document.getElementById("em-file").files;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(f.size>10*1024*1024){alert('{{ _('附件') }} '+f.name+' {{ _('超过 10MB 限制') }}');continue}
    var reader=new FileReader();
    reader.onload=function(fn,fsize){return function(e){
      emAttachments.push({filename:fn,data:e.target.result.split(',')[1],content_type:fn.split('.').pop()==='pdf'?'application/pdf':'application/octet-stream',size:fsize});
      renderAttachList();
    }}(f.name,f.size);
    reader.readAsDataURL(f);
  }
  document.getElementById("em-file").value='';
}
function renderAttachList(){
  var el=document.getElementById("em-attach-list");
  if(!emAttachments.length){el.innerHTML='';return}
  var h='';
  emAttachments.forEach(function(a,i){
    var size=(a.size/1024).toFixed(1)+'KB';
    if(a.size>1024*1024)size=(a.size/1024/1024).toFixed(1)+'MB';
    h+='<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:var(--bg);border-radius:4px;font-size:11px">📎 '+a.filename+' ('+size+') <span onclick="removeAttach('+i+')" style="cursor:pointer;color:var(--dim)">✕</span></span>';
  });
  el.innerHTML=h;
}
function removeAttach(i){emAttachments.splice(i,1);renderAttachList()}
