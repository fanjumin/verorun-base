// ── 收入看板 ──
window.l_revenue=function(){
  document.getElementById("pt").textContent="收入看板";
  fetch("/admin/revenue/dashboard",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var ds=d.data;
    var h="";

    // Summary cards
    h+='<div class="gr">';
    h+=hk('今日收入','¥'+ds.summary.today_revenue,'g');
    h+=hk('本月收入','¥'+ds.summary.this_month,'b');
    h+=hk('上月收入','¥'+ds.summary.last_month,'');
    h+=hk('环比',(ds.summary.month_change>=0?'+':'')+ds.summary.month_change_pct+'%',ds.summary.month_change>=0?'g':'r');
    h+=hk('MRR','¥'+(ds.subscriptions.mrr||0),'g');
    h+=hk('活跃订阅',ds.subscriptions.active||0,'b');
    h+=hk('付费用户',ds.subscriptions.total_paid_users||0,'');
    var churnCls=(ds.subscriptions.churn_rate||0)>5?'r':'g';
    h+=hk('本月流失率',(ds.subscriptions.churn_rate||0)+'%',churnCls);
    h+=hk('上月流失率',(ds.subscriptions.last_churn_rate||0)+'%','');
    h+=hk('本月新增',ds.subscriptions.new_this_month||0,'g');
    h+=hk('本月取消',ds.subscriptions.canceled_this_month||0,'r');
    h+=hk('本月过期',ds.subscriptions.expired_this_month||0,'');
    h+=hk('本年度','¥'+ds.summary.this_year,'b');
    h+='</div>';

    // Chart: 30-day active subscription trend
    var subTrend=ds.subscriptions.active_trend_30d||[];
    if(subTrend.length){
      var maxAct=0;
      subTrend.forEach(function(t){if(t.active_count>maxAct)maxAct=t.active_count});
      maxAct=maxAct||1;
      var subH='<div class="cd"><div class="st">近30天活跃订阅数</div><div style="display:flex;align-items:flex-end;gap:2px;height:100px;padding-top:10px">';
      subTrend.forEach(function(t){
        var pct=Math.max(3,t.active_count/maxAct*100);
        var dayLabel=t.day.slice(5);
        var color='background:var(--accent)';
        subH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100px;justify-content:flex-end">';
        subH+='<div style="width:100%;'+color+';height:'+pct+'%;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s" title="'+t.day+': '+t.active_count+'"></div>';
        subH+='<div style="font-size:7px;color:var(--dim);margin-top:2px;transform:rotate(-45deg);white-space:nowrap">'+dayLabel+'</div>';
        subH+='</div>';
      });
      subH+='</div></div>';
      h+=subH;
    }

    // Chart: 12-month churn rate trend
    var churnTrend=ds.subscriptions.churn_trend_12m||[];
    if(churnTrend.length){
      var maxChurn=0;
      churnTrend.forEach(function(t){if(t.churn_rate>maxChurn)maxChurn=t.churn_rate});
      maxChurn=maxChurn||1;
      var churnH='<div class="cd"><div class="st">月度流失率趋势（近12月）</div><div style="display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:10px">';
      churnTrend.forEach(function(t){
        var pct=Math.max(3,t.churn_rate/maxChurn*100);
        var color=t.churn_rate>10?'#f85149':t.churn_rate>5?'#f0c040':'var(--accent3)';
        churnH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:120px;justify-content:flex-end">';
        churnH+='<div style="font-size:8px;color:var(--dim);margin-bottom:2px">'+(t.churn_rate||'0')+'%</div>';
        churnH+='<div style="width:100%;background:'+color+';height:'+pct+'%;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s" title="'+t.ym+': '+t.churn_rate+'%"></div>';
        churnH+='<div style="font-size:8px;color:var(--dim);margin-top:2px">'+(t.ym||'').slice(5)+'</div>';
        churnH+='</div>';
      });
      churnH+='</div></div>';
      h+=churnH;
    }

    // Chart: 30-day revenue trend (simple CSS bars)
    var trend=ds.trend_30d||[];
    if(trend.length){
      var maxRev=0;
      trend.forEach(function(t){if(t.revenue>maxRev)maxRev=t.revenue});
      maxRev=maxRev||1;
      var barH='<div class="cd"><div class="st">近30天收入趋势</div><div style="display:flex;align-items:flex-end;gap:2px;height:140px;padding-top:10px">';
      trend.forEach(function(t){
        var pct=Math.max(3,t.revenue/maxRev*100);
        var dayLabel=t.day.slice(5);
        var color=t.revenue>0?'background:var(--accent)':'background:var(--border)';
        barH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:140px;justify-content:flex-end">';
        barH+='<div style="width:100%;'+color+';height:'+pct+'%;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s" title="'+t.day+': ¥'+t.revenue+'"></div>';
        barH+='<div style="font-size:7px;color:var(--dim);margin-top:2px;transform:rotate(-45deg);white-space:nowrap">'+dayLabel+'</div>';
        barH+='</div>';
      });
      barH+='</div></div>';
      h+=barH;
    }

    // Revenue by type
    var byType=ds.by_type||[];
    if(byType.length){
      h+='<div class="cd"><div class="st">收入类型分布</div><table><tr><th>类型</th><th>金额</th><th>占比</th></tr>';
      var totalType=0;
      byType.forEach(function(t){totalType+=t.revenue});
      totalType=totalType||1;
      byType.forEach(function(t){
        var pct=(t.revenue/totalType*100).toFixed(1);
        h+='<tr><td>'+t.type+'</td><td>¥'+t.revenue+'</td><td><div style="display:flex;align-items:center;gap:6px"><div style="background:var(--accent);width:'+pct+'px;max-width:100px;height:8px;border-radius:4px"></div>'+pct+'%</div></td></tr>';
      });
      h+='</table></div>';
    }

    // Payment methods
    var pm=ds.pay_methods||[];
    if(pm.length){
      h+='<div class="cd"><div class="st">支付方式分布</div><table><tr><th>方式</th><th>金额</th></tr>';
      pm.forEach(function(p){
        var methodName={'wechat':'微信支付','alipay':'支付宝','wxpay':'微信支付','':'其他'}[p.method]||p.method;
        h+='<tr><td>'+methodName+'</td><td>¥'+p.revenue+'</td></tr>';
      });
      h+='</table></div>';
    }

    // Monthly trend
    var monthly=ds.monthly_12m||[];
    if(monthly.length){
      h+='<div class="cd"><div class="st">近12月月度收入</div><table><tr><th>月份</th><th>收入</th></tr>';
      monthly.forEach(function(m){
        h+='<tr><td>'+m.ym+'</td><td>¥'+m.revenue+'</td></tr>';
      });
      h+='</table></div>';
    }

    document.getElementById("mc").innerHTML=h;
  }).catch(function(){document.getElementById("mc").innerHTML='<div class="em">加载失败</div>'})
}

function dlEdit(id){
  fetch("/admin/downloads",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var dl=d.data.find(function(x){return x.id===id});
    if(!dl)return;
    document.getElementById("dlForm").style.display="block";
    document.getElementById("dlFormTitle").textContent="编辑 — "+dl.name;
    document.getElementById("dlEditId").value=dl.id;
    document.getElementById("dlName").value=dl.name||"";
    document.getElementById("dlSlug").value=dl.slug||"";
    document.getElementById("dlTagline").value=dl.tagline||"";
    document.getElementById("dlCat").value=dl.category||"skills";
    document.getElementById("dlVer").value=dl.version||"1.0.0";
    document.getElementById("dlUrl").value=dl.download_url||"";
    document.getElementById("dlRepo").value=dl.repo_url||"";
    document.getElementById("dlSize").value=dl.file_size||"";
    document.getElementById("dlTags").value=(dl.tags||[]).join(", ");
    document.getElementById("dlIcon").value=dl.icon||"📦";
    document.getElementById("dlSort").value=dl.sort_order||0;
    document.getElementById("dlPub").checked=dl.is_published===1;
  })
}
function dlDel(id){
  if(!confirm("确定删除此下载项？"))return;
  fetch("/admin/downloads/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(d.success){l_downloads();showToast("已删除","success")}
    else{alert(d.error||"删除失败")}
  }).catch(function(){alert("删除失败")})
}
