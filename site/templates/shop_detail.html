<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title id="pageTitle">{{ _('Product Details') }} — {{ brand.site_name_cn if brand else '' }}</title>
<link href="{{ brand.favicon_url if brand and brand.favicon_url else '/static/favicon-32x32.png' }}" rel="icon" sizes="32x32" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="/static/css/design-system.css" rel="stylesheet"/>
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font-cn)}
.detail-wrap{max-width:1100px;margin:0 auto;padding:120px 24px 60px}
.detail-card{background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:768px){.detail-grid{grid-template-columns:1fr}}
.detail-thumb{min-height:320px;background:var(--bg-elevated);border-right:1px solid var(--border);position:relative}
.detail-thumb .main-img{width:100%;height:400px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.detail-thumb .main-img img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;transition:transform .3s}
.detail-thumb .main-img img:hover{transform:scale(1.05)}
.thumb-strip{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-top:1px solid var(--border);background:var(--bg)}
.thumb-strip .t-item{width:48px;height:48px;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:border-color .2s}
.thumb-strip .t-item.active{border-color:var(--accent)}
.thumb-strip .t-item img{width:100%;height:100%;object-fit:cover}
.maximize-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg-glass);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;z-index:2}
.maximize-btn:hover{background:var(--bg-elevated)}
.spec-section{margin-bottom:20px}
.spec-section .spec-label{font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px}
.spec-section .spec-options{display:flex;flex-wrap:wrap;gap:6px}
.spec-option{padding:6px 14px;border-radius:8px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--bg);transition:all .15s}
.spec-option:hover{border-color:var(--accent);color:var(--accent)}
.spec-option.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.detail-info{padding:32px}
.detail-info .title{font-size:24px;font-weight:800;color:var(--text-high);margin-bottom:4px}
.detail-info .subtitle{font-size:14px;color:var(--text-dim);margin-bottom:16px}
.detail-info .price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:20px}
.detail-info .price{font-size:36px;font-weight:800;color:var(--accent);font-family:var(--font-display)}
.detail-info .orig-price{font-size:16px;color:var(--text-muted);text-decoration:line-through}
.detail-info .badges{display:flex;gap:8px;margin-bottom:20px}
.detail-info .badge{padding:4px 12px;border-radius:12px;font-size:11px;background:rgba(99,102,241,.12);color:var(--indigo)}
.detail-info .badge.stock{background:rgba(0,255,159,.1);color:var(--accent3)}
.detail-info .badge.sales{background:rgba(255,255,255,.04);color:var(--dim)}
.detail-info .actions{display:flex;gap:10px;margin-bottom:24px}
.detail-info .actions .btn{padding:12px 28px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-cn);transition:all .2s}
.btn-primary{background:var(--indigo);color:#fff}
.btn-primary:hover{box-shadow:0 4px 16px rgba(99,102,241,.3)}
.btn-cart{background:var(--bg-glass);border:1px solid var(--border)!important;color:var(--text)}
.btn-cart:hover{border-color:var(--accent)!important}
.feature-list{list-style:none;padding:0;margin:0 0 24px}
.feature-list li{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;color:var(--text-dim);border-bottom:1px solid rgba(255,255,255,.03)}
.feature-list li .check{color:var(--accent3);font-size:16px}
.detail-desc{padding:24px 32px;border-top:1px solid var(--border);font-size:13px;line-height:1.8;color:var(--text-dim)}
.loading-spinner{text-align:center;padding:120px;color:var(--dim)}
.error-state{text-align:center;padding:120px;color:var(--dim)}
.error-state .icon{font-size:48px;margin-bottom:12px}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;max-width:320px;animation:slideIn .3s;transition:opacity .3s}
.toast.success{background:rgba(0,255,159,.15);border:1px solid var(--accent3);color:var(--accent3)}
.toast.error{background:rgba(248,81,73,.15);border:1px solid #f85149;color:#f85149}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}}
</style>
</head>
<body>
<div id="particles-bg"></div>
{% include '_header.html' ignore missing %}
{% if preview %}
<div style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#f0f8ff;border-bottom:2px solid #99c;text-align:center;padding:6px 16px;font-size:13px;color:#446">{{ _('🔍 Preview — Admin Only ·') }}<a href="/shop/{{ pid }}" style="color:#66e">{{ _('View Live Page →') }}</a>
</div>
{% endif %}
<div __block_10__="" __block_11__="" class="detail-wrap" style="padding-top:70px">
<div class="loading-spinner" id="detailContent"><div class="s"></div></div>
</div>

<script>
var T = '{{ token or "" }}';
if(!T){T=localStorage.getItem('sso_token')||localStorage.getItem('tm_token')||localStorage.getItem('token')||''}
var BRAND_NAME = '{{ brand.site_name_cn if brand else "" }}';
var PREVIEW = {{ 'true' if preview else 'false' }};
var pid = parseInt(location.pathname.split('/').pop());

function loadDetail(){
  var url = PREVIEW ? '/shop/api/admin/preview/'+pid : '/shop/api/products/'+pid;
  fetch(url,{headers:T?{"Authorization":"Bearer "+T}:{}}).then(function(r){
    if(r.status===404){document.getElementById("detailContent").innerHTML='<div class="error-state"><div class="icon">🔍</div><div>{{ _('Product not found or unavailable') }}</div><a href="/shop" style="color:var(--accent);margin-top:12px;display:inline-block">{{ _('← Return to Store') }}</a></div>';return Promise.reject()}
    return r.json()
  }).then(function(d){
    if(!d.success)return;var p=d.data;
    document.getElementById("pageTitle").textContent=p.title+' — '+(window.BRAND_NAME||'');
    document.getElementById("detailContent").innerHTML=renderDetail(p);
  }).catch(function(){});
}

function renderDetail(p){
  var types={"vip":{{ _('VIP plan') | tojson }},"template":{{ _('Template') | tojson }},"token":{{ _('Data Package') | tojson }},"service":{{ _('Service') | tojson }},"plugin":{{ _('Plugin') | tojson }},"cloud_service":{{ _('☁️ Cloud service') | tojson }}};
  var cfg=(p.product_config&&typeof p.product_config==='object')?p.product_config:{};
  var specs=(cfg.specs)||{};
  var isCloud=p.product_type==='cloud_service';
  var h='<div class="detail-card"><div class="detail-grid"><div class="detail-thumb">';
  // 图片: 从images数组取, 无则用thumbnail, 再无用占位
  var imgs=[];
  if(p.images&&Array.isArray(p.images)&&p.images.length>0){
    p.images.forEach(function(img){if(typeof img==='object')imgs.push(img.url||'');else imgs.push(img);});
  }else if(p.thumbnail){imgs.push(p.thumbnail);}
  if(!imgs.length)imgs.push('');
  // 主图
  h+='<div class="main-img">';
  h+='<img id="mainDetailImg" src="'+esc(imgs[0]||'/static/img/placeholder.svg')+'" alt="'+esc(p.title)+'" onclick="window.open(this.src,\'_blank\')">';
  h+='<div class="maximize-btn" onclick="window.open(document.getElementById(\'mainDetailImg\').src,\'_blank\')">🔍</div>';
  h+='</div>';
  if(imgs.length>1){
    h+='<div class="thumb-strip" id="thumbStrip">';
    imgs.forEach(function(url,i){
      h+='<div class="t-item'+(i===0?' active':'')+'" onclick="switchDetailImg('+i+',\''+esc(url)+'\')"><img src="'+esc(url)+'" onerror="this.parentElement.style.display=\'none\'"></div>';
    });
    h+='</div>';
  }
  h+='</div><div class="detail-info"><div class="title">'+esc(p.title)+'</div>';
  if(p.subtitle) h+='<div class="subtitle">'+esc(p.subtitle)+'</div>';
  h+='<div class="price-row"><span class="price" id="detailPrice">¥'+p.price+'</span>';
  if(p.original_price>p.price) h+='<span class="orig-price" id="detailOrigPrice">¥'+p.original_price+'</span>';
  h+='</div><div class="badges"><span class="badge">'+(types[p.product_type]||p.product_type)+'</span>';
  if(isCloud&&specs.cpu) h+='<span class="badge stock">{{ _('⚡{specs.cpu} core {specs.memory_gb}G') }}</span>';
  h+='<span class="badge sales">'+(isCloud?{{ _('Monthly payment') | tojson }}:{{ _('Sold ') | tojson }}+(p.sales_count||0))+'</span></div>';
  // 云服务规格展示
  if(isCloud&&specs.cpu){
    h+={{ _('<div class="spec-section"><div class="spec-label">☁️ Configuration Specifications</div>') | tojson }};
    h+='<div class="spec-options" style="margin-bottom:16px">';
    h+='<span class="spec-option active">{{ _('CPU: '+specs.cpu+' cores') }}</span>';
    h+={{ _('<span class="spec-option active">Memory: ') | tojson }}+(specs.memory_gb||'')+'G</span>';
    h+={{ _('<span class="spec-option active">Disk: ') | tojson }}+(specs.disk_gb||'')+'G</span>';
    h+='<span class="spec-option active">'+(cfg.service_type||'VPS')+'</span>';
    h+='</div></div>';
  }
  // 规格选择器
  if(p._specs&&p._specs.length){
    h+='<div id="specSelector">';
    p._specs.forEach(function(spec){
      h+='<div class="spec-section"><div class="spec-label">'+esc(spec.spec_name)+'</div><div class="spec-options">';
      (spec.values||[]).forEach(function(v){
        h+='<div class="spec-option" data-spec="'+spec.id+'" data-val="'+v.id+'" data-label="'+esc(v.spec_value)+'" onclick="selectSpecOption(this)">'+esc(v.spec_value)+'</div>';
      });
      h+='</div></div>';
    });
    h+='</div>';
  }
  // Features
  var fs=p.features;if(typeof fs==="string")try{fs=JSON.parse(fs)}catch(e){fs=[]}
  if(fs&&fs.length){h+='<ul class="feature-list">';fs.forEach(function(f){h+='<li><span class="check">✓</span> '+esc(f)+'</li>'});h+='</ul>'}
  // Actions
  if(isCloud){
    h+='<div class="actions"><button class="btn btn-primary" onclick="buyCloud('+p.id+')">{{ _('☁️ Activate now') }}</button>';
    h+='<button class="btn btn-cart" onclick="showToast(\'云服务商品需管理员确认开通\',\'info\')">{{ _('Add to Cart') }}</button></div>';
  }else{
    h+='<div class="actions"><button class="btn btn-primary" onclick="buyNow('+p.id+')">{{ _('Buy Now') }}</button>';
    h+='<button class="btn btn-cart" onclick="addToCart('+p.id+')">{{ _('Add to Cart') }}</button></div>';
  }
  // 富文本描述
  if(p.description){
    var desc=p.description;
    // 去掉Quill的data-*属性
    h+='<div class="detail-desc" style="font-size:14px;line-height:2">'+desc+'</div>';
  }
  h+='</div>';
  // 异步加载规格SKU数据
  if(p.id) loadSpecsForDetail(p.id);
  return h;
}

var _detailSpecs=[], _detailSkus=[], _detailSelected={};
function loadSpecsForDetail(pid){
  fetch("/shop/api/products/"+pid+"/skus",{headers:T?{"Authorization":"Bearer "+T}:{}})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success)_detailSkus=d.data||[];
    });
  // 也加载规格定义用于显示
  // (不需要额外的API, 规格数据在产品API里已经有了)
}

function switchDetailImg(idx,url){
  document.getElementById("mainDetailImg").src=url;
  var items=document.querySelectorAll("#thumbStrip .t-item");
  items.forEach(function(el,i){el.classList.toggle("active",i===idx);});
}

function selectSpecOption(el){
  var parent=el.parentElement;
  parent.querySelectorAll('.spec-option').forEach(function(o){o.classList.remove('active');});
  el.classList.add('active');
  // 更新选中状态
  var specId=el.dataset.spec;
  var valLabel=el.dataset.label;
  _detailSelected[specId]=valLabel;
  // 匹配SKU
  matchDetailSku();
}

function matchDetailSku(){
  if(!_detailSkus.length)return;
  var vals=Object.values(_detailSelected).sort().join('/');
  var matched=null;
  _detailSkus.forEach(function(sk){
    try{var sp=JSON.parse(sk.spec_path);var sv=Object.values(sp).sort().join('/');if(sv===vals)matched=sk;}catch(e){}
  });
  if(matched){
    document.getElementById("detailPrice").textContent='¥'+matched.price;
    document.getElementById("detailStock").textContent={{ _('Inventory') | tojson }}+matched.stock;
  }
}

function showToast(msg,type){
  var el=document.createElement("div");el.className="toast "+type;el.textContent=msg;
  document.body.appendChild(el);setTimeout(function(){el.style.opacity="0";setTimeout(function(){el.remove()},300)},2500);
}

function addToCart(id){
  if(!T){showToast("请先登录","error");setTimeout(function(){location.href="/login?redirect="+encodeURIComponent(location.pathname)},500);return}
  var skuId=getSelectedSkuId();
  fetch("/shop/api/cart/add",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({product_id:id,quantity:1,sku_id:skuId})})
    .then(function(r){return r.json()}).then(function(d){
      showToast(d.success?{{ _('✅ Added to cart') | tojson }}:(d.error||{{ _('Failed"') | tojson }}),d.success?"success":"error");
    });
}

function buyNow(id){
  if(!T){showToast("请先登录","error");setTimeout(function(){location.href="/login?redirect="+encodeURIComponent(location.pathname)},500);return}
  var skuId=getSelectedSkuId();
  var btn=document.querySelector('.btn-primary');if(btn){btn.disabled=true;btn.textContent={{ _('Create Order...') | tojson }}}
  fetch("/shop/api/checkout",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({items:[{product_id:id,quantity:1,price:0,title:"",sku_id:skuId}]})})
    .then(function(r){
      if(!r.ok){return r.json().then(function(e){throw new Error(e.error||'请求失败')});}
      return r.json();
    })
    .then(function(d){
      if(!d.success){throw new Error(d.error||{{ _('Order failed') | tojson }});}
      showToast({{ _('✅ Order Created, Go to Pay...') | tojson }},"success");
      var oid=d.data.order_id;
      location.href="/shop/pay/"+oid;
    })
    .catch(function(err){
      showToast(err.message||{{ _('Order failed') | tojson }},"error");
      if(btn){btn.disabled=false;btn.textContent={{ _('Buy Now') | tojson }}}
    });
}

function buyCloud(id){
  if(!T){showToast("请先登录","error");return}
  fetch("/shop/api/checkout",{method:"POST",headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify({items:[{product_id:id,quantity:1}]})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){
        showToast("✅ 开通请求已提交，管理员确认后自动开通","success");
        setTimeout(function(){location.href="/shop/cloud"},1000);
      }else showToast(d.error||{{ _('Activation failed') | tojson }},"error");
    });
}

function getSelectedSkuId(){
  var sel=document.querySelectorAll('#specSelector .spec-option.active');
  if(sel.length>0){
    // 查找匹配的SKU
    var vals=[];
    sel.forEach(function(el){vals.push(el.dataset.label);});
    var key=vals.sort().join('/');
    for(var i=0;i<_detailSkus.length;i++){
      try{var sp=JSON.parse(_detailSkus[i].spec_path);var sv=Object.values(sp).sort().join('/');if(sv===key)return _detailSkus[i].id;}catch(e){}
    }
  }
  return 0;
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// tsParticles
if(typeof tsParticles!=='undefined'){
  tsParticles.load('particles-bg',{
    fullScreen:{enable:false,zIndex:0},fpsLimit:40,
    particles:{number:{value:40,density:{enable:true,area:800}},
    color:{value:['#00f5ff','#a020f0','#6366f1','#00ff9f']},
    shape:{type:'circle'},opacity:{value:.2,random:true},
    size:{value:{min:1,max:3},random:true},
    links:{enable:true,distance:150,color:'#6366f1',opacity:.08,width:1},
    move:{enable:true,speed:.5,direction:'none',random:true,outModes:{default:'bounce'}}},
    background:{color:'transparent'}
  });
}
loadDetail();
</script>
</body>
</html>
