window.l_revenue=function(){
  document.getElementById("pt").textContent={{ _('Income dashboard') | tojson }};
  fetch("/admin/revenue/dashboard",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var ds=d.data;

    // Summary cards
    h+='<div class="gr">';
    h+=hk({{ _('Today's income') | tojson }},'¥'+ds.summary.today_revenue,'g');

    h+=hk({{ _('Paid User') | tojson }},ds.subscriptions.total_paid_users||0,'');
    var churnCls=(ds.subscriptions.churn_rate||0)>5?'r':'g';
    h+=hk({{ _('Monthly churn rate') | tojson }},(ds.subscriptions.churn_rate||0)+'%',churnCls);
    h+=hk({{ _('Last month's churn rate') | tojson }},(ds.subscriptions.last_churn_rate||0)+'%','');

    h+=hk({{ _('Cancelled this month') | tojson }},ds.subscriptions.canceled_this_month||0,'r');

    h+='</div>';

    // Chart: 30-day active subscription trend
    var subTrend=ds.subscriptions.active_trend_30d||[];

      var maxAct=0;
      subTrend.forEach(function(t){if(t.active_count>maxAct)maxAct=t.active_count});
      maxAct=maxAct||1;
      var subH='<div class="cd"><div class="st">{{ _('Active Subscriptions in Last 30 Days') }}</div><div style="display:flex;align-items:flex-end;gap:2px;height:100px;padding-top:10px">';
      subTrend.forEach(function(t){
        var pct=Math.max(3,t.active_count/maxAct*100);
        var dayLabel=t.day.slice(5);
        var color='background:var(--accent)';
        subH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100px;justify-content:flex-end">';

        subH+='</div>';
      });
      subH+='</div></div>';
      h+=subH;
    }

    // Chart: 12-month churn rate trend
    var churnTrend=ds.subscriptions.churn_trend_12m||[];
    if(churnTrend.length){
      var maxChurn=0;
      churnTrend.forEach(function(t){if(t.churn_rate>maxChurn)maxChurn=t.churn_rate});
      maxChurn=maxChurn||1;
      var churnH='<div class="cd"><div class="st">{{ _('Monthly churn rate trend (last 12 months)') }}</div><div style="display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:10px">';
      churnTrend.forEach(function(t){
        var pct=Math.max(3,t.churn_rate/maxChurn*100);
        var color=t.churn_rate>10?'#f85149':t.churn_rate>5?'#f0c040':'var(--accent3)';
        churnH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:120px;justify-content:flex-end">';

        churnH+='<div style="width:100%;background:'+color+';height:'+pct+'%;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s" title="'+t.ym+': '+t.churn_rate+'%"></div>';
        churnH+='<div style="font-size:8px;color:var(--dim);margin-top:2px">'+(t.ym||'').slice(5)+'</div>';
        churnH+='</div>';
      });
      churnH+='</div></div>';
      h+=churnH;
    }

    // Chart: 30-day revenue trend (simple CSS bars)

      trend.forEach(function(t){
        var pct=Math.max(3,t.revenue/maxRev*100);
        var dayLabel=t.day.slice(5);
        var color=t.revenue>0?'background:var(--accent)':'background:var(--border)';
        barH+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:140px;justify-content:flex-end">';
        barH+='<div style="width:100%;'+color+';height:'+pct+'%;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s" title="'+t.day+': ¥'+t.revenue+'"></div>';
        barH+='<div style="font-size:7px;color:var(--dim);margin-top:2px;transform:rotate(-45deg);white-space:nowrap">'+dayLabel+'</div>';

    // Revenue by type

      h+='<div class="cd"><div class="st">{{ _('Income type distribution') }}</div><table><tr><th>{{ _('Type') }}</th><th>{{ _('Amount') }}</th><th>{{ _('Proportion') }}</th></tr>';
      var totalType=0;

      byType.forEach(function(t){
        var pct=(t.revenue/totalType*100).toFixed(1);
        h+='<tr><td>'+t.type+'</td><td>¥'+t.revenue+'</td><td><div style="display:flex;align-items:center;gap:6px"><div style="background:var(--accent);width:'+pct+'px;max-width:100px;height:8px;border-radius:4px"></div>'+pct+'%</div></td></tr>';

        h+='<tr><td>'+m.ym+'</td><td>¥'+m.revenue+'</td></tr>';
      });
      h+='</table></div>';
    }

    document.getElementById("mc").innerHTML=h;
  }).catch(function(){document.getElementById("mc").innerHTML='<div class="em">{{ _('Loading Failed') }}</div>'})
}

    h+='<div class="cd"><div class="st">下载项列表 ('+d.data.length+{{ _(')</div><table><tr><th>ID</th><th>Name</th><th>Category</th><th>Version</th><th>Status</th><th>Download</th><th>Action</th></tr>') | tojson }};
    d.data.forEach(function(dl){
      var st=dl.is_published?{{ _('<span class="bdg on">Published</span>') | tojson }}:{{ _('<span class="bdg off">Hidden</span>') | tojson }};
      h+='<tr><td>'+dl.id+'</td><td>'+(dl.name||'-')+'</td><td>'+dl.category+'</td><td>'+dl.version+'</td><td>'+st+'</td><td>'+dl.download_count+'</td><td>';
      h+='<button class="btn bo bs" onclick="dlEdit('+dl.id+{{ _(')">Edit</button> ') | tojson }};
      h+='<button class="btn bo bs" onclick="dlDel('+dl.id+')">{{ _('Delete') }}</button></td></tr>';
    });
    h+='</table></div>';
    document.getElementById("mc").innerHTML=h;
  }).catch(function(){})
};
function dlForm(){document.getElementById("dlForm").style.display="block";document.getElementById("dlFormTitle").textContent={{ _('Add Download Item') | tojson }};document.getElementById("dlEditId").value="";document.getElementById("dlName").value="";document.getElementById("dlSlug").value="";document.getElementById("dlTagline").value="";document.getElementById("dlVer").value="1.0.0";document.getElementById("dlUrl").value="";document.getElementById("dlRepo").value="";document.getElementById("dlSize").value="";document.getElementById("dlTags").value="";document.getElementById("dlIcon").value="📦";document.getElementById("dlSort").value="0";document.getElementById("dlPub").checked=true}
function dlFormHide(){document.getElementById("dlForm").style.display="none"}
function dlSave(){
  var id=document.getElementById("dlEditId").value;
  var body={
    name:document.getElementById("dlName").value,
    slug:document.getElementById("dlSlug").value,
    tagline:document.getElementById("dlTagline").value,
    category:document.getElementById("dlCat").value,
    version:document.getElementById("dlVer").value,
    download_url:document.getElementById("dlUrl").value,
    repo_url:document.getElementById("dlRepo").value,
    file_size:document.getElementById("dlSize").value,
    tags:document.getElementById("dlTags").value.split(",").map(function(s){return s.trim()}).filter(function(s){return s}),
    icon:document.getElementById("dlIcon").value||"📦",
    sort_order:parseInt(document.getElementById("dlSort").value)||0,
    is_published:document.getElementById("dlPub").checked?1:0
  };
  var url="/admin/downloads";
  var method="POST";
  if(id){url+="/"+id;method="PUT";body.id=parseInt(id)}
  fetch(url,{method:method,headers:{"Authorization":"Bearer "+T,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
    if(d.success){dlFormHide();l_downloads();showToast({{ _('Save successful') | tojson }},"success")}
    else{alert(d.error||{{ _('Save failed') | tojson }})}
  }).catch(function(){alert({{ _('Save failed') | tojson }})})
}
function dlEdit(id){
  fetch("/admin/downloads",{headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(!d.success)return;
    var dl=d.data.find(function(x){return x.id===id});
    if(!dl)return;
    document.getElementById("dlForm").style.display="block";
    document.getElementById("dlFormTitle").textContent={{ _('Edit — ') | tojson }}+dl.name;
    document.getElementById("dlEditId").value=dl.id;
    document.getElementById("dlName").value=dl.name||"";
    document.getElementById("dlSlug").value=dl.slug||"";
    document.getElementById("dlTagline").value=dl.tagline||"";
    document.getElementById("dlCat").value=dl.category||"skills";
    document.getElementById("dlVer").value=dl.version||"1.0.0";
    document.getElementById("dlUrl").value=dl.download_url||"";
    document.getElementById("dlRepo").value=dl.repo_url||"";
    document.getElementById("dlSize").value=dl.file_size||"";
    document.getElementById("dlTags").value=(dl.tags||[]).join(", ");
    document.getElementById("dlIcon").value=dl.icon||"📦";
    document.getElementById("dlSort").value=dl.sort_order||0;
    document.getElementById("dlPub").checked=dl.is_published===1;
  })
}
function dlDel(id){
  if(!confirm({{ _('Confirm to delete this download item?') | tojson }}))return;
  fetch("/admin/downloads/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){
    if(d.success){l_downloads();showToast({{ _('Deleted') | tojson }},"success")}
    else{alert(d.error||{{ _('Deletion Failed') | tojson }})}
  }).catch(function(){alert({{ _('Deletion Failed') | tojson }})})
}
