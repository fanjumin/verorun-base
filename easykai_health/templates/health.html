<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ _('Health Check') }} — {{ _('系统健康巡检') }}</title>
<style>
:root {
  --bg: #0a0a14;
  --card: #12121f;
  --card2: #191928;
  --border: #1e1e35;
  --text: #e2e2f0;
  --dim: #707090;
  --accent: #6c6cf0;
  --green: #34d399;
  --yellow: #fbbf24;
  --red: #f85149;
  --blue: #60a5fa;
  --glass: rgba(18,18,31,0.85);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:13px;
  line-height:1.5;
  padding:0;
  min-height:100vh;
}
.container{padding:0}

/* ── Header ── */
.header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.header h1 span{background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{
  display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;
  background:rgba(108,108,240,0.15);color:var(--accent);border:1px solid rgba(108,108,240,0.3)
}
.actions{display:flex;gap:8px}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:8px;font-size:12px;
  font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text);
  transition:all .2s
}
.btn:hover{background:var(--border);border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.15)}
.btn-danger{background:rgba(248,81,73,0.15);color:var(--red);border-color:rgba(248,81,73,0.3)}
.btn-danger:hover{background:rgba(248,81,73,0.25)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center}

/* ── Stats Cards ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;overflow:hidden
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.passed::before{background:var(--green)}
.stat-card.warning::before{background:var(--yellow)}
.stat-card.error::before{background:var(--red)}
.stat-card .label{font-size:11px;color:var(--dim);margin-bottom:4px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .value.green{color:var(--green)}
.stat-card .value.yellow{color:var(--yellow)}
.stat-card .value.red{color:var(--red)}
.stat-card .sub{font-size:11px;color:var(--dim);margin-top:4px}

/* ── Glass Card ── */
.glass-card{
  background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:16px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-bottom:16px
}
.glass-card .ct{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.glass-card .ct .more{color:var(--accent);cursor:pointer;font-weight:400;font-size:11px}
.glass-card .ct .more:hover{text-decoration:underline}

/* ── Tables ── */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid rgba(30,30,53,0.5);font-size:12px}
tr:hover td{background:rgba(108,108,240,0.04)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.green{background:var(--green);box-shadow:0 0 6px rgba(52,211,153,0.4)}
.status-dot.yellow{background:var(--yellow);box-shadow:0 0 6px rgba(251,191,36,0.4)}
.status-dot.red{background:var(--red);box-shadow:0 0 6px rgba(248,81,73,0.4)}

/* ── Category Section ── */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cat-card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;
  transition:border-color .2s
}
.cat-card:hover{border-color:var(--accent)}
.cat-card .cat-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cat-card .cat-h .cat-name{font-size:12px;font-weight:600}
.cat-card .cat-h .cat-count{font-size:10px;color:var(--dim)}
.cat-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(30,30,53,0.3);font-size:11px}
.cat-item:last-child{border-bottom:none}
.cat-item .ci-left{display:flex;align-items:center;gap:6px}
.cat-item .ci-right{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}

/* ── Trend Chart ── */
.trend-chart{display:flex;align-items:flex-end;gap:4px;height:80px;padding:8px 0}
.trend-bar{
  flex:1;border-radius:3px 3px 0 0;min-height:4px;position:relative;transition:height .5s ease;
  cursor:pointer
}
.trend-bar:hover{opacity:.8}
.trend-bar .tooltip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;
  font-size:10px;white-space:nowrap;z-index:10;margin-bottom:4px}
.trend-bar:hover .tooltip{display:block}
.trend-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);margin-top:4px}

/* ── History Table ── */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar .filter-btn{padding:4px 12px;border-radius:6px;font-size:11px;cursor:pointer;
  border:1px solid var(--border);background:var(--card2);color:var(--dim);transition:all .2s}
.filter-bar .filter-btn.active{background:rgba(108,108,240,0.15);color:var(--accent);border-color:var(--accent)}
.filter-bar .filter-btn:hover{color:var(--text)}

/* ── Detail Modal ── */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.6);z-index:100;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  justify-content:center;align-items:center
}
.modal-overlay.show{display:flex}
.modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;
  max-width:700px;width:90%;max-height:80vh;overflow-y:auto
}
.modal-box h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal-box pre{background:var(--card2);padding:12px;border-radius:8px;font-size:11px;overflow-x:auto;color:var(--dim);margin-top:8px}

/* ── Loading ── */
.lo{display:flex;justify-content:center;align-items:center;padding:40px}
.s{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Refresh timer ── */
.refresh-info{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px}

/* ── Tabs ── */
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--dim);transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Config Panel ── */
.config-toggle{font-size:11px;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:8px}
.config-toggle:hover{text-decoration:underline}
.config-panel{display:none;margin-top:8px;padding:10px;background:var(--card2);border-radius:8px}
.config-panel.show{display:block}
.config-panel label{font-size:11px;color:var(--dim);display:block;margin-bottom:4px}
.config-panel input[type="checkbox"]{margin-right:4px}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>🔍 <span>{{ _('Health Check') }}</span> <span class="badge">Health Check</span></h1>
    <div class="actions">
      <button class="btn btn-primary" onclick="runCheck()">⚡ {{ _('立即巡检') }}</button>
      <button class="btn" onclick="exportReport()">📥 {{ _('导出报告') }}</button>
      <button class="btn btn-danger" id="alertBtn" onclick="showAlerts()" style="display:none">
        🔔 告警 <span id="alertCount">0</span>
      </button>
      <span class="refresh-info" id="refreshInfo">{{ _('上次更新') }}: -</span>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading"><div class="lo"><div class="s"></div>{{ _('加载巡检数据...') }}</div></div>

  <!-- Tabs -->
  <div class="tabs" id="mainTabs" style="display:none">
    <div class="tab active" data-tab="overview" onclick="switchTab('overview')">📊 {{ _('Overview') }}</div>
    <div class="tab" data-tab="details" onclick="switchTab('details')">📋 {{ _('详细报告') }}</div>
    <div class="tab" data-tab="history" onclick="switchTab('history')">📜 {{ _('巡检历史') }}</div>
    <div class="tab" data-tab="trend" onclick="switchTab('trend')">📈 {{ _('趋势') }}</div>
    <div class="tab" data-tab="checks" onclick="switchTab('checks')">⚙️ {{ _('检查项配置') }}</div>
  </div>

  <!-- Tab: Overview -->
  <div id="tab-overview" class="tab-content" style="display:none"></div>

  <!-- Tab: Details -->
  <div id="tab-details" class="tab-content" style="display:none">
    <div class="filter-bar" id="detailFilter"></div>
    <div id="detailList"><div class="lo"><div class="s"></div></div></div>
  </div>

  <!-- Tab: History -->
  <div id="tab-history" class="tab-content" style="display:none">
    <div class="filter-bar" id="histFilter"></div>
    <div id="histList"><div class="lo"><div class="s"></div></div></div>
  </div>

  <!-- Tab: Trend -->
  <div id="tab-trend" class="tab-content" style="display:none">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-sm trend-days-btn active" onclick="loadTrend(7)">{{ _('7 days') }}</button>
      <button class="btn btn-sm trend-days-btn" onclick="loadTrend(14)">{{ _('14天') }}</button>
      <button class="btn btn-sm trend-days-btn" onclick="loadTrend(30)">{{ _('30 Days') }}</button>
    </div>
    <div class="glass-card">
      <div class="ct">{{ _('健康趋势') }}</div>
      <div id="trendChart"></div>
    </div>
    <div class="glass-card">
      <div class="ct">{{ _('每日健康分') }}</div>
      <div id="scoreChart"></div>
    </div>
  </div>

  <!-- Tab: Checks Config -->
  <div id="tab-checks" class="tab-content" style="display:none">
    <div id="checksList"><div class="lo"><div class="s"></div></div></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>{{ _('检查详情 ') }}<button class="btn btn-sm" style="margin-left:auto" onclick="closeModal()">✕</button></h3>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Alert Modal -->
  <div class="modal-overlay" id="alertModal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()" style="max-width:600px">
      <h3>🔔 {{ _('告警列表 ') }}<button class="btn btn-sm" style="margin-left:auto" onclick="closeModal()">✕</button></h3>
      <div id="alertBody"></div>
    </div>
  </div>
</div>

<script>
var T = localStorage.getItem("sso_token") || localStorage.getItem("tm_token") || localStorage.getItem("token");
var API = '/admin/health/api';
var _token = T;
var _dataCache = {};

// 在已加载的文档中间（iframe/admin 注入），DOMContentLoaded 不会再触发
if (document.readyState==='loading') {
  document.addEventListener('DOMContentLoaded', function(){ loadStatus(); });
} else {
  loadStatus();
}

// ── Tab Switching ──
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.tab[data-tab="'+tab+'"]').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(t){t.style.display='none'});
  document.getElementById('tab-'+tab).style.display='block';

  if (tab === 'details') loadDetails();
  else if (tab === 'history') loadHistory();
  else if (tab === 'trend') loadTrend(7);
  else if (tab === 'checks') loadChecks();
}

// ── Load Status ──
function loadStatus() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('mainTabs').style.display = 'none';
  document.querySelectorAll('.tab-content').forEach(function(t){t.style.display='none'});

  fetch(API+'/status', {headers:{'Authorization':'Bearer '+_token}})
    .then(function(r){return r.json()})
    .then(function(d){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('mainTabs').style.display = 'flex';
      document.getElementById('tab-overview').style.display = 'block';
      if (d.success && d.data) {
        renderOverview(d.data);
        _dataCache.status = d.data;
      }
      document.getElementById('refreshInfo').textContent = '{{ _('上次更新') }}: ' + new Date().toLocaleTimeString();
    })
    .catch(function(){
      document.getElementById('loading').innerHTML = '<div class="lo" style="color:var(--red)">❌ {{ _('加载失败，请检查网络') }}</div>';
    });
}

// ── Render Overview ──
function renderOverview(data) {
  var latest = data.latest_run;
  var h = '';

  // Stats cards
  h += '<div class="stats-row">';
  if (latest) {
    var total = latest.total_checks || 0;
    var passed = latest.passed || 0;
    var warnings = latest.warnings || 0;
    var errors = latest.errors || 0;
    var pct = total > 0 ? Math.round(passed * 100 / total) : 100;
    h += '<div class="stat-card '+(errors>0?'error':warnings>0?'warning':'passed')+'">';
    h += '<div class="label">{{ _('健康度') }}</div>';
    h += '<div class="value '+(pct>=90?'green':pct>=70?'yellow':'red')+'">'+pct+'%</div>';
    h += '<div class="sub">'+(errors>0?errors+' {{ _('Abnormal') }}':warnings>0?warnings+' {{ _('警告') }}':'{{ _('全部正常') }}')+'</div></div>';

    h += '<div class="stat-card passed"><div class="label">{{ _('Active') }}</div><div class="value green">'+passed+'</div><div class="sub">/'+total+' 项</div></div>';
    h += '<div class="stat-card warning"><div class="label">{{ _('警告') }}</div><div class="value yellow">'+warnings+'</div><div class="sub">{{ _('需关注') }}</div></div>';
    h += '<div class="stat-card error"><div class="label">{{ _('Abnormal') }}</div><div class="value red">'+errors+'</div><div class="sub">{{ _('需立即处理') }}</div></div>';

    var ms = latest.duration_ms || 0;
    h += '<div class="stat-card passed"><div class="label">{{ _('巡检耗时') }}</div><div class="value" style="font-size:22px">'+ms+'ms</div>';
    h += '<div class="sub">'+esc(latest.trigger_type=='manual'?'{{ _('Manual') }}':'{{ _('Auto') }}')+' · '+esc(latest.created_at||'')+'</div></div>';
  }
  h += '</div>';

  // Category Breakdown
  if (data.categories) {
    h += '<div class="glass-card"><div class="ct">{{ _('分类状态') }}</div><div class="cat-grid">';
    var catNames = {
      'system':'🔧 {{ _('System') }}', 'external':'🌐 {{ _('外部依赖') }}', 'workflow':'⚡ {{ _('Workflow') }}',
      'agent':'🤖 Agent', 'cms':'📄 {{ _('Content') }}', 'community':'🌍 {{ _('Community') }}',
      'ssl':'🔒 SSL', 'error':'📝 {{ _('Log') }}'
    };
    for (var cat in data.categories) {
      var c = data.categories[cat];
      var pct = c.total>0 ? Math.round(c.passed*100/c.total) : 0;
      var cls = c.error>0?'red':c.warning>0?'yellow':'green';
      h += '<div class="cat-card"><div class="cat-h">';
      h += '<span class="cat-name">'+(catNames[cat]||cat)+'</span>';
      h += '<span class="cat-count" style="color:var(--'+cls+')">'+pct+'% · '+c.passed+'/'+c.total+'</span>';
      h += '</div>';

      // Items from latest run
      if (latest && latest.items) {
        var items = latest.items.filter(function(i){return i.category==cat});
        items.forEach(function(i){
          var st = i.status == 'passed' ? 'green' : (i.status == 'warning' ? 'yellow' : 'red');
          h += '<div class="cat-item" onclick="showDetail('+i.id+')" style="cursor:pointer">';
          h += '<div class="ci-left"><span class="status-dot '+st+'"></span>'+esc(i.check_name)+'</div>';
          h += '<div class="ci-right">'+i.response_time_ms+'ms · '+esc(i.message||'').substring(0,40)+'</div>';
          h += '</div>';
        });
      }
      h += '</div>';
    }
    h += '</div></div>';
  }

  // Alerts section
  if (data.unread_alerts > 0) {
    document.getElementById('alertBtn').style.display = 'inline-flex';
    document.getElementById('alertCount').textContent = data.unread_alerts;
  }

  document.getElementById('tab-overview').innerHTML = h;
}

// ── Run Check ──
function runCheck() {
  var btn = document.querySelector('.btn-primary');
  btn.disabled = true;
  btn.innerHTML = '<div class="s" style="width:14px;height:14px;border-width:2px"></div> {{ _('巡检中...') }}';

  fetch(API+'/run', {
    method:'POST',
    headers:{'Authorization':'Bearer '+_token, 'Content-Type':'application/json'},
    body:'{}'
  }).then(function(r){return r.json()})
  .then(function(d){
    if (d.success) {
      showToast('✅ {{ _('巡检已启动，5秒后自动刷新') }}');
      setTimeout(loadStatus, 5000);
    }
  }).catch(function(){})
  .finally(function(){
    btn.disabled = false;
    btn.innerHTML = '⚡ {{ _('立即巡检') }}';
  });
}

// ── Detail View ──
function loadDetails(filter) {
  var container = document.getElementById('detailList');
  container.innerHTML = '<div class="lo"><div class="s"></div></div>';

  fetch(API+'/status', {headers:{'Authorization':'Bearer '+_token}})
    .then(function(r){return r.json()})
    .then(function(d){
      if (!d.success || !d.data || !d.data.latest_run) {
        container.innerHTML = '<div class="lo" style="color:var(--dim)">{{ _('No data') }}</div>';
        return;
      }
      var items = d.data.latest_run.items || [];
      renderDetailFilter(items);
      renderDetailTable(items, filter);
    }).catch(function(){
      container.innerHTML = '<div class="lo" style="color:var(--red)">{{ _('Load failed') }}</div>';
    });
}

function renderDetailFilter(items) {
  var cats = {};
  items.forEach(function(i){cats[i.category]=true});
  var h = '<button class="filter-btn active" onclick="filterDetail(this,\'\')">{{ _('全部 (') }}'+items.length+')</button>';
  var catNames = {'system':'{{ _('System') }}','external':'{{ _('外部') }}','workflow':'{{ _('Workflow') }}','agent':'Agent','cms':'{{ _('Content') }}','community':'{{ _('Community') }}','ssl':'SSL','error':'{{ _('Log') }}'};
  for (var cat in cats) {
    var cnt = items.filter(function(i){return i.category==cat}).length;
    h += '<button class="filter-btn" onclick="filterDetail(this,\''+cat+'\')">'+(catNames[cat]||cat)+' ('+cnt+')</button>';
  }
  document.getElementById('detailFilter').innerHTML = h;
}

function filterDetail(el, cat) {
  document.querySelectorAll('#detailFilter .filter-btn').forEach(function(b){b.classList.remove('active')});
  el.classList.add('active');
  renderDetailTable((_dataCache.status && _dataCache.status.latest_run ? _dataCache.status.latest_run.items : []), cat);
}

function renderDetailTable(items, filter) {
  var filtered = filter ? items.filter(function(i){return i.category==filter}) : items;
  var h = '<div class="glass-card"><table><tr><th>{{ _('Status') }}</th><th>{{ _('Name') }}</th><th>{{ _('Categories') }}</th><th>{{ _('Response') }}</th><th>{{ _('信息') }}</th></tr>';
  filtered.forEach(function(i){
    var st = i.status == 'passed' ? 'green' : (i.status == 'warning' ? 'yellow' : 'red');
    h += '<tr onclick="showDetail('+i.id+')" style="cursor:pointer">';
    h += '<td><span class="status-dot '+st+'"></span></td>';
    h += '<td>'+esc(i.check_name||'')+'</td>';
    h += '<td style="color:var(--dim)">'+esc(i.category||'')+'</td>';
    h += '<td>'+(i.response_time_ms||0)+'ms</td>';
    h += '<td style="color:var(--dim);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(i.message||'')+'</td>';
    h += '</tr>';
  });
  h += '</table></div>';
  document.getElementById('detailList').innerHTML = h;
}

// ── Show Detail Modal ──
function showDetail(itemId) {
  var items = _dataCache.status && _dataCache.status.latest_run ? _dataCache.status.latest_run.items : [];
  var item = items.find(function(i){return i.id==itemId});
  if (!item) return;

  var st = item.status == 'passed' ? '✅ {{ _('Active') }}' : (item.status == 'warning' ? '⚠️ {{ _('警告') }}' : '❌ {{ _('Error') }}');
  var stClass = item.status == 'passed' ? 'green' : (item.status == 'warning' ? 'yellow' : 'red');
  var h = '<table><tr><td style="width:100px;color:var(--dim)">{{ _('Name') }}</td><td>'+esc(item.check_name)+'</td></tr>';

function loadTrend(days) {
  document.querySelectorAll('.trend-days-btn').forEach(function(b){b.classList.remove('active')});
  event && event.target ? event.target.classList.add('active') : document.querySelector('.trend-days-btn').classList.add('active');

  fetch(API+'/trend?days='+days, {headers:{'Authorization':'Bearer '+_token}})

      renderTrendChart(d.data.trend);
      renderScoreChart(d.data.trend);
    });

function renderTrendChart(trend) {
  if (!trend || trend.length === 0) {
    document.getElementById('trendChart').innerHTML = '<div style="text-align:center;color:var(--dim);padding:20px">{{ _('暂无趋势数据，请执行一次巡检') }}</div>';
    return;
  }
  var maxCount = 0;
  trend.forEach(function(t){maxCount = Math.max(maxCount, t.total_checks)});
  maxCount = Math.max(maxCount, 1);

  // Stacked bars
  var h = '<div class="trend-chart">';
  trend.forEach(function(t){
    var total = t.total_checks || 1;
    var passedPct = (t.passed || 0) / total * 100;
    var warnPct = (t.warnings || 0) / total * 100;
    var errPct = (t.errors || 0) / total * 100;
    var height = Math.max(4, (total / maxCount) * 80);
    h += '<div class="trend-bar" style="height:'+height+'px;display:flex;flex-direction:column;width:100%">';
    if (t.errors > 0) h += '<div style="flex:'+errPct+';background:var(--red);border-radius:3px 3px 0 0;min-height:2px" title="{{ _('Abnormal') }}:'+t.errors+'"></div>';
    if (t.warnings > 0) h += '<div style="flex:'+warnPct+';background:var(--yellow);min-height:2px" title="{{ _('警告') }}:'+t.warnings+'"></div>';
    h += '<div style="flex:'+passedPct+';background:var(--green);min-height:2px" title="{{ _('Active') }}:'+t.passed+'"></div>';
    h += '<div class="tooltip">'+esc(t.date)+': ✅'+t.passed+' ⚠️'+t.warnings+' ❌'+t.errors+'</div>';
    h += '</div>';
  });
  h += '</div><div class="trend-labels">';
  var step = Math.max(1, Math.floor(trend.length / 7));
  trend.forEach(function(t, i){
    if (i % step === 0 || i === trend.length-1) {
      h += '<span>'+t.date.slice(5)+'</span>';
    }
  });
  h += '</div>';
  document.getElementById('trendChart').innerHTML = h;
}

function renderScoreChart(trend) {
  if (!trend || trend.length === 0) {
    document.getElementById('scoreChart').innerHTML = '<div style="text-align:center;color:var(--dim);padding:20px">{{ _('No data') }}</div>';
    return;
  }
  var h = '<div class="trend-chart">';
  trend.forEach(function(t){
    var score = t.health_score || 100;
    var clr = score >= 90 ? 'var(--green)' : (score >= 70 ? 'var(--yellow)' : 'var(--red)');
    var height = Math.max(4, (score / 100) * 80);
    h += '<div class="trend-bar" style="height:'+height+'px;background:'+clr+'">';
    h += '<div class="tooltip">'+esc(t.date)+': '+score+'{{ _('pts') }}</div></div>';
  });
  h += '</div><div class="trend-labels">';
  var step = Math.max(1, Math.floor(trend.length / 7));
  trend.forEach(function(t, i){
    if (i % step === 0 || i === trend.length-1) {
      h += '<span>'+t.date.slice(5)+'</span>';
    }
  });
  h += '</div>';
  document.getElementById('scoreChart').innerHTML = h;
}

// ── 从注册表一键添加 ──
function addFromRegistry(checkKey) {
  fetch(API+'/checkers/register', {
    method:'POST',
    headers:{'Authorization':'Bearer '+_token, 'Content-Type':'application/json'},
    body:JSON.stringify({check_key: checkKey})
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) {
      showToast('✅ {{ _('已添加检查项') }}: '+checkKey);
      loadChecks();
    } else {
      showToast('❌ '+d.error);
    }
  }).catch(function(){showToast('❌ {{ _('Request Failed') }}')});
}

// ── 切换启用/禁用 ──
function toggleCheck(id, active) {
  fetch(API+'/checks/'+id, {
    method:'PUT',
    headers:{'Authorization':'Bearer '+_token, 'Content-Type':'application/json'},
    body:JSON.stringify({is_active:active?1:0})
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) showToast(active?'✅ {{ _('Enabled') }}':'⏸️ {{ _('Disabled') }}');
  });
}

// ── 更新排序 ──
function updateSort(id, val) {
  fetch(API+'/checks/'+id, {
    method:'PUT',
    headers:{'Authorization':'Bearer '+_token, 'Content-Type':'application/json'},
    body:JSON.stringify({sort_order: parseInt(val)||50})
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) showToast('✅ {{ _('排序已更新') }}');
  });
}

// ── 配置编辑器切换 ──
function toggleConfigEditor(id) {
  var row = document.getElementById('config-row-'+id);
  if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

// ── 保存配置 ──
function saveConfig(id) {
  var editor = document.getElementById('config-editor-'+id);
  if (!editor) return;
  try {
    var config = JSON.parse(editor.value);
    fetch(API+'/checks/'+id, {
      method:'PUT',
      headers:{'Authorization':'Bearer '+_token, 'Content-Type':'application/json'},
      body:JSON.stringify({config: config})
    }).then(function(r){return r.json()}).then(function(d){
      if (d.success) showToast('✅ {{ _('配置已保存') }}');
      else showToast('❌ {{ _('Save failed') }}: '+d.error);
    });
  } catch(e) {
    showToast('❌ JSON {{ _('Invalid Format') }}: '+e.message);
  }
}

// ── 删除检查项 ──
function deleteCheck(id, name) {
  if (!confirm('{{ _('确定要删除检查项') }}「'+name+'」{{ _('吗？') }}')) return;
  fetch(API+'/checks/'+id, {
    method:'DELETE',
    headers:{'Authorization':'Bearer '+_token}
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) { showToast('✅ {{ _('Deleted') }}'); loadChecks(); }
    else showToast('❌ '+d.error);
  });
}

// ── 手动添加自定义检查 ──
function addCustomCheck() {
  var key = document.getElementById('newKey').value.trim();
  var name = document.getElementById('newName').value.trim();
  if (!key) { showToast('❌ {{ _('请输入 check_key') }}'); return; }

  fetch(API+'/checkers/register', {
    method:'POST',
    headers:{'Authorization':'Bearer '+_token, 'Content-Type':'application/json'},
    body:JSON.stringify({
      check_key: key,
      name: name || key,
      category: document.getElementById('newCat').value,
      severity: document.getElementById('newSev').value,
      description: '{{ _('自定义检查项') }}'
    })
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) {
      showToast('✅ {{ _('Added') }}');
      document.getElementById('newKey').value = '';
      document.getElementById('newName').value = '';
      loadChecks();
    } else showToast('❌ '+d.error);
  });
}

          h += '<td>'+esc(a.check_name)+'</td>';
          h += '<td><span class="status-dot '+st+'"></span>'+esc(a.status)+'</td>';
          h += '<td style="color:var(--dim);max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.message||'')+'</td></tr>';
        });
        h += '</table>';
      }
      h += '<div style="margin-top:10px;text-align:right"><button class="btn btn-sm" onclick="markAlertsRead()">{{ _('全部标记已读') }}</button></div>';
      document.getElementById('alertBody').innerHTML = h;
      document.getElementById('alertModal').classList.add('show');
    });
}

function markAlertsRead() {
  fetch(API+'/alerts/read', {
    method:'POST',
    headers:{'Authorization':'Bearer '+_token, 'Content-Type':'application/json'},
    body:'{}'
  }).then(function(r){return r.json()}).then(function(d){
    if (d.success) {
      document.getElementById('alertBtn').style.display = 'none';
      showToast('✅ {{ _('已全部标记已读') }}');
      closeModal();
    }
  });
}

// ── Export Report ──
function exportReport() {
  fetch(API+'/export', {headers:{'Authorization':'Bearer '+_token}})
    .then(function(r){return r.json()})
    .then(function(d){
      if (!d.success || !d.data) { showToast('❌ {{ _('暂无报告可导出') }}'); return; }
      var blob = new Blob([JSON.stringify(d.data, null, 2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'health-report-'+new Date().toISOString().slice(0,10)+'.json';
      a.click();
      showToast('✅ {{ _('报告已导出') }}');
    }).catch(function(){showToast('❌ {{ _('导出失败') }}')});
}

// ── Utilities ──
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}

function showToast(msg, type){
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12px;z-index:200;color:var(--text);box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .3s';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},300)}, 2000);
}

function closeModal(e){
  if(!e || e.target.classList.contains('modal-overlay')){
    document.querySelectorAll('.modal-overlay').forEach(function(m){m.classList.remove('show')});
  }
}

// Auto-refresh every 60s
setInterval(function(){
  if (document.querySelector('.tab.active') && document.querySelector('.tab.active').dataset.tab === 'overview') {
    fetch(API+'/status', {headers:{'Authorization':'Bearer '+_token}})
      .then(function(r){return r.json()})
      .then(function(d){
        if (d.success && d.data) {
          renderOverview(d.data);
          _dataCache.status = d.data;
          document.getElementById('refreshInfo').textContent = '{{ _('上次更新') }}: ' + new Date().toLocaleTimeString();
        }
      }).catch(function(){});
  }
}, 60000);
</script>
